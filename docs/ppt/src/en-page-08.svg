<text x="56" y="426" font-family="PingFang SC" font-size="9" font-weight="400" fill="#A6B3C6">Setup: AMD Ryzen 7 7800X3D (16 CPUs) · Ubuntu 24.04 · nginx 1.31.4 / Caddy 2.10.2 / Traefik 3.5.0;</text>
<text x="56" y="442" font-family="PingFang SC" font-size="9" font-weight="400" fill="#A6B3C6">one host, loopback, 6 server CPUs, Linux host networking; data: bench/results/plan-2026-10-30.</text>
<text x="56" y="464" font-family="PingFang SC" font-size="9" font-weight="500" fill="#C2740A">Straight reading: proxying to a backend is still 66–78% of nginx, and 40k idle-connection throughput trails it.</text>
