<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540">
<rect width="960" height="540" fill="#F7F9FC"/>
<rect x="56" y="42" width="18" height="3" rx="1.5" fill="#2F6BFF"/>
<text x="82" y="52" font-family="PingFang SC" font-size="10.5" font-weight="500" fill="#6B7A90">06 / 治理</text>
<text x="56" y="96" font-family="PingFang SC" font-size="32" font-weight="600" fill="#0B1220">把流量交给策略，而不是脚本</text>
<text x="56" y="126" font-family="PingFang SC" font-size="14" font-weight="400" fill="#3B4A61">负载均衡、健康检查、韧性与准入控制都是配置里的字段，不是外挂的 Lua 或插件。</text>
<line x1="56" y1="150" x2="904" y2="150" stroke="#E3E9F2" stroke-width="1"/>
<rect x="56" y="172" width="424" height="136" rx="10" fill="#FFFFFF" stroke="#E3E9F2" stroke-width="1"/>
<rect x="56" y="190" width="4" height="100" rx="2" fill="#2F6BFF"/>
<text x="84" y="212" font-family="PingFang SC" font-size="16" font-weight="600" fill="#0B1220">负载均衡</text>
<rect x="160" y="195" width="56.6" height="20" rx="10.0" fill="#EAF0FF"/><text x="169" y="209" font-family="PingFang SC" font-size="10" font-weight="500" fill="#2F6BFF">9 种策略</text>
<text x="84" y="242" font-family="PingFang SC" font-size="11.5" font-weight="400" fill="#3B4A61">轮询 · 加权轮询 · 最少连接 · 随机 · P2C · IP / URI / Header /</text>
<text x="84" y="260" font-family="PingFang SC" font-size="11.5" font-weight="400" fill="#3B4A61">Cookie 一致性哈希 · 粘性 cookie</text>
<rect x="480" y="172" width="424" height="136" rx="10" fill="#FFFFFF" stroke="#E3E9F2" stroke-width="1"/>
<rect x="480" y="190" width="4" height="100" rx="2" fill="#0FA97A"/>
<text x="508" y="212" font-family="PingFang SC" font-size="16" font-weight="600" fill="#0B1220">健康检查</text>
<rect x="584" y="195" width="69.6" height="20" rx="10.0" fill="#E6F7F1"/><text x="593" y="209" font-family="PingFang SC" font-size="10" font-weight="500" fill="#0FA97A">主动 + 被动</text>
<text x="508" y="242" font-family="PingFang SC" font-size="11.5" font-weight="400" fill="#3B4A61">主动 HTTP / TCP 探测；被动 max_fails 与 fail_timeout；连续失败</text>
<text x="508" y="260" font-family="PingFang SC" font-size="11.5" font-weight="400" fill="#3B4A61">即出轮，恢复后自动回归。</text>
<rect x="56" y="324" width="424" height="136" rx="10" fill="#FFFFFF" stroke="#E3E9F2" stroke-width="1"/>
<rect x="56" y="342" width="4" height="100" rx="2" fill="#C2740A"/>
<text x="84" y="364" font-family="PingFang SC" font-size="16" font-weight="600" fill="#0B1220">韧性</text>
<rect x="128" y="347" width="101.0" height="20" rx="10.0" fill="#FDF3E3"/><text x="137" y="361" font-family="PingFang SC" font-size="10" font-weight="500" fill="#C2740A">重试 · 熔断 · 超时</text>
<text x="84" y="394" font-family="PingFang SC" font-size="11.5" font-weight="400" fill="#3B4A61">预算内重试、熔断器、连接 / 响应 / 空闲超时；按权重镜像与故障转移</text>
<text x="84" y="412" font-family="PingFang SC" font-size="11.5" font-weight="400" fill="#3B4A61">到备用上游。</text>
<rect x="480" y="324" width="424" height="136" rx="10" fill="#FFFFFF" stroke="#E3E9F2" stroke-width="1"/>
<rect x="480" y="342" width="4" height="100" rx="2" fill="#D93654"/>
<text x="508" y="364" font-family="PingFang SC" font-size="16" font-weight="600" fill="#0B1220">准入控制</text>
<rect x="584" y="347" width="101.0" height="20" rx="10.0" fill="#FCE9ED"/><text x="593" y="361" font-family="PingFang SC" font-size="10" font-weight="500" fill="#D93654">限流 · 并发 · 体积</text>
<text x="508" y="394" font-family="PingFang SC" font-size="11.5" font-weight="400" fill="#3B4A61">按客户端 IP、Header 或路由限流；并发上限、请求体上限、连接上限</text>
<text x="508" y="412" font-family="PingFang SC" font-size="11.5" font-weight="400" fill="#3B4A61">与写停顿超时。</text>
<text x="56" y="516" font-family="PingFang SC" font-size="9.5" font-weight="400" fill="#A6B3C6">fit · 基于 fib 的反向代理、负载均衡与 API 网关</text>
<text x="904" y="516" font-family="PingFang SC" font-size="9.5" font-weight="500" fill="#A6B3C6" text-anchor="end">07 / 16</text>
</svg>
