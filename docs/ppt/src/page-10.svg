<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540">
<rect width="960" height="540" fill="#F7F9FC"/>
<rect x="56" y="42" width="18" height="3" rx="1.5" fill="#2F6BFF"/>
<text x="82" y="52" font-family="PingFang SC" font-size="10.5" font-weight="500" fill="#6B7A90">09 / 运维</text>
<text x="56" y="96" font-family="PingFang SC" font-size="32" font-weight="600" fill="#0B1220">改配置不用重启，也不用担心改坏</text>
<text x="56" y="126" font-family="PingFang SC" font-size="14" font-weight="400" fill="#3B4A61">每一次变更都走同一条路径：先构建完整的新图，成功了才替换。</text>
<line x1="56" y1="150" x2="904" y2="150" stroke="#E3E9F2" stroke-width="1"/>
<circle cx="75" cy="198" r="17" fill="#EAF0FF"/>
<text x="75" y="203" font-family="PingFang SC" font-size="12" font-weight="600" fill="#2F6BFF" text-anchor="middle">1</text>
<line x1="98" y1="198" x2="246" y2="198" stroke="#CBD6E8" stroke-width="1" stroke-dasharray="3 4"/>
<text x="102" y="194" font-family="PingFang SC" font-size="13.5" font-weight="600" fill="#0B1220">校验</text>
<text x="102" y="214" font-family="PingFang SC" font-size="10.5" font-weight="400" fill="#3B4A61">fit validate 或 schema 不通</text>
<text x="102" y="229.5" font-family="PingFang SC" font-size="10.5" font-weight="400" fill="#3B4A61">过，就根本不换。</text>
<circle cx="292" cy="198" r="17" fill="#EAF0FF"/>
<text x="292" y="203" font-family="PingFang SC" font-size="12" font-weight="600" fill="#2F6BFF" text-anchor="middle">2</text>
<line x1="315" y1="198" x2="463" y2="198" stroke="#CBD6E8" stroke-width="1" stroke-dasharray="3 4"/>
<text x="319" y="194" font-family="PingFang SC" font-size="13.5" font-weight="600" fill="#0B1220">provision 新图</text>
<text x="319" y="214" font-family="PingFang SC" font-size="10.5" font-weight="400" fill="#3B4A61">证书、健康检查、连接池全部</text>
<text x="319" y="229.5" font-family="PingFang SC" font-size="10.5" font-weight="400" fill="#3B4A61">就绪。</text>
<circle cx="509" cy="198" r="17" fill="#EAF0FF"/>
<text x="509" y="203" font-family="PingFang SC" font-size="12" font-weight="600" fill="#2F6BFF" text-anchor="middle">3</text>
<line x1="532" y1="198" x2="680" y2="198" stroke="#CBD6E8" stroke-width="1" stroke-dasharray="3 4"/>
<text x="536" y="194" font-family="PingFang SC" font-size="13.5" font-weight="600" fill="#0B1220">原子替换</text>
<text x="536" y="214" font-family="PingFang SC" font-size="10.5" font-weight="400" fill="#3B4A61">指针一换，新请求即走新图。</text>
<circle cx="726" cy="198" r="17" fill="#EAF0FF"/>
<text x="726" y="203" font-family="PingFang SC" font-size="12" font-weight="600" fill="#2F6BFF" text-anchor="middle">4</text>
<text x="753" y="194" font-family="PingFang SC" font-size="13.5" font-weight="600" fill="#0B1220">旧图排空</text>
<text x="753" y="214" font-family="PingFang SC" font-size="10.5" font-weight="400" fill="#3B4A61">在途请求跑完，引用归零后释</text>
<text x="753" y="229.5" font-family="PingFang SC" font-size="10.5" font-weight="400" fill="#3B4A61">放。</text>
<rect x="56" y="282" width="848" height="54" rx="8" fill="#F1F5FF" stroke="#D6E2FF" stroke-width="1"/>
<text x="76" y="315" font-family="PingFang SC" font-size="11.5" font-weight="500" fill="#2A3D5C">2,000 次热切换 / 6 秒 / 8 个并发客户端，约 337,000 个请求与 32 条长下载，零失败。</text>
<rect x="56" y="356" width="266" height="120" rx="10" fill="#FFFFFF" stroke="#E3E9F2" stroke-width="1"/>
<text x="78" y="384" font-family="PingFang SC" font-size="13" font-weight="600" fill="#0B1220">Admin API</text>
<text x="78" y="404" font-family="PingFang SC" font-size="10.5" font-weight="400" fill="#3B4A61">GET / PUT / PATCH / DELETE /config；</text>
<text x="78" y="419.5" font-family="PingFang SC" font-size="10.5" font-weight="400" fill="#3B4A61">ETag 防止丢更新；历史版本与回滚；</text>
<text x="78" y="435" font-family="PingFang SC" font-size="10.5" font-weight="400" fill="#3B4A61">/config/effective 看生效配置及来源。</text>
<rect x="347" y="356" width="266" height="120" rx="10" fill="#FFFFFF" stroke="#E3E9F2" stroke-width="1"/>
<text x="369" y="384" font-family="PingFang SC" font-size="13" font-weight="600" fill="#0B1220">加密 store</text>
<text x="369" y="404" font-family="PingFang SC" font-size="10.5" font-weight="400" fill="#3B4A61">配置加密保存在 admin.store（Argon2id +</text>
<text x="369" y="419.5" font-family="PingFang SC" font-size="10.5" font-weight="400" fill="#3B4A61">XChaCha20-Poly1305）；fit store export /</text>
<text x="369" y="435" font-family="PingFang SC" font-size="10.5" font-weight="400" fill="#3B4A61">import 迁移。</text>
<rect x="638" y="356" width="266" height="120" rx="10" fill="#FFFFFF" stroke="#E3E9F2" stroke-width="1"/>
<text x="660" y="384" font-family="PingFang SC" font-size="13" font-weight="600" fill="#0B1220">Web 控制台</text>
<text x="660" y="404" font-family="PingFang SC" font-size="10.5" font-weight="400" fill="#3B4A61">登录后修改全部配置，所有页面合成一个</text>
<text x="660" y="419.5" font-family="PingFang SC" font-size="10.5" font-weight="400" fill="#3B4A61">workbench；改完写回 store，与文件配置同一</text>
<text x="660" y="435" font-family="PingFang SC" font-size="10.5" font-weight="400" fill="#3B4A61">套校验。</text>
<text x="56" y="516" font-family="PingFang SC" font-size="9.5" font-weight="400" fill="#A6B3C6">fit · 基于 fib 的反向代理、负载均衡与 API 网关</text>
<text x="904" y="516" font-family="PingFang SC" font-size="9.5" font-weight="500" fill="#A6B3C6" text-anchor="end">10 / 16</text>
</svg>
