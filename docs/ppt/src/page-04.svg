<text x="56" y="96" font-family="PingFang SC" font-size="32" font-weight="600" fill="#0B1220">控制面与数据面分离</text>
<text x="56" y="126" font-family="PingFang SC" font-size="14" font-weight="400" fill="#3B4A61">配置只编译成不可变的运行时图；数据面通过一个原子指针读它，请求路径上没有阻塞调用。</text>
