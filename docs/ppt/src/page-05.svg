<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540">
<rect width="960" height="540" fill="#F7F9FC"/>
<rect x="56" y="42" width="18" height="3" rx="1.5" fill="#2F6BFF"/>
<text x="82" y="52" font-family="PingFang SC" font-size="10.5" font-weight="500" fill="#6B7A90">04 / 性能来源</text>
<text x="56" y="96" font-family="PingFang SC" font-size="32" font-weight="600" fill="#0B1220">请求路径上，没有一个 goroutine</text>
<text x="56" y="126" font-family="PingFang SC" font-size="14" font-weight="400" fill="#3B4A61">fit 不把每个连接交给一个 goroutine —— 数据面直接跑在 fib 的事件循环上。</text>
<line x1="56" y1="150" x2="904" y2="150" stroke="#E3E9F2" stroke-width="1"/>
<text x="56" y="184" font-family="PingFang SC" font-size="10" font-weight="600" fill="#2F6BFF">01</text>
<text x="82" y="190" font-family="PingFang SC" font-size="15" font-weight="600" fill="#0B1220">空闲连接几乎不占内存</text>
<text x="82" y="212" font-family="PingFang SC" font-size="11.5" font-weight="400" fill="#3B4A61">只保留一个连接结构；读写缓冲借用一轮即归还，没有常驻 bufio 栈。</text>
<text x="56" y="280" font-family="PingFang SC" font-size="10" font-weight="600" fill="#2F6BFF">02</text>
<text x="82" y="286" font-family="PingFang SC" font-size="15" font-weight="600" fill="#0B1220">背压是端到端单向的</text>
<text x="82" y="308" font-family="PingFang SC" font-size="11.5" font-weight="400" fill="#3B4A61">HoldReads 把慢客户端的等待传回上游；写 watermark 与全局待发字节预</text>
<text x="82" y="326" font-family="PingFang SC" font-size="11.5" font-weight="400" fill="#3B4A61">算兜底。</text>
<text x="56" y="376" font-family="PingFang SC" font-size="10" font-weight="600" fill="#2F6BFF">03</text>
<text x="82" y="382" font-family="PingFang SC" font-size="15" font-weight="600" fill="#0B1220">静态文件接近零拷贝</text>
<text x="82" y="404" font-family="PingFang SC" font-size="11.5" font-weight="400" fill="#3B4A61">sendfile、内存文件缓存与预压缩孪生文件，命中即写。</text>
<text x="500" y="184" font-family="PingFang SC" font-size="10" font-weight="600" fill="#2F6BFF">04</text>
<text x="526" y="190" font-family="PingFang SC" font-size="15" font-weight="600" fill="#0B1220">可阻塞的工作有界外置</text>
<text x="526" y="212" font-family="PingFang SC" font-size="11.5" font-weight="400" fill="#3B4A61">外部认证、插件与磁盘缓存未命中放在各自的池里，池间单向等待。</text>
<text x="500" y="280" font-family="PingFang SC" font-size="10" font-weight="600" fill="#2F6BFF">05</text>
<text x="526" y="286" font-family="PingFang SC" font-size="15" font-weight="600" fill="#0B1220">需要时可 prefork</text>
<text x="526" y="308" font-family="PingFang SC" font-size="11.5" font-weight="400" fill="#3B4A61">按 CPU 隔离堆与 GC，SO_REUSEPORT 共享端口，行为与 nginx 的</text>
<text x="526" y="326" font-family="PingFang SC" font-size="11.5" font-weight="400" fill="#3B4A61">worker 一致。</text>
<rect x="500" y="356" width="404" height="112" rx="10" fill="#F1F5FF" stroke="#D6E2FF" stroke-width="1"/>
<text x="520" y="380" font-family="PingFang SC" font-size="9.5" font-weight="600" fill="#2F6BFF">对比</text>
<text x="520" y="402" font-family="PingFang SC" font-size="11.5" font-weight="400" fill="#2A3D5C">40,000 个空闲 TLS 连接：fit 475 MiB，nginx 1,305 MiB。Caddy 与</text>
<text x="520" y="420" font-family="PingFang SC" font-size="11.5" font-weight="400" fill="#2A3D5C">Traefik 的差距来自 net/http —— 每连接一个 goroutine。</text>
<text x="56" y="516" font-family="PingFang SC" font-size="9.5" font-weight="400" fill="#A6B3C6">fit · 基于 fib 的反向代理、负载均衡与 API 网关</text>
<text x="904" y="516" font-family="PingFang SC" font-size="9.5" font-weight="500" fill="#A6B3C6" text-anchor="end">05 / 16</text>
</svg>
