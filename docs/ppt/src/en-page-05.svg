<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540">
<rect width="960" height="540" fill="#F7F9FC"/>
<rect x="56" y="42" width="18" height="3" rx="1.5" fill="#2F6BFF"/>
<text x="82" y="52" font-family="PingFang SC" font-size="10.5" font-weight="500" fill="#6B7A90">04 / Why it is fast</text>
<text x="56" y="96" font-family="PingFang SC" font-size="32" font-weight="600" fill="#0B1220">No goroutine on the request path</text>
<text x="56" y="126" font-family="PingFang SC" font-size="14" font-weight="400" fill="#3B4A61">fit does not hand each connection a goroutine: the data plane runs on fib's event loops.</text>
<line x1="56" y1="150" x2="904" y2="150" stroke="#E3E9F2" stroke-width="1"/>
<text x="56" y="184" font-family="PingFang SC" font-size="10" font-weight="600" fill="#2F6BFF">01</text>
<text x="82" y="190" font-family="PingFang SC" font-size="14" font-weight="600" fill="#0B1220">Idle connections cost almost nothing</text>
<text x="82" y="212" font-family="PingFang SC" font-size="11" font-weight="400" fill="#3B4A61">One connection struct; read and write buffers are borrowed for a round</text>
<text x="82" y="229" font-family="PingFang SC" font-size="11" font-weight="400" fill="#3B4A61">and returned. No resident bufio stacks.</text>
<text x="56" y="280" font-family="PingFang SC" font-size="10" font-weight="600" fill="#2F6BFF">02</text>
<text x="82" y="286" font-family="PingFang SC" font-size="14" font-weight="600" fill="#0B1220">Backpressure is end to end</text>
<text x="82" y="308" font-family="PingFang SC" font-size="11" font-weight="400" fill="#3B4A61">HoldReads carries a slow client's wait back to the upstream; a write</text>
<text x="82" y="325" font-family="PingFang SC" font-size="11" font-weight="400" fill="#3B4A61">watermark and a global pending-bytes budget cap the rest.</text>
<text x="56" y="376" font-family="PingFang SC" font-size="10" font-weight="600" fill="#2F6BFF">03</text>
<text x="82" y="382" font-family="PingFang SC" font-size="14" font-weight="600" fill="#0B1220">Static files, nearly zero copy</text>
<text x="82" y="404" font-family="PingFang SC" font-size="11" font-weight="400" fill="#3B4A61">sendfile, an in-memory file cache and precompressed twins: a hit is</text>
<text x="82" y="421" font-family="PingFang SC" font-size="11" font-weight="400" fill="#3B4A61">just a write.</text>
<text x="500" y="184" font-family="PingFang SC" font-size="10" font-weight="600" fill="#2F6BFF">04</text>
<text x="526" y="190" font-family="PingFang SC" font-size="14" font-weight="600" fill="#0B1220">Blocking work lives in bounded pools</text>
<text x="526" y="212" font-family="PingFang SC" font-size="11" font-weight="400" fill="#3B4A61">External auth, plugins and disk cache misses run in pools of their own,</text>
<text x="526" y="229" font-family="PingFang SC" font-size="11" font-weight="400" fill="#3B4A61">with one-way waits.</text>
<text x="500" y="280" font-family="PingFang SC" font-size="10" font-weight="600" fill="#2F6BFF">05</text>
<text x="526" y="286" font-family="PingFang SC" font-size="14" font-weight="600" fill="#0B1220">prefork when you want it</text>
<text x="526" y="308" font-family="PingFang SC" font-size="11" font-weight="400" fill="#3B4A61">One process per CPU with its own heap and GC, sharing the port through</text>
<text x="526" y="325" font-family="PingFang SC" font-size="11" font-weight="400" fill="#3B4A61">SO_REUSEPORT, as nginx's workers do.</text>
<rect x="500" y="356" width="404" height="112" rx="10" fill="#F1F5FF" stroke="#D6E2FF" stroke-width="1"/>
<text x="520" y="380" font-family="PingFang SC" font-size="9" font-weight="600" fill="#2F6BFF">FOR COMPARISON</text>
<text x="520" y="402" font-family="PingFang SC" font-size="10.5" font-weight="400" fill="#2A3D5C">40,000 idle TLS connections: fit 475 MiB, nginx 1,305 MiB. Caddy and</text>
<text x="520" y="418.5" font-family="PingFang SC" font-size="10.5" font-weight="400" fill="#2A3D5C">Traefik pay for net/http — one goroutine per connection.</text>
<text x="56" y="516" font-family="PingFang SC" font-size="9.5" font-weight="400" fill="#A6B3C6">fit · a reverse proxy, load balancer and API gateway built on fib</text>
<text x="904" y="516" font-family="PingFang SC" font-size="9.5" font-weight="500" fill="#A6B3C6" text-anchor="end">05 / 16</text>
</svg>
