<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540">
<rect width="960" height="540" fill="#F7F9FC"/>
<rect x="56" y="42" width="18" height="3" rx="1.5" fill="#2F6BFF"/>
<text x="82" y="52" font-family="PingFang SC" font-size="10.5" font-weight="500" fill="#6B7A90">05 / 协议</text>
<text x="56" y="96" font-family="PingFang SC" font-size="32" font-weight="600" fill="#0B1220">一套模型，覆盖七层与四层</text>
<text x="56" y="126" font-family="PingFang SC" font-size="14" font-weight="400" fill="#3B4A61">入口协议与上游协议各自可选；四层服务与 HTTP 路由共用 listener → service 的模型。</text>
<line x1="56" y1="150" x2="904" y2="150" stroke="#E3E9F2" stroke-width="1"/>
<rect x="56" y="176" width="848" height="36" rx="8" fill="#EAF0FF"/>
<text x="76" y="199" font-family="PingFang SC" font-size="10.5" font-weight="600" fill="#2F6BFF">协议</text>
<text x="246" y="199" font-family="PingFang SC" font-size="10.5" font-weight="600" fill="#2F6BFF">能力</text>
<text x="496" y="199" font-family="PingFang SC" font-size="10.5" font-weight="600" fill="#2F6BFF">关键点</text>
<line x1="56" y1="252" x2="904" y2="252" stroke="#EDF1F7" stroke-width="1"/>
<text x="76" y="238" font-family="PingFang SC" font-size="13" font-weight="600" fill="#0B1220">HTTP/1.1</text>
<text x="246" y="238" font-family="PingFang SC" font-size="11.5" font-weight="500" fill="#3B4A61">双向流式代理</text>
<text x="496" y="238" font-family="PingFang SC" font-size="10.5" font-weight="400" fill="#6B7A90">逐跳头清理 · X-Forwarded-* / Forwarded · 可信代理列表</text>
<rect x="56" y="252" width="848" height="40" fill="#FFFFFF"/>
<line x1="56" y1="292" x2="904" y2="292" stroke="#EDF1F7" stroke-width="1"/>
<text x="76" y="278" font-family="PingFang SC" font-size="13" font-weight="600" fill="#0B1220">HTTP/2</text>
<text x="246" y="278" font-family="PingFang SC" font-size="11.5" font-weight="500" fill="#3B4A61">h2 / h2c 入口与上游</text>
<text x="496" y="278" font-family="PingFang SC" font-size="10.5" font-weight="400" fill="#6B7A90">流控与背压联动 · gRPC 双向流与 trailers</text>
<line x1="56" y1="332" x2="904" y2="332" stroke="#EDF1F7" stroke-width="1"/>
<text x="76" y="318" font-family="PingFang SC" font-size="13" font-weight="600" fill="#0B1220">HTTP/3</text>
<text x="246" y="318" font-family="PingFang SC" font-size="11.5" font-weight="500" fill="#3B4A61">QUIC · TLS 1.3</text>
<text x="496" y="318" font-family="PingFang SC" font-size="10.5" font-weight="400" fill="#6B7A90">不依赖 quic-go，与 fib 同引擎</text>
<rect x="56" y="332" width="848" height="40" fill="#FFFFFF"/>
<line x1="56" y1="372" x2="904" y2="372" stroke="#EDF1F7" stroke-width="1"/>
<text x="76" y="358" font-family="PingFang SC" font-size="13" font-weight="600" fill="#0B1220">WebSocket</text>
<text x="246" y="358" font-family="PingFang SC" font-size="11.5" font-weight="500" fill="#3B4A61">h1 / h2 / h3 入口</text>
<text x="496" y="358" font-family="PingFang SC" font-size="10.5" font-weight="400" fill="#6B7A90">代理到 HTTP/1.1 上游，升级与双向隧道</text>
<line x1="56" y1="412" x2="904" y2="412" stroke="#EDF1F7" stroke-width="1"/>
<text x="76" y="398" font-family="PingFang SC" font-size="13" font-weight="600" fill="#0B1220">TCP / UDP</text>
<text x="246" y="398" font-family="PingFang SC" font-size="11.5" font-weight="500" fill="#3B4A61">四层服务</text>
<text x="496" y="398" font-family="PingFang SC" font-size="10.5" font-weight="400" fill="#6B7A90">按 SNI 透传不终止 · PROXY protocol</text>
<rect x="56" y="412" width="848" height="40" fill="#FFFFFF"/>
<line x1="56" y1="452" x2="904" y2="452" stroke="#EDF1F7" stroke-width="1"/>
<text x="76" y="438" font-family="PingFang SC" font-size="13" font-weight="600" fill="#0B1220">SOCKS / CONNECT</text>
<text x="246" y="438" font-family="PingFang SC" font-size="11.5" font-weight="500" fill="#3B4A61">正向代理</text>
<text x="496" y="438" font-family="PingFang SC" font-size="10.5" font-weight="400" fill="#6B7A90">SOCKS5 与 HTTP CONNECT，带客户端与目标访问规则</text>
<line x1="56" y1="492" x2="904" y2="492" stroke="#EDF1F7" stroke-width="1"/>
<text x="76" y="478" font-family="PingFang SC" font-size="13" font-weight="600" fill="#0B1220">多协议单端口</text>
<text x="246" y="478" font-family="PingFang SC" font-size="11.5" font-weight="500" fill="#3B4A61">按首字节分流</text>
<text x="496" y="478" font-family="PingFang SC" font-size="10.5" font-weight="400" fill="#6B7A90">HTTP、TLS、SOCKS、裸 TCP 共存于一个 listener</text>
<text x="56" y="516" font-family="PingFang SC" font-size="9.5" font-weight="400" fill="#A6B3C6">fit · 基于 fib 的反向代理、负载均衡与 API 网关</text>
<text x="904" y="516" font-family="PingFang SC" font-size="9.5" font-weight="500" fill="#A6B3C6" text-anchor="end">06 / 16</text>
</svg>
