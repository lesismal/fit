<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540">
<rect width="960" height="540" fill="#F7F9FC"/>
<rect x="56" y="42" width="18" height="3" rx="1.5" fill="#2F6BFF"/>
<text x="82" y="52" font-family="PingFang SC" font-size="10.5" font-weight="500" fill="#6B7A90">14 / Getting started</text>
<text x="56" y="96" font-family="PingFang SC" font-size="32" font-weight="600" fill="#0B1220">Three commands to a site over HTTPS</text>
<text x="56" y="126" font-family="PingFang SC" font-size="14" font-weight="400" fill="#3B4A61">No DSL to learn first: the smallest config is a listener and a route.</text>
<line x1="56" y1="150" x2="904" y2="150" stroke="#E3E9F2" stroke-width="1"/>
<circle cx="72" cy="194" r="15" fill="#EAF0FF"/>
<text x="72" y="200" font-family="PingFang SC" font-size="11" font-weight="600" fill="#2F6BFF" text-anchor="middle">1</text>
<text x="100" y="198" font-family="PingFang SC" font-size="12" font-weight="600" fill="#0B1220">Install</text>
<rect x="100" y="210" width="372" height="30" rx="6" fill="#0A1020"/>
<text x="114" y="230" font-family="Menlo" font-size="9" font-weight="400" fill="#B8C7E0">go install github.com/lesismal/fit/cmd/fit@latest</text>
<circle cx="72" cy="276" r="15" fill="#EAF0FF"/>
<text x="72" y="282" font-family="PingFang SC" font-size="11" font-weight="600" fill="#2F6BFF" text-anchor="middle">2</text>
<text x="100" y="280" font-family="PingFang SC" font-size="12" font-weight="600" fill="#0B1220">Validate</text>
<rect x="100" y="292" width="372" height="30" rx="6" fill="#0A1020"/>
<text x="114" y="312" font-family="Menlo" font-size="9" font-weight="400" fill="#B8C7E0">fit validate -c examples/hello/fit.conf</text>
<circle cx="72" cy="358" r="15" fill="#EAF0FF"/>
<text x="72" y="364" font-family="PingFang SC" font-size="11" font-weight="600" fill="#2F6BFF" text-anchor="middle">3</text>
<text x="100" y="362" font-family="PingFang SC" font-size="12" font-weight="600" fill="#0B1220">Run</text>
<rect x="100" y="374" width="372" height="30" rx="6" fill="#0A1020"/>
<text x="114" y="394" font-family="Menlo" font-size="9" font-weight="400" fill="#B8C7E0">fit run -c examples/hello/fit.conf</text>
<rect x="500" y="176" width="404" height="264" rx="10" fill="#0A1020" stroke="#1B2740" stroke-width="1"/>
<text x="520" y="202" font-family="Menlo" font-size="9.5" font-weight="500" fill="#7E92B4">examples/hello/fit.conf</text>
<circle cx="884" cy="198" r="2.6" fill="#2A3A5C"/>
<circle cx="872" cy="198" r="2.6" fill="#2A3A5C"/>
<circle cx="860" cy="198" r="2.6" fill="#2A3A5C"/>
<line x1="500" y1="214" x2="904" y2="214" stroke="#1B2740" stroke-width="1"/>
<text x="520" y="218" font-family="Menlo" font-size="9.5" font-weight="400" fill="#6FA8FF" xml:space="preserve">listener</text>
<text x="565.6" y="218" font-family="Menlo" font-size="9.5" font-weight="400" fill="#C7D3E8" xml:space="preserve"> web </text>
<text x="594.1" y="218" font-family="Menlo" font-size="9.5" font-weight="400" fill="#5D6F92" xml:space="preserve">{</text>
<text x="520" y="233.5" font-family="Menlo" font-size="9.5" font-weight="400" fill="#C7D3E8" xml:space="preserve">    address</text>
<text x="582.7" y="233.5" font-family="Menlo" font-size="9.5" font-weight="400" fill="#7EE3B0" xml:space="preserve"> :8080</text>
<text x="520" y="249" font-family="Menlo" font-size="9.5" font-weight="400" fill="#C7D3E8" xml:space="preserve">    protocols</text>
<text x="594.1" y="249" font-family="Menlo" font-size="9.5" font-weight="400" fill="#7EE3B0" xml:space="preserve"> http/1.1 h2c</text>
<text x="520" y="264.5" font-family="Menlo" font-size="9.5" font-weight="400" fill="#5D6F92" xml:space="preserve">}</text>
<text x="520" y="295.5" font-family="Menlo" font-size="9.5" font-weight="400" fill="#6FA8FF" xml:space="preserve">route</text>
<text x="548.5" y="295.5" font-family="Menlo" font-size="9.5" font-weight="400" fill="#C7D3E8" xml:space="preserve"> hello </text>
<text x="588.4" y="295.5" font-family="Menlo" font-size="9.5" font-weight="400" fill="#5D6F92" xml:space="preserve">{</text>
<text x="520" y="311" font-family="Menlo" font-size="9.5" font-weight="400" fill="#C7D3E8" xml:space="preserve">    match </text>
<text x="577" y="311" font-family="Menlo" font-size="9.5" font-weight="400" fill="#5D6F92" xml:space="preserve">{</text>
<text x="520" y="326.5" font-family="Menlo" font-size="9.5" font-weight="400" fill="#C7D3E8" xml:space="preserve">        path</text>
<text x="588.4" y="326.5" font-family="Menlo" font-size="9.5" font-weight="400" fill="#7EE3B0" xml:space="preserve"> /hello</text>
<text x="520" y="342" font-family="Menlo" font-size="9.5" font-weight="400" fill="#5D6F92" xml:space="preserve">    }</text>
<text x="520" y="357.5" font-family="Menlo" font-size="9.5" font-weight="400" fill="#6FA8FF" xml:space="preserve">    handler</text>
<text x="582.7" y="357.5" font-family="Menlo" font-size="9.5" font-weight="400" fill="#C7D3E8" xml:space="preserve"> respond </text>
<text x="634" y="357.5" font-family="Menlo" font-size="9.5" font-weight="400" fill="#5D6F92" xml:space="preserve">{</text>
<text x="520" y="373" font-family="Menlo" font-size="9.5" font-weight="400" fill="#C7D3E8" xml:space="preserve">        body</text>
<text x="588.4" y="373" font-family="Menlo" font-size="9.5" font-weight="400" fill="#7EE3B0" xml:space="preserve"> "hello from fit\n"</text>
<text x="520" y="388.5" font-family="Menlo" font-size="9.5" font-weight="400" fill="#5D6F92" xml:space="preserve">    }</text>
<text x="520" y="404" font-family="Menlo" font-size="9.5" font-weight="400" fill="#5D6F92" xml:space="preserve">}</text>
<text x="56" y="470" font-family="PingFang SC" font-size="10" font-weight="400" fill="#6B7A90">Also prebuilt binaries for Linux / macOS / Windows / FreeBSD, the ghcr.io/lesismal/fit image,</text>
<text x="56" y="488" font-family="PingFang SC" font-size="10" font-weight="400" fill="#6B7A90">a Helm chart and systemd units; SIGHUP applies a config change.</text>
<text x="56" y="516" font-family="PingFang SC" font-size="9.5" font-weight="400" fill="#A6B3C6">fit · a reverse proxy, load balancer and API gateway built on fib</text>
<text x="904" y="516" font-family="PingFang SC" font-size="9.5" font-weight="500" fill="#A6B3C6" text-anchor="end">15 / 16</text>
</svg>
