<text x="157.9" y="216" font-family="Menlo" font-size="10.5" font-weight="400" fill="#5D6F92" xml:space="preserve">{</text>
<text x="76" y="232.5" font-family="Menlo" font-size="10.5" font-weight="400" fill="#C7D3E8" xml:space="preserve">    address</text>
<text x="145.3" y="232.5" font-family="Menlo" font-size="10.5" font-weight="400" fill="#7EE3B0" xml:space="preserve"> :8080</text>
<text x="76" y="249" font-family="Menlo" font-size="10.5" font-weight="400" fill="#C7D3E8" xml:space="preserve">    protocols</text>
<text x="157.9" y="249" font-family="Menlo" font-size="10.5" font-weight="400" fill="#7EE3B0" xml:space="preserve"> http/1.1 h2c</text>
<text x="76" y="265.5" font-family="Menlo" font-size="10.5" font-weight="400" fill="#5D6F92" xml:space="preserve">}</text>
<text x="76" y="298.5" font-family="Menlo" font-size="10.5" font-weight="400" fill="#6FA8FF" xml:space="preserve">route</text>
<text x="107.5" y="298.5" font-family="Menlo" font-size="10.5" font-weight="400" fill="#C7D3E8" xml:space="preserve"> hello </text>
<text x="151.6" y="298.5" font-family="Menlo" font-size="10.5" font-weight="400" fill="#5D6F92" xml:space="preserve">{</text>
<text x="76" y="315" font-family="Menlo" font-size="10.5" font-weight="400" fill="#C7D3E8" xml:space="preserve">    match </text>
<text x="139" y="315" font-family="Menlo" font-size="10.5" font-weight="400" fill="#5D6F92" xml:space="preserve">{</text>
<text x="76" y="331.5" font-family="Menlo" font-size="10.5" font-weight="400" fill="#C7D3E8" xml:space="preserve">        path</text>
<text x="151.6" y="331.5" font-family="Menlo" font-size="10.5" font-weight="400" fill="#7EE3B0" xml:space="preserve"> /hello</text>
<text x="76" y="348" font-family="Menlo" font-size="10.5" font-weight="400" fill="#5D6F92" xml:space="preserve">    }</text>
<text x="76" y="364.5" font-family="Menlo" font-size="10.5" font-weight="400" fill="#6FA8FF" xml:space="preserve">    handler</text>
<text x="145.3" y="364.5" font-family="Menlo" font-size="10.5" font-weight="400" fill="#C7D3E8" xml:space="preserve"> respond </text>
<text x="202" y="364.5" font-family="Menlo" font-size="10.5" font-weight="400" fill="#5D6F92" xml:space="preserve">{</text>
<text x="76" y="381" font-family="Menlo" font-size="10.5" font-weight="400" fill="#C7D3E8" xml:space="preserve">        body</text>
<text x="151.6" y="381" font-family="Menlo" font-size="10.5" font-weight="400" fill="#7EE3B0" xml:space="preserve"> "hello from fit\n"</text>
