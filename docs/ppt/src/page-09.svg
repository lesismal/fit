<circle cx="454" cy="194" r="2.6" fill="#2A3A5C"/>
<circle cx="442" cy="194" r="2.6" fill="#2A3A5C"/>
<line x1="56" y1="210" x2="486" y2="210" stroke="#1B2740" stroke-width="1"/>
