<rect x="510" y="176" width="45.8" height="22" rx="11.0" fill="#2F6BFF"/><text x="521" y="191.4" font-family="PingFang SC" font-size="10" font-weight="500" fill="#FFFFFF">.conf</text>
<rect x="563.8" y="176" width="47.2" height="22" rx="11.0" fill="#EAF0FF"/><text x="574.8" y="191.4" font-family="PingFang SC" font-size="10" font-weight="500" fill="#2F6BFF">YAML</text>
<rect x="619" y="176" width="47.2" height="22" rx="11.0" fill="#EAF0FF"/><text x="630" y="191.4" font-family="PingFang SC" font-size="10" font-weight="500" fill="#2F6BFF">JSON</text>
<text x="510" y="236" font-family="PingFang SC" font-size="13" font-weight="600" fill="#0B1220">严格解码</text>
<text x="510" y="256" font-family="PingFang SC" font-size="11" font-weight="400" fill="#3B4A61">未知字段、类型错误都带路径与位置报错；fit validate 不启动服务就能查。</text>
<text x="510" y="294" font-family="PingFang SC" font-size="13" font-weight="600" fill="#0B1220">同一份 schema</text>
<text x="510" y="314" font-family="PingFang SC" font-size="11" font-weight="400" fill="#3B4A61">fit schema 输出 JSON Schema，编辑器提示与运行时校验共用它。</text>
<text x="510" y="352" font-family="PingFang SC" font-size="13" font-weight="600" fill="#0B1220">可拆分</text>
<text x="510" y="372" font-family="PingFang SC" font-size="11" font-weight="400" fill="#3B4A61">fit run -c base.conf -c conf.d：多文件与目录按顺序合并。</text>
<text x="510" y="410" font-family="PingFang SC" font-size="13" font-weight="600" fill="#0B1220">可迁移</text>
<text x="510" y="430" font-family="PingFang SC" font-size="11" font-weight="400" fill="#3B4A61">fit adapt 在 .conf / YAML / JSON 之间互转，也能读 nginx 与 Caddyfile，</text>
<text x="510" y="446" font-family="PingFang SC" font-size="11" font-weight="400" fill="#3B4A61">并列出未转换的部分。</text>
<line x1="56" y1="474" x2="904" y2="474" stroke="#E3E9F2" stroke-width="1"/>
<text x="56" y="496" font-family="PingFang SC" font-size="10" font-weight="400" fill="#6B7A90">SIGHUP 或 -watch 重载：地址不变的 listener 原地保留；新配置有错时继续用正在运行的配置。</text>
<text x="56" y="516" font-family="PingFang SC" font-size="9.5" font-weight="400" fill="#A6B3C6">fit · 基于 fib 的反向代理、负载均衡与 API 网关</text>
<text x="904" y="516" font-family="PingFang SC" font-size="9.5" font-weight="500" fill="#A6B3C6" text-anchor="end">09 / 16</text>
</svg>
