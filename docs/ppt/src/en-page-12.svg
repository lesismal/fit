<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540">
<rect width="960" height="540" fill="#F7F9FC"/>
<rect x="56" y="42" width="18" height="3" rx="1.5" fill="#2F6BFF"/>
<text x="82" y="52" font-family="PingFang SC" font-size="10.5" font-weight="500" fill="#6B7A90">11 / Other roles on the same engine</text>
<text x="56" y="96" font-family="PingFang SC" font-size="32" font-weight="600" fill="#0B1220">Beyond the gateway: media, tunnels, a model gateway</text>
<text x="56" y="126" font-family="PingFang SC" font-size="14" font-weight="400" fill="#3B4A61">No second deployment: these roles share the gateway's listeners, config and hot reload.</text>
<line x1="56" y1="150" x2="904" y2="150" stroke="#E3E9F2" stroke-width="1"/>
<rect x="56" y="176" width="848" height="84" rx="10" fill="#FFFFFF" stroke="#E3E9F2" stroke-width="1"/>
<rect x="56" y="190" width="4" height="56" rx="2" fill="#0891B2"/>
<text x="84" y="214" font-family="PingFang SC" font-size="18" font-weight="600" fill="#0B1220">WebRTC</text>
<text x="84" y="234" font-family="PingFang SC" font-size="7.5" font-weight="600" fill="#6B7A90">WEBRTC · MEDIA</text>
<text x="280" y="206" font-family="PingFang SC" font-size="10.5" font-weight="400" fill="#3B4A61">A TURN server over UDP / TCP / TLS, WHIP and WHEP with fit as the media server, one UDP port proxying to other</text>
<text x="280" y="221.5" font-family="PingFang SC" font-size="10.5" font-weight="400" fill="#3B4A61">media servers.</text>
<rect x="280" y="232" width="40.7" height="19" rx="9.5" fill="#F1F5F9"/><text x="289" y="245.3" font-family="PingFang SC" font-size="9" font-weight="500" fill="#0891B2">TURN</text>
<rect x="327.68" y="232" width="73.7" height="19" rx="9.5" fill="#F1F5F9"/><text x="336.68" y="245.3" font-family="PingFang SC" font-size="9" font-weight="500" fill="#0891B2">WHIP / WHEP</text>
<rect x="408.39" y="232" width="74.5" height="19" rx="9.5" fill="#F1F5F9"/><text x="417.39" y="245.3" font-family="PingFang SC" font-size="9" font-weight="500" fill="#0891B2">webrtc_proxy</text>
<rect x="56" y="268" width="848" height="84" rx="10" fill="#FFFFFF" stroke="#E3E9F2" stroke-width="1"/>
<rect x="56" y="282" width="4" height="56" rx="2" fill="#2F6BFF"/>
<text x="84" y="306" font-family="PingFang SC" font-size="18" font-weight="600" fill="#0B1220">tunnel</text>
<text x="84" y="326" font-family="PingFang SC" font-size="7.5" font-weight="600" fill="#6B7A90">TUNNEL · REACH BEHIND NAT</text>
<text x="280" y="298" font-family="PingFang SC" font-size="10.5" font-weight="400" fill="#3B4A61">hub / node / proxy roles over TCP, WebSocket or QUIC links, exposing services behind NAT at the edge.</text>
<rect x="280" y="324" width="35.0" height="19" rx="9.5" fill="#F1F5F9"/><text x="289" y="337.3" font-family="PingFang SC" font-size="9" font-weight="500" fill="#2F6BFF">TCP</text>
<rect x="322.01" y="324" width="62.1" height="19" rx="9.5" fill="#F1F5F9"/><text x="331.01" y="337.3" font-family="PingFang SC" font-size="9" font-weight="500" fill="#2F6BFF">WebSocket</text>
<rect x="391.11" y="324" width="40.7" height="19" rx="9.5" fill="#F1F5F9"/><text x="400.11" y="337.3" font-family="PingFang SC" font-size="9" font-weight="500" fill="#2F6BFF">QUIC</text>
<rect x="56" y="360" width="848" height="84" rx="10" fill="#FFFFFF" stroke="#E3E9F2" stroke-width="1"/>
<rect x="56" y="374" width="4" height="56" rx="2" fill="#0FA97A"/>
<text x="84" y="398" font-family="PingFang SC" font-size="18" font-weight="600" fill="#0B1220">LLM</text>
<text x="84" y="418" font-family="PingFang SC" font-size="7.5" font-weight="600" fill="#6B7A90">LLM · SHARE MODELS</text>
<text x="280" y="390" font-family="PingFang SC" font-size="10.5" font-weight="400" fill="#3B4A61">hub / node / proxy share models across machines and serve agents OpenAI, Anthropic, Gemini, Ollama and Cohere</text>
<text x="280" y="405.5" font-family="PingFang SC" font-size="10.5" font-weight="400" fill="#3B4A61">compatible APIs.</text>
<rect x="280" y="416" width="99.5" height="19" rx="9.5" fill="#F1F5F9"/><text x="289" y="429.3" font-family="PingFang SC" font-size="9" font-weight="500" fill="#0FA97A">OpenAI-compatible</text>
<rect x="386.45" y="416" width="61.1" height="19" rx="9.5" fill="#F1F5F9"/><text x="395.45" y="429.3" font-family="PingFang SC" font-size="9" font-weight="500" fill="#0FA97A">Anthropic</text>
<rect x="454.56" y="416" width="47.1" height="19" rx="9.5" fill="#F1F5F9"/><text x="463.56" y="429.3" font-family="PingFang SC" font-size="9" font-weight="500" fill="#0FA97A">Ollama</text>
<text x="56" y="486" font-family="PingFang SC" font-size="10.5" font-weight="400" fill="#6B7A90">One config, one binary, one engine; roles are switched on per page in the console.</text>
<text x="56" y="516" font-family="PingFang SC" font-size="9.5" font-weight="400" fill="#A6B3C6">fit · a reverse proxy, load balancer and API gateway built on fib</text>
<text x="904" y="516" font-family="PingFang SC" font-size="9.5" font-weight="500" fill="#A6B3C6" text-anchor="end">12 / 16</text>
</svg>
