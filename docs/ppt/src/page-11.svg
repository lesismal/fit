<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540">
<rect width="960" height="540" fill="#F7F9FC"/>
<rect x="56" y="42" width="18" height="3" rx="1.5" fill="#2F6BFF"/>
<text x="82" y="52" font-family="PingFang SC" font-size="10.5" font-weight="500" fill="#6B7A90">10 / 可观测</text>
<text x="56" y="96" font-family="PingFang SC" font-size="32" font-weight="600" fill="#0B1220">出问题时，先看清发生了什么</text>
<text x="56" y="126" font-family="PingFang SC" font-size="14" font-weight="400" fill="#3B4A61">日志、指标、链路都内置，不需要另外拼一套边车。</text>
<line x1="56" y1="150" x2="904" y2="150" stroke="#E3E9F2" stroke-width="1"/>
<rect x="56" y="172" width="266" height="190" rx="10" fill="#FFFFFF" stroke="#E3E9F2" stroke-width="1"/>
<rect x="56" y="194" width="4" height="32" rx="2" fill="#2F6BFF"/>
<text x="80" y="208" font-family="PingFang SC" font-size="8.5" font-weight="600" fill="#2F6BFF">ACCESS LOG</text>
<text x="80" y="232" font-family="PingFang SC" font-size="17" font-weight="600" fill="#0B1220">日志</text>
<circle cx="83" cy="264" r="2.4" fill="#2F6BFF"/>
<text x="94" y="268" font-family="PingFang SC" font-size="10.5" font-weight="400" fill="#3B4A61">JSON、logfmt、line 三种格式</text>
<circle cx="83" cy="283.5" r="2.4" fill="#2F6BFF"/>
<text x="94" y="287.5" font-family="PingFang SC" font-size="10.5" font-weight="400" fill="#3B4A61">有界缓冲写入，不占事件循环</text>
<circle cx="83" cy="303.0" r="2.4" fill="#2F6BFF"/>
<text x="94" y="307" font-family="PingFang SC" font-size="10.5" font-weight="400" fill="#3B4A61">按 logger 分级，可只记 4xx / 5xx</text>
<rect x="347" y="172" width="266" height="190" rx="10" fill="#FFFFFF" stroke="#E3E9F2" stroke-width="1"/>
<rect x="347" y="194" width="4" height="32" rx="2" fill="#0FA97A"/>
<text x="371" y="208" font-family="PingFang SC" font-size="8.5" font-weight="600" fill="#0FA97A">METRICS</text>
<text x="371" y="232" font-family="PingFang SC" font-size="17" font-weight="600" fill="#0B1220">指标</text>
<circle cx="374" cy="264" r="2.4" fill="#0FA97A"/>
<text x="385" y="268" font-family="PingFang SC" font-size="10.5" font-weight="400" fill="#3B4A61">Prometheus /metrics，按 listener 与路由</text>
<circle cx="374" cy="283.5" r="2.4" fill="#0FA97A"/>
<text x="385" y="287.5" font-family="PingFang SC" font-size="10.5" font-weight="400" fill="#3B4A61">/status 列出连接、上游健康与证书</text>
<circle cx="374" cy="303.0" r="2.4" fill="#0FA97A"/>
<text x="385" y="307" font-family="PingFang SC" font-size="10.5" font-weight="400" fill="#3B4A61">缓存命中、限流与熔断计数</text>
<rect x="638" y="172" width="266" height="190" rx="10" fill="#FFFFFF" stroke="#E3E9F2" stroke-width="1"/>
<rect x="638" y="194" width="4" height="32" rx="2" fill="#C2740A"/>
<text x="662" y="208" font-family="PingFang SC" font-size="8.5" font-weight="600" fill="#C2740A">TRACING</text>
<text x="662" y="232" font-family="PingFang SC" font-size="17" font-weight="600" fill="#0B1220">链路</text>
<circle cx="665" cy="264" r="2.4" fill="#C2740A"/>
<text x="676" y="268" font-family="PingFang SC" font-size="10.5" font-weight="400" fill="#3B4A61">OpenTelemetry，W3C trace context</text>
<circle cx="665" cy="283.5" r="2.4" fill="#C2740A"/>
<text x="676" y="287.5" font-family="PingFang SC" font-size="10.5" font-weight="400" fill="#3B4A61">trace 与采样决策透传给上游</text>
<circle cx="665" cy="303.0" r="2.4" fill="#C2740A"/>
<text x="676" y="307" font-family="PingFang SC" font-size="10.5" font-weight="400" fill="#3B4A61">OTLP/HTTP 导出 span 与指标</text>
<rect x="56" y="386" width="848" height="84" rx="10" fill="#F1F5FF" stroke="#D6E2FF" stroke-width="1"/>
<text x="76" y="412" font-family="PingFang SC" font-size="11.5" font-weight="600" fill="#0B1220">仪表盘与 /status</text>
<text x="76" y="442" font-family="PingFang SC" font-size="10.5" font-weight="400" fill="#2A3D5C">listener 与连接数</text>
<text x="300" y="442" font-family="PingFang SC" font-size="10.5" font-weight="400" fill="#2A3D5C">上游与后端健康</text>
<text x="524" y="442" font-family="PingFang SC" font-size="10.5" font-weight="400" fill="#2A3D5C">证书与到期时间</text>
<text x="730" y="442" font-family="PingFang SC" font-size="10.5" font-weight="400" fill="#2A3D5C">配置版本与来源</text>
<text x="56" y="496" font-family="PingFang SC" font-size="10" font-weight="400" fill="#6B7A90">一条请求的完整链路：接入 → 路由 → 中间件 → 上游，日志里都有 trace id。</text>
<text x="56" y="516" font-family="PingFang SC" font-size="9.5" font-weight="400" fill="#A6B3C6">fit · 基于 fib 的反向代理、负载均衡与 API 网关</text>
<text x="904" y="516" font-family="PingFang SC" font-size="9.5" font-weight="500" fill="#A6B3C6" text-anchor="end">11 / 16</text>
