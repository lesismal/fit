<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540">
<rect width="960" height="540" fill="#F7F9FC"/>
<rect x="56" y="42" width="18" height="3" rx="1.5" fill="#2F6BFF"/>
<text x="82" y="52" font-family="PingFang SC" font-size="10.5" font-weight="500" fill="#6B7A90">12 / Extending</text>
<text x="56" y="96" font-family="PingFang SC" font-size="32" font-weight="600" fill="#0B1220">Extend in Go, hot-swap in WASM</text>
<text x="56" y="126" font-family="PingFang SC" font-size="14" font-weight="400" fill="#3B4A61">A module is a Go package: compiled in, it runs on fib's workers with nothing between it and the request.</text>
<line x1="56" y1="150" x2="904" y2="150" stroke="#E3E9F2" stroke-width="1"/>
<circle cx="69" cy="186" r="12" fill="#EAF0FF"/>
<text x="69" y="190" font-family="PingFang SC" font-size="10.5" font-weight="600" fill="#2F6BFF" text-anchor="middle">1</text>
<text x="92" y="190" font-family="PingFang SC" font-size="11.5" font-weight="500" fill="#0B1220">Write a Go package implementing Handler or Middleware</text>
<circle cx="69" cy="230" r="12" fill="#EAF0FF"/>
<text x="69" y="234" font-family="PingFang SC" font-size="10.5" font-weight="600" fill="#2F6BFF" text-anchor="middle">2</text>
<text x="92" y="234" font-family="PingFang SC" font-size="11.5" font-weight="500" fill="#0B1220">Register it in init: module.Register("http.middleware.hello", …)</text>
<circle cx="69" cy="274" r="12" fill="#EAF0FF"/>
<text x="69" y="278" font-family="PingFang SC" font-size="10.5" font-weight="600" fill="#2F6BFF" text-anchor="middle">3</text>
<text x="92" y="278" font-family="PingFang SC" font-size="11.5" font-weight="500" fill="#0B1220">fit build -with github.com/you/fit-hello compiles it in</text>
<rect x="56" y="316" width="430" height="156" rx="10" fill="#0A1020" stroke="#1B2740" stroke-width="1"/>
<text x="76" y="342" font-family="Menlo" font-size="9.5" font-weight="500" fill="#7E92B4">hello.go</text>
<circle cx="466" cy="338" r="2.6" fill="#2A3A5C"/>
<circle cx="454" cy="338" r="2.6" fill="#2A3A5C"/>
<circle cx="442" cy="338" r="2.6" fill="#2A3A5C"/>
<line x1="56" y1="354" x2="486" y2="354" stroke="#1B2740" stroke-width="1"/>
<text x="76" y="356" font-family="Menlo" font-size="10" font-weight="400" fill="#6FA8FF" xml:space="preserve">func init() </text>
<text x="148" y="356" font-family="Menlo" font-size="10" font-weight="400" fill="#5D6F92" xml:space="preserve">{</text>
<text x="76" y="374" font-family="Menlo" font-size="10" font-weight="400" fill="#C7D3E8" xml:space="preserve">    module.Register(module.Info{</text>
<text x="76" y="392" font-family="Menlo" font-size="10" font-weight="400" fill="#C7D3E8" xml:space="preserve">        ID:  </text>
<text x="154" y="392" font-family="Menlo" font-size="10" font-weight="400" fill="#7EE3B0" xml:space="preserve">module.Middlewares + ".hello"</text>
<text x="76" y="410" font-family="Menlo" font-size="10" font-weight="400" fill="#C7D3E8" xml:space="preserve">        New: </text>
<text x="154" y="410" font-family="Menlo" font-size="10" font-weight="400" fill="#C7D3E8" xml:space="preserve">func() any { return new(Hello) },</text>
<text x="76" y="428" font-family="Menlo" font-size="10" font-weight="400" fill="#5D6F92" xml:space="preserve">    })</text>
<text x="76" y="446" font-family="Menlo" font-size="10" font-weight="400" fill="#5D6F92" xml:space="preserve">}</text>
<rect x="500" y="172" width="404" height="88" rx="10" fill="#FFFFFF" stroke="#E3E9F2" stroke-width="1"/>
<circle cx="524" cy="198" r="4" fill="#2F6BFF"/>
<text x="538" y="202" font-family="PingFang SC" font-size="12.5" font-weight="600" fill="#0B1220">22 built-in modules</text>
<text x="524" y="226" font-family="PingFang SC" font-size="10" font-weight="400" fill="#3B4A61">8 handlers + 14 middleware; params decoded strictly and documented into</text>
<text x="524" y="241" font-family="PingFang SC" font-size="10" font-weight="400" fill="#3B4A61">the JSON Schema.</text>
<rect x="500" y="272" width="404" height="88" rx="10" fill="#FFFFFF" stroke="#E3E9F2" stroke-width="1"/>
<circle cx="524" cy="298" r="4" fill="#0891B2"/>
<text x="538" y="302" font-family="PingFang SC" font-size="12.5" font-weight="600" fill="#0B1220">WASM at runtime</text>
<text x="524" y="326" font-family="PingFang SC" font-size="10" font-weight="400" fill="#3B4A61">Runs in a wazero sandbox on a bounded pool of its own; Proxy-Wasm filters</text>
<text x="524" y="341" font-family="PingFang SC" font-size="10" font-weight="400" fill="#3B4A61">compatible.</text>
<rect x="500" y="372" width="404" height="88" rx="10" fill="#FFFFFF" stroke="#E3E9F2" stroke-width="1"/>
<circle cx="524" cy="398" r="4" fill="#0FA97A"/>
<text x="538" y="402" font-family="PingFang SC" font-size="12.5" font-weight="600" fill="#0B1220">No layer in between</text>
<text x="524" y="426" font-family="PingFang SC" font-size="10" font-weight="400" fill="#3B4A61">Modules run on fib's workers; fit build -without drops providers you do</text>
<text x="524" y="441" font-family="PingFang SC" font-size="10" font-weight="400" fill="#3B4A61">not use.</text>
<text x="56" y="516" font-family="PingFang SC" font-size="9.5" font-weight="400" fill="#A6B3C6">fit · a reverse proxy, load balancer and API gateway built on fib</text>
<text x="904" y="516" font-family="PingFang SC" font-size="9.5" font-weight="500" fill="#A6B3C6" text-anchor="end">13 / 16</text>
</svg>
