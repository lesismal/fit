<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540">
<rect width="960" height="540" fill="#F7F9FC"/>
<rect x="56" y="42" width="18" height="3" rx="1.5" fill="#2F6BFF"/>
<text x="82" y="52" font-family="PingFang SC" font-size="10.5" font-weight="500" fill="#6B7A90">03 / Architecture</text>
<text x="56" y="96" font-family="PingFang SC" font-size="32" font-weight="600" fill="#0B1220">Control plane, data plane</text>
<text x="56" y="126" font-family="PingFang SC" font-size="14" font-weight="400" fill="#3B4A61">Config only compiles into an immutable graph; the data plane reads it through one pointer, with no blocking call on the request path.</text>
<line x1="56" y1="150" x2="904" y2="150" stroke="#E3E9F2" stroke-width="1"/>
<text x="56" y="178" font-family="PingFang SC" font-size="9" font-weight="600" fill="#6B7A90">CONTROL PLANE</text>
<rect x="56" y="190" width="196" height="62" rx="9" fill="#FFFFFF" stroke="#DCE4F0" stroke-width="1"/>
<text x="72" y="216" font-family="PingFang SC" font-size="13" font-weight="600" fill="#0B1220">Config sources</text>
<text x="72" y="236" font-family="PingFang SC" font-size="9" font-weight="400" fill="#6B7A90">files · Admin API · providers</text>
<rect x="273" y="190" width="196" height="62" rx="9" fill="#FFFFFF" stroke="#DCE4F0" stroke-width="1"/>
<text x="289" y="216" font-family="PingFang SC" font-size="13" font-weight="600" fill="#0B1220">Adapt &amp; validate</text>
<text x="289" y="236" font-family="PingFang SC" font-size="9" font-weight="400" fill="#6B7A90">errors carry path and position</text>
<rect x="490" y="190" width="196" height="62" rx="9" fill="#FFFFFF" stroke="#DCE4F0" stroke-width="1"/>
<text x="506" y="216" font-family="PingFang SC" font-size="13" font-weight="600" fill="#0B1220">Provision modules</text>
<text x="506" y="236" font-family="PingFang SC" font-size="9" font-weight="400" fill="#6B7A90">certs, health checks, pools</text>
<rect x="707" y="190" width="196" height="62" rx="9" fill="#FFFFFF" stroke="#DCE4F0" stroke-width="1"/>
<text x="723" y="216" font-family="PingFang SC" font-size="13" font-weight="600" fill="#0B1220">Immutable graph</text>
<text x="723" y="236" font-family="PingFang SC" font-size="9" font-weight="400" fill="#6B7A90">v(n+1), built whole</text>
<line x1="254" y1="221" x2="268" y2="221" stroke="#2F6BFF" stroke-width="1.6"/>
<path d="M265 216.5 l5 4.5 l-5 4.5" stroke="#2F6BFF" stroke-width="1.6" fill="none"/>
<line x1="471" y1="221" x2="485" y2="221" stroke="#2F6BFF" stroke-width="1.6"/>
<path d="M482 216.5 l5 4.5 l-5 4.5" stroke="#2F6BFF" stroke-width="1.6" fill="none"/>
<line x1="688" y1="221" x2="702" y2="221" stroke="#2F6BFF" stroke-width="1.6"/>
<path d="M699 216.5 l5 4.5 l-5 4.5" stroke="#2F6BFF" stroke-width="1.6" fill="none"/>
<line x1="480" y1="252" x2="480" y2="316" stroke="#2F6BFF" stroke-width="1.6"/>
<path d="M480 324 l-5 -9 l10 0 z" fill="#2F6BFF"/>
<text x="496" y="278" font-family="PingFang SC" font-size="11" font-weight="600" fill="#2F6BFF">Atomic pointer swap</text>
<text x="496" y="295" font-family="PingFang SC" font-size="9" font-weight="400" fill="#6B7A90">listeners added or removed in place (AddBinding / RemoveBinding)</text>
<text x="56" y="344" font-family="PingFang SC" font-size="9" font-weight="600" fill="#6B7A90">DATA PLANE (fib event loops)</text>
<rect x="56" y="356" width="128" height="64" rx="9" fill="#F1F5FF" stroke="#D6E2FF" stroke-width="1"/>
<text x="68" y="382" font-family="PingFang SC" font-size="11.5" font-weight="600" fill="#0B1220">listeners</text>
<text x="68" y="402" font-family="PingFang SC" font-size="8.5" font-weight="400" fill="#6B7A90">TCP · UDP · TLS</text>
<rect x="200" y="356" width="128" height="64" rx="9" fill="#F1F5FF" stroke="#D6E2FF" stroke-width="1"/>
<text x="212" y="382" font-family="PingFang SC" font-size="11.5" font-weight="600" fill="#0B1220">mux</text>
<text x="212" y="402" font-family="PingFang SC" font-size="8.5" font-weight="400" fill="#6B7A90">split by first bytes</text>
<rect x="344" y="356" width="128" height="64" rx="9" fill="#F1F5FF" stroke="#D6E2FF" stroke-width="1"/>
<text x="356" y="382" font-family="PingFang SC" font-size="11.5" font-weight="600" fill="#0B1220">routers</text>
<text x="356" y="402" font-family="PingFang SC" font-size="8.5" font-weight="400" fill="#6B7A90">host · path · SNI</text>
<rect x="488" y="356" width="128" height="64" rx="9" fill="#F1F5FF" stroke="#D6E2FF" stroke-width="1"/>
<text x="500" y="382" font-family="PingFang SC" font-size="11.5" font-weight="600" fill="#0B1220">middlewares</text>
<text x="500" y="402" font-family="PingFang SC" font-size="8.5" font-weight="400" fill="#6B7A90">auth · limits · cache</text>
<rect x="632" y="356" width="128" height="64" rx="9" fill="#F1F5FF" stroke="#D6E2FF" stroke-width="1"/>
<text x="644" y="382" font-family="PingFang SC" font-size="11.5" font-weight="600" fill="#0B1220">services</text>
<text x="644" y="402" font-family="PingFang SC" font-size="8.5" font-weight="400" fill="#6B7A90">balancing · mirroring</text>
<rect x="776" y="356" width="128" height="64" rx="9" fill="#F1F5FF" stroke="#D6E2FF" stroke-width="1"/>
<text x="788" y="382" font-family="PingFang SC" font-size="11.5" font-weight="600" fill="#0B1220">upstream pools</text>
<text x="788" y="402" font-family="PingFang SC" font-size="8.5" font-weight="400" fill="#6B7A90">fib async clients</text>
<path d="M189 384 l4.5 4 l-4.5 4" stroke="#93AEE8" stroke-width="1.4" fill="none"/>
<path d="M333 384 l4.5 4 l-4.5 4" stroke="#93AEE8" stroke-width="1.4" fill="none"/>
