<path d="M621 384 l4.5 4 l-4.5 4" stroke="#93AEE8" stroke-width="1.4" fill="none"/>
<path d="M765 384 l4.5 4 l-4.5 4" stroke="#93AEE8" stroke-width="1.4" fill="none"/>
<circle cx="62" cy="446" r="6" fill="#E6F7F1"/>
<path d="M58.5 446 l2.6 2.8 l4.2 -5" stroke="#0FA97A" stroke-width="1.5" fill="none"/>
<text x="76" y="450" font-family="PingFang SC" font-size="11" font-weight="500" fill="#3B4A61">In-flight requests see no change</text>
<circle cx="346" cy="446" r="6" fill="#E6F7F1"/>
<path d="M342.5 446 l2.6 2.8 l4.2 -5" stroke="#0FA97A" stroke-width="1.5" fill="none"/>
<text x="360" y="450" font-family="PingFang SC" font-size="11" font-weight="500" fill="#3B4A61">The old graph drains, then frees</text>
<circle cx="630" cy="446" r="6" fill="#E6F7F1"/>
<path d="M626.5 446 l2.6 2.8 l4.2 -5" stroke="#0FA97A" stroke-width="1.5" fill="none"/>
<text x="644" y="450" font-family="PingFang SC" font-size="11" font-weight="500" fill="#3B4A61">Nothing blocks the request path</text>
<text x="56" y="516" font-family="PingFang SC" font-size="9.5" font-weight="400" fill="#A6B3C6">fit · a reverse proxy, load balancer and API gateway built on fib</text>
<text x="904" y="516" font-family="PingFang SC" font-size="9.5" font-weight="500" fill="#A6B3C6" text-anchor="end">04 / 16</text>
