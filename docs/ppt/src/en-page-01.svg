<text x="770" y="181" font-family="PingFang SC" font-size="21" font-weight="600" fill="#EAF1FF" text-anchor="middle">fib</text>
<text x="770" y="200" font-family="PingFang SC" font-size="8.5" font-weight="400" fill="#7E92B4" text-anchor="middle">engine</text>
<text x="72" y="92" font-family="PingFang SC" font-size="10.5" font-weight="500" fill="#4D8DFF">APACHE-2.0 · GO · FIB ENGINE</text>
<text x="66" y="196" font-family="PingFang SC" font-size="96" font-weight="700" fill="#FFFFFF">fit</text>
<rect x="74" y="212" width="56" height="4" rx="2" fill="#2F6BFF"/>
<text x="72" y="250" font-family="PingFang SC" font-size="16.5" font-weight="400" fill="#C9D5EA">A reverse proxy, load balancer and API gateway on fib</text>
<text x="72" y="284" font-family="PingFang SC" font-size="12" font-weight="400" fill="#8C9DBB">nginx-level throughput on small responses, Caddy's secure defaults,</text>
<text x="72" y="304" font-family="PingFang SC" font-size="12" font-weight="400" fill="#8C9DBB">Traefik's model — plus WebRTC, a console and LLM sharing they lack.</text>
<line x1="72" y1="324" x2="904" y2="324" stroke="#22304C" stroke-width="1"/>
<circle cx="75" cy="354" r="2.8" fill="#4D8DFF"/>
<text x="86" y="358" font-family="PingFang SC" font-size="12" font-weight="600" fill="#E9EFFA">Reverse proxy &amp; balancing</text>
<text x="86" y="375" font-family="PingFang SC" font-size="9.5" font-weight="400" fill="#8296B8">9 policies · active + passive checks</text>
<circle cx="352" cy="354" r="2.8" fill="#22D3EE"/>
<text x="363" y="358" font-family="PingFang SC" font-size="12" font-weight="600" fill="#E9EFFA">TLS termination &amp; auto HTTPS</text>
<text x="363" y="375" font-family="PingFang SC" font-size="9.5" font-weight="400" fill="#8296B8">ACME · OCSP · mTLS · SNI</text>
<circle cx="629" cy="354" r="2.8" fill="#0FA97A"/>
<text x="640" y="358" font-family="PingFang SC" font-size="12" font-weight="600" fill="#E9EFFA">Static files &amp; response cache</text>
<text x="640" y="375" font-family="PingFang SC" font-size="9.5" font-weight="400" fill="#8296B8">sendfile · memory + disk tiers</text>
<circle cx="75" cy="408" r="2.8" fill="#4D8DFF"/>
<text x="86" y="412" font-family="PingFang SC" font-size="12" font-weight="600" fill="#E9EFFA">API gateway policy</text>
<text x="86" y="429" font-family="PingFang SC" font-size="9.5" font-weight="400" fill="#8296B8">auth · rate limits · breaker · rewrite</text>
<circle cx="352" cy="408" r="2.8" fill="#22D3EE"/>
<text x="363" y="412" font-family="PingFang SC" font-size="12" font-weight="600" fill="#E9EFFA">Config reload, no restart</text>
<text x="363" y="429" font-family="PingFang SC" font-size="9.5" font-weight="400" fill="#8296B8">atomic graph swap, nothing in flight is cut</text>
<circle cx="629" cy="408" r="2.8" fill="#0FA97A"/>
<text x="640" y="412" font-family="PingFang SC" font-size="12" font-weight="600" fill="#E9EFFA">Web management console</text>
<text x="640" y="429" font-family="PingFang SC" font-size="9.5" font-weight="400" fill="#8296B8">edit any config behind a login · encrypted store</text>
<circle cx="75" cy="462" r="2.8" fill="#4D8DFF"/>
<text x="86" y="466" font-family="PingFang SC" font-size="12" font-weight="600" fill="#E9EFFA">WebRTC &amp; streaming media</text>
<text x="86" y="483" font-family="PingFang SC" font-size="9.5" font-weight="400" fill="#8296B8">TURN · WHIP/WHEP · media server proxy</text>
<circle cx="352" cy="462" r="2.8" fill="#22D3EE"/>
<text x="363" y="466" font-family="PingFang SC" font-size="12" font-weight="600" fill="#E9EFFA">tunnel &amp; LLM sharing</text>
<text x="363" y="483" font-family="PingFang SC" font-size="9.5" font-weight="400" fill="#8296B8">reach services behind NAT · share models</text>
<circle cx="629" cy="462" r="2.8" fill="#0FA97A"/>
<text x="640" y="466" font-family="PingFang SC" font-size="12" font-weight="600" fill="#E9EFFA">Many protocols, one port</text>
<text x="640" y="483" font-family="PingFang SC" font-size="9.5" font-weight="400" fill="#8296B8">HTTP · TLS · gRPC · SOCKS by first bytes</text>
<text x="72" y="516" font-family="PingFang SC" font-size="10" font-weight="400" fill="#4F6182">github.com/lesismal/fit</text>
<text x="904" y="516" font-family="PingFang SC" font-size="10" font-weight="400" fill="#4F6182" text-anchor="end">v1.0.0 · Apache-2.0 · 2026.11</text>
</svg>
