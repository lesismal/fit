<rect x="510" y="176" width="45.8" height="22" rx="11.0" fill="#2F6BFF"/><text x="521" y="191.4" font-family="PingFang SC" font-size="10" font-weight="500" fill="#FFFFFF">.conf</text>
<rect x="563.8" y="176" width="47.2" height="22" rx="11.0" fill="#EAF0FF"/><text x="574.8" y="191.4" font-family="PingFang SC" font-size="10" font-weight="500" fill="#2F6BFF">YAML</text>
<rect x="619" y="176" width="47.2" height="22" rx="11.0" fill="#EAF0FF"/><text x="630" y="191.4" font-family="PingFang SC" font-size="10" font-weight="500" fill="#2F6BFF">JSON</text>
<text x="510" y="236" font-family="PingFang SC" font-size="12.5" font-weight="600" fill="#0B1220">Strict decoding</text>
<text x="510" y="256" font-family="PingFang SC" font-size="10.5" font-weight="400" fill="#3B4A61">Unknown fields and wrong types fail with a path and a position; fit validate</text>
<text x="510" y="271.5" font-family="PingFang SC" font-size="10.5" font-weight="400" fill="#3B4A61">checks without starting the server.</text>
<text x="510" y="294" font-family="PingFang SC" font-size="12.5" font-weight="600" fill="#0B1220">One schema</text>
<text x="510" y="314" font-family="PingFang SC" font-size="10.5" font-weight="400" fill="#3B4A61">fit schema prints the JSON Schema that editor hints and the runtime check</text>
<text x="510" y="329.5" font-family="PingFang SC" font-size="10.5" font-weight="400" fill="#3B4A61">share.</text>
<text x="510" y="352" font-family="PingFang SC" font-size="12.5" font-weight="600" fill="#0B1220">Split it up</text>
<text x="510" y="372" font-family="PingFang SC" font-size="10.5" font-weight="400" fill="#3B4A61">fit run -c base.conf -c conf.d merges files and directories in order.</text>
<text x="510" y="410" font-family="PingFang SC" font-size="12.5" font-weight="600" fill="#0B1220">Migrate</text>
<text x="510" y="430" font-family="PingFang SC" font-size="10.5" font-weight="400" fill="#3B4A61">fit adapt converts between .conf, YAML and JSON, reads nginx configs and</text>
<text x="510" y="445.5" font-family="PingFang SC" font-size="10.5" font-weight="400" fill="#3B4A61">Caddyfiles, and lists what it could not convert.</text>
<line x1="56" y1="474" x2="904" y2="474" stroke="#E3E9F2"/>
<text x="56" y="496" font-family="PingFang SC" font-size="9.5" font-weight="400" fill="#6B7A90">SIGHUP or -watch reloads: listeners on unchanged addresses stay as they are; a bad config keeps the running one.</text>
<text x="56" y="516" font-family="PingFang SC" font-size="9.5" font-weight="400" fill="#A6B3C6">fit · a reverse proxy, load balancer and API gateway built on fib</text>
<text x="904" y="516" font-family="PingFang SC" font-size="9.5" font-weight="500" fill="#A6B3C6" text-anchor="end">09 / 16</text>
</svg>
