<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540">
<rect width="960" height="540" fill="#F7F9FC"/>
<rect x="56" y="42" width="18" height="3" rx="1.5" fill="#2F6BFF"/>
<text x="82" y="52" font-family="PingFang SC" font-size="10.5" font-weight="500" fill="#6B7A90">01 / Background</text>
<text x="56" y="96" font-family="PingFang SC" font-size="32" font-weight="600" fill="#0B1220">Three strengths, three blind spots</text>
<text x="56" y="126" font-family="PingFang SC" font-size="14" font-weight="400" fill="#3B4A61">nginx, Caddy and Traefik each nail one thing — and each leaves a different gap.</text>
<line x1="56" y1="150" x2="904" y2="150" stroke="#E3E9F2" stroke-width="1"/>
<rect x="56" y="172" width="266" height="268" rx="10" fill="#FFFFFF" stroke="#E3E9F2" stroke-width="1"/>
<circle cx="83" cy="210" r="5" fill="#0891B2"/>
<text x="98" y="218" font-family="PingFang SC" font-size="20" font-weight="600" fill="#0B1220">nginx</text>
<text x="98" y="236" font-family="PingFang SC" font-size="9" font-weight="500" fill="#6B7A90">NGINX · 2004 · C</text>
<line x1="80" y1="252" x2="298" y2="252" stroke="#E3E9F2"/>
<text x="80" y="274" font-family="PingFang SC" font-size="9" font-weight="600" fill="#0FA97A">STRENGTHS</text>
<circle cx="83" cy="288" r="2.4" fill="#0FA97A"/>
<text x="94" y="292" font-family="PingFang SC" font-size="11" font-weight="400" fill="#22304A">Event loop, one per core</text>
<circle cx="83" cy="308" r="2.4" fill="#0FA97A"/>
<text x="94" y="312" font-family="PingFang SC" font-size="11" font-weight="400" fill="#22304A">Best static files and cache</text>
<circle cx="83" cy="328" r="2.4" fill="#0FA97A"/>
<text x="94" y="332" font-family="PingFang SC" font-size="11" font-weight="400" fill="#22304A">Tiny cost per idle conn</text>
<text x="80" y="366" font-family="PingFang SC" font-size="9" font-weight="600" fill="#D93654">GAPS</text>
<circle cx="83" cy="380" r="2.4" fill="#D93654"/>
<text x="94" y="384" font-family="PingFang SC" font-size="11" font-weight="400" fill="#3B4A61">Own DSL, hard to validate</text>
<circle cx="83" cy="400" r="2.4" fill="#D93654"/>
<text x="94" y="404" font-family="PingFang SC" font-size="11" font-weight="400" fill="#3B4A61">Changes need a reload</text>
<circle cx="83" cy="420" r="2.4" fill="#D93654"/>
<text x="94" y="424" font-family="PingFang SC" font-size="11" font-weight="400" fill="#3B4A61">Auto HTTPS etc. is Plus</text>
<rect x="347" y="172" width="266" height="268" rx="10" fill="#FFFFFF" stroke="#E3E9F2" stroke-width="1"/>
<circle cx="374" cy="210" r="5" fill="#2F6BFF"/>
<text x="389" y="218" font-family="PingFang SC" font-size="20" font-weight="600" fill="#0B1220">Caddy</text>
<text x="389" y="236" font-family="PingFang SC" font-size="9" font-weight="500" fill="#6B7A90">CADDY · 2015 · GO</text>
<line x1="371" y1="252" x2="589" y2="252" stroke="#E3E9F2"/>
<text x="371" y="274" font-family="PingFang SC" font-size="9" font-weight="600" fill="#0FA97A">STRENGTHS</text>
<circle cx="374" cy="288" r="2.4" fill="#0FA97A"/>
<text x="385" y="292" font-family="PingFang SC" font-size="11" font-weight="400" fill="#22304A">HTTPS on by default</text>
<circle cx="374" cy="308" r="2.4" fill="#0FA97A"/>
<text x="385" y="312" font-family="PingFang SC" font-size="11" font-weight="400" fill="#22304A">Strict, programmable JSON</text>
<circle cx="374" cy="328" r="2.4" fill="#0FA97A"/>
<text x="385" y="332" font-family="PingFang SC" font-size="11" font-weight="400" fill="#22304A">Atomic Admin API</text>
<text x="371" y="366" font-family="PingFang SC" font-size="9" font-weight="600" fill="#D93654">GAPS</text>
<circle cx="374" cy="380" r="2.4" fill="#D93654"/>
<text x="385" y="384" font-family="PingFang SC" font-size="11" font-weight="400" fill="#3B4A61">One goroutine per connection</text>
<circle cx="374" cy="400" r="2.4" fill="#D93654"/>
<text x="385" y="404" font-family="PingFang SC" font-size="11" font-weight="400" fill="#3B4A61">Memory and GC cost at scale</text>
<circle cx="374" cy="420" r="2.4" fill="#D93654"/>
<text x="385" y="424" font-family="PingFang SC" font-size="11" font-weight="400" fill="#3B4A61">Cache, limits, L4 via plugins</text>
<rect x="638" y="172" width="266" height="268" rx="10" fill="#FFFFFF" stroke="#E3E9F2" stroke-width="1"/>
<circle cx="665" cy="210" r="5" fill="#7C5CFC"/>
<text x="680" y="218" font-family="PingFang SC" font-size="20" font-weight="600" fill="#0B1220">Traefik</text>
<text x="680" y="236" font-family="PingFang SC" font-size="9" font-weight="500" fill="#6B7A90">TRAEFIK · 2016 · GO</text>
<line x1="662" y1="252" x2="880" y2="252" stroke="#E3E9F2"/>
<text x="662" y="274" font-family="PingFang SC" font-size="9" font-weight="600" fill="#0FA97A">STRENGTHS</text>
<circle cx="665" cy="288" r="2.4" fill="#0FA97A"/>
<text x="676" y="292" font-family="PingFang SC" font-size="11" font-weight="400" fill="#22304A">Provider-driven, K8s native</text>
<circle cx="665" cy="308" r="2.4" fill="#0FA97A"/>
<text x="676" y="312" font-family="PingFang SC" font-size="11" font-weight="400" fill="#22304A">Dashboard, metrics, tracing</text>
<circle cx="665" cy="328" r="2.4" fill="#0FA97A"/>
<text x="676" y="332" font-family="PingFang SC" font-size="11" font-weight="400" fill="#22304A">Clean four-layer model</text>
<text x="662" y="366" font-family="PingFang SC" font-size="9" font-weight="600" fill="#D93654">GAPS</text>
<circle cx="665" cy="380" r="2.4" fill="#D93654"/>
<text x="676" y="384" font-family="PingFang SC" font-size="11" font-weight="400" fill="#3B4A61">Usually slowest and heaviest</text>
<circle cx="665" cy="400" r="2.4" fill="#D93654"/>
<text x="676" y="404" font-family="PingFang SC" font-size="11" font-weight="400" fill="#3B4A61">Not a web server: no static</text>
<circle cx="665" cy="420" r="2.4" fill="#D93654"/>
<text x="676" y="424" font-family="PingFang SC" font-size="11" font-weight="400" fill="#3B4A61">No built-in response cache</text>
<rect x="56" y="456" width="848" height="42" rx="8" fill="#0B1220"/>
<text x="76" y="483" font-family="PingFang SC" font-size="12" font-weight="600" fill="#6FA8FF">fit's take:</text>
<text x="158" y="483" font-family="PingFang SC" font-size="12" font-weight="400" fill="#C9D5EA">take the best of each into one data plane, then let fib close the gaps they share.</text>
<text x="56" y="516" font-family="PingFang SC" font-size="9.5" font-weight="400" fill="#A6B3C6">fit · a reverse proxy, load balancer and API gateway built on fib</text>
<text x="904" y="516" font-family="PingFang SC" font-size="9.5" font-weight="500" fill="#A6B3C6" text-anchor="end">02 / 16</text>
</svg>
