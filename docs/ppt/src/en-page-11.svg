<text x="80" y="208" font-family="PingFang SC" font-size="8.5" font-weight="600" fill="#2F6BFF">ACCESS LOG</text>
<text x="80" y="232" font-family="PingFang SC" font-size="16" font-weight="600" fill="#0B1220">Logs</text>
<circle cx="83" cy="264" r="2.4" fill="#2F6BFF"/>
<text x="94" y="268" font-family="PingFang SC" font-size="10" font-weight="400" fill="#3B4A61">JSON, logfmt or line format</text>
<circle cx="83" cy="283" r="2.4" fill="#2F6BFF"/>
<text x="94" y="287" font-family="PingFang SC" font-size="10" font-weight="400" fill="#3B4A61">Bounded buffers, off the event loop</text>
<circle cx="83" cy="302" r="2.4" fill="#2F6BFF"/>
<text x="94" y="306" font-family="PingFang SC" font-size="10" font-weight="400" fill="#3B4A61">Levels per logger; only 4xx/5xx if you</text>
<text x="94" y="321" font-family="PingFang SC" font-size="10" font-weight="400" fill="#3B4A61">want</text>
<rect x="347" y="172" width="266" height="190" rx="10" fill="#FFFFFF" stroke="#E3E9F2" stroke-width="1"/>
<rect x="347" y="194" width="4" height="32" rx="2" fill="#0FA97A"/>
<text x="371" y="208" font-family="PingFang SC" font-size="8.5" font-weight="600" fill="#0FA97A">METRICS</text>
<text x="371" y="232" font-family="PingFang SC" font-size="16" font-weight="600" fill="#0B1220">Metrics</text>
<circle cx="374" cy="264" r="2.4" fill="#0FA97A"/>
<text x="385" y="268" font-family="PingFang SC" font-size="10" font-weight="400" fill="#3B4A61">Prometheus /metrics, by listener and</text>
<text x="385" y="283" font-family="PingFang SC" font-size="10" font-weight="400" fill="#3B4A61">route</text>
<circle cx="374" cy="298" r="2.4" fill="#0FA97A"/>
<text x="385" y="302" font-family="PingFang SC" font-size="10" font-weight="400" fill="#3B4A61">/status: connections, upstream health,</text>
<text x="385" y="317" font-family="PingFang SC" font-size="10" font-weight="400" fill="#3B4A61">certs</text>
<circle cx="374" cy="332" r="2.4" fill="#0FA97A"/>
<text x="385" y="336" font-family="PingFang SC" font-size="10" font-weight="400" fill="#3B4A61">Cache hits, rate limits, breaker counts</text>
<rect x="638" y="172" width="266" height="190" rx="10" fill="#FFFFFF" stroke="#E3E9F2" stroke-width="1"/>
<rect x="638" y="194" width="4" height="32" rx="2" fill="#C2740A"/>
<text x="662" y="208" font-family="PingFang SC" font-size="8.5" font-weight="600" fill="#C2740A">TRACING</text>
<text x="662" y="232" font-family="PingFang SC" font-size="16" font-weight="600" fill="#0B1220">Traces</text>
<circle cx="665" cy="264" r="2.4" fill="#C2740A"/>
<text x="676" y="268" font-family="PingFang SC" font-size="10" font-weight="400" fill="#3B4A61">OpenTelemetry, W3C trace context</text>
<circle cx="665" cy="283" r="2.4" fill="#C2740A"/>
<text x="676" y="287" font-family="PingFang SC" font-size="10" font-weight="400" fill="#3B4A61">Trace and sampling decision reach</text>
<text x="676" y="302" font-family="PingFang SC" font-size="10" font-weight="400" fill="#3B4A61">upstream</text>
<circle cx="665" cy="317" r="2.4" fill="#C2740A"/>
<text x="676" y="321" font-family="PingFang SC" font-size="10" font-weight="400" fill="#3B4A61">Spans and metrics exported over</text>
<text x="676" y="336" font-family="PingFang SC" font-size="10" font-weight="400" fill="#3B4A61">OTLP/HTTP</text>
<rect x="56" y="386" width="848" height="84" rx="10" fill="#F1F5FF" stroke="#D6E2FF" stroke-width="1"/>
<text x="76" y="412" font-family="PingFang SC" font-size="11" font-weight="600" fill="#0B1220">Dashboard and /status</text>
<text x="76" y="442" font-family="PingFang SC" font-size="10" font-weight="400" fill="#2A3D5C">listeners and connections</text>
<text x="300" y="442" font-family="PingFang SC" font-size="10" font-weight="400" fill="#2A3D5C">upstream and backend health</text>
<text x="524" y="442" font-family="PingFang SC" font-size="10" font-weight="400" fill="#2A3D5C">certificates and expiry</text>
<text x="730" y="442" font-family="PingFang SC" font-size="10" font-weight="400" fill="#2A3D5C">config versions and source</text>
<text x="56" y="496" font-family="PingFang SC" font-size="9.5" font-weight="400" fill="#6B7A90">One trace id follows a request: accept → route → middleware → upstream.</text>
<text x="56" y="516" font-family="PingFang SC" font-size="9.5" font-weight="400" fill="#A6B3C6">fit · a reverse proxy, load balancer and API gateway built on fib</text>
<text x="904" y="516" font-family="PingFang SC" font-size="9.5" font-weight="500" fill="#A6B3C6" text-anchor="end">11 / 16</text>
