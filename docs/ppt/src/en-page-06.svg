<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540">
<rect width="960" height="540" fill="#F7F9FC"/>
<rect x="56" y="42" width="18" height="3" rx="1.5" fill="#2F6BFF"/>
<text x="82" y="52" font-family="PingFang SC" font-size="10.5" font-weight="500" fill="#6B7A90">05 / Protocols</text>
<text x="56" y="96" font-family="PingFang SC" font-size="32" font-weight="600" fill="#0B1220">One model, from L7 down to L4</text>
<text x="56" y="126" font-family="PingFang SC" font-size="14" font-weight="400" fill="#3B4A61">Inbound and upstream protocols are chosen separately; Layer 4 services reuse the same listener → service model.</text>
<line x1="56" y1="150" x2="904" y2="150" stroke="#E3E9F2" stroke-width="1"/>
<rect x="56" y="176" width="848" height="36" rx="8" fill="#EAF0FF"/>
<text x="76" y="199" font-family="PingFang SC" font-size="10" font-weight="600" fill="#2F6BFF">PROTOCOL</text>
<text x="256" y="199" font-family="PingFang SC" font-size="10" font-weight="600" fill="#2F6BFF">WHAT IT DOES</text>
<text x="506" y="199" font-family="PingFang SC" font-size="10" font-weight="600" fill="#2F6BFF">NOTES</text>
<line x1="56" y1="252" x2="904" y2="252" stroke="#EDF1F7"/>
<text x="76" y="238" font-family="PingFang SC" font-size="12.5" font-weight="600" fill="#0B1220">HTTP/1.1</text>
<text x="256" y="238" font-family="PingFang SC" font-size="11" font-weight="500" fill="#3B4A61">Streaming proxy both ways</text>
<text x="506" y="238" font-family="PingFang SC" font-size="10" font-weight="400" fill="#6B7A90">hop-by-hop headers stripped · X-Forwarded-* / Forwarded · trusted proxies</text>
<rect x="56" y="252" width="848" height="40" fill="#FFFFFF"/>
<line x1="56" y1="292" x2="904" y2="292" stroke="#EDF1F7"/>
<text x="76" y="278" font-family="PingFang SC" font-size="12.5" font-weight="600" fill="#0B1220">HTTP/2</text>
<text x="256" y="278" font-family="PingFang SC" font-size="11" font-weight="500" fill="#3B4A61">h2 / h2c inbound and out</text>
<text x="506" y="278" font-family="PingFang SC" font-size="10" font-weight="400" fill="#6B7A90">flow control and backpressure linked · gRPC streams and trailers</text>
<line x1="56" y1="332" x2="904" y2="332" stroke="#EDF1F7"/>
<text x="76" y="318" font-family="PingFang SC" font-size="12.5" font-weight="600" fill="#0B1220">HTTP/3</text>
<text x="256" y="318" font-family="PingFang SC" font-size="11" font-weight="500" fill="#3B4A61">QUIC · TLS 1.3</text>
<text x="506" y="318" font-family="PingFang SC" font-size="10" font-weight="400" fill="#6B7A90">no quic-go: the same engine as fib</text>
<rect x="56" y="332" width="848" height="40" fill="#FFFFFF"/>
<line x1="56" y1="372" x2="904" y2="372" stroke="#EDF1F7"/>
<text x="76" y="358" font-family="PingFang SC" font-size="12.5" font-weight="600" fill="#0B1220">WebSocket</text>
<text x="256" y="358" font-family="PingFang SC" font-size="11" font-weight="500" fill="#3B4A61">h1 / h2 / h3 inbound</text>
<text x="506" y="358" font-family="PingFang SC" font-size="10" font-weight="400" fill="#6B7A90">proxied to an HTTP/1.1 upstream, upgrade and tunnel</text>
<line x1="56" y1="412" x2="904" y2="412" stroke="#EDF1F7"/>
<text x="76" y="398" font-family="PingFang SC" font-size="12.5" font-weight="600" fill="#0B1220">TCP / UDP</text>
<text x="256" y="398" font-family="PingFang SC" font-size="11" font-weight="500" fill="#3B4A61">Layer 4 services</text>
<text x="506" y="398" font-family="PingFang SC" font-size="10" font-weight="400" fill="#6B7A90">SNI pass-through without termination · PROXY protocol</text>
<rect x="56" y="412" width="848" height="40" fill="#FFFFFF"/>
<line x1="56" y1="452" x2="904" y2="452" stroke="#EDF1F7"/>
<text x="76" y="438" font-family="PingFang SC" font-size="12.5" font-weight="600" fill="#0B1220">SOCKS / CONNECT</text>
<text x="256" y="438" font-family="PingFang SC" font-size="11" font-weight="500" fill="#3B4A61">Forward proxy</text>
<text x="506" y="438" font-family="PingFang SC" font-size="10" font-weight="400" fill="#6B7A90">SOCKS5 and HTTP CONNECT with client and target rules</text>
<line x1="56" y1="492" x2="904" y2="492" stroke="#EDF1F7"/>
<text x="76" y="478" font-family="PingFang SC" font-size="12.5" font-weight="600" fill="#0B1220">Many protocols, one port</text>
<text x="256" y="478" font-family="PingFang SC" font-size="11" font-weight="500" fill="#3B4A61">Split by first bytes</text>
<text x="506" y="478" font-family="PingFang SC" font-size="10" font-weight="400" fill="#6B7A90">HTTP, TLS, SOCKS and raw TCP on a single listener</text>
<text x="56" y="516" font-family="PingFang SC" font-size="9.5" font-weight="400" fill="#A6B3C6">fit · a reverse proxy, load balancer and API gateway built on fib</text>
<text x="904" y="516" font-family="PingFang SC" font-size="9.5" font-weight="500" fill="#A6B3C6" text-anchor="end">06 / 16</text>
</svg>
