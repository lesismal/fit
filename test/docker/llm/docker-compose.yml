# Docker end-to-end test topology of fit's LLM feature. Start / stop / test with
# test/docker/llm/e2e.sh. Every role is one fit, `fit run -c` with its own
# config file from configs/, which sets its pages (console), the proxy's API
# and the store its config is kept in from then on; the store lives on the
# role's volume, so a restart keeps what the pages changed.
#
# Every directed pair of roles is covered once (who listens, who dials):
#   node1   -> hub     node1 dials the hub           hub   -> node2    the hub dials node2
#   proxy1  -> hub     proxy1 dials the hub          hub   -> proxy2   the hub dials proxy2
#   proxy1  -> node2   proxy1 dials node2 directly   node3 -> proxy2   node3 dials proxy2 directly
# The links are configured by the test through the pages (/mesh/listen,
# /mesh/dial), so every container starts without any.
#
# The pages and the proxy's API listen on 0.0.0.0, which is not loopback, so
# they are served over TLS with the self-signed certificate certgen writes on
# the certs volume (e2e.sh runs the certs service first); the tester does not
# verify it.
name: fit-llm-e2e

x-role: &role
  image: fit-llm-e2e:latest
  init: true
  restart: "no"
  environment:
    FIT_STORE_PASSWORD: ${FIT_E2E_STORE_PASSWORD:-fit-e2e-store-pass}
  depends_on:
    upstream:
      condition: service_healthy

services:
  upstream:
    image: fit-llm-e2e:latest
    build:
      context: ../../..
      dockerfile: test/docker/llm/Dockerfile
      target: fit
      args:
        GOPROXY: ${GOPROXY:-https://proxy.golang.org,direct}
        GO_IMAGE: ${GO_IMAGE:-golang:1.27-bookworm}
        BASE_IMAGE: ${BASE_IMAGE:-debian:bookworm-slim}
    command: ["mockllm", "-addr", ":8000"]
    ports: ["127.0.0.1:18000:8000"]
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8000"]
      interval: 1s
      retries: 30

  # certs writes the self-signed certificate once (kept while the volume is).
  certs:
    image: fit-llm-e2e:latest
    profiles: ["setup"]
    command: ["certgen", "-dir", "/certs", "-hosts", "hub,node1,node2,node3,proxy1,proxy2,localhost,127.0.0.1"]
    volumes: ["certs:/certs"]

  hub:
    <<: *role
    hostname: hub
    command: ["fit", "run", "-c", "/etc/fit/hub.json"]
    ports: ["127.0.0.1:19200:9200"]
    volumes: ["hub-data:/data", "certs:/certs:ro", "./configs:/etc/fit:ro"]
    healthcheck: &health
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9200"]
      interval: 1s
      retries: 60

  node1:
    <<: *role
    hostname: node1
    command: ["fit", "run", "-c", "/etc/fit/node1.json"]
    ports: ["127.0.0.1:19101:9100"]
    volumes: ["node1-data:/data", "certs:/certs:ro", "./configs:/etc/fit:ro"]
    healthcheck: &node-health
      <<: *health
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9100"]

  node2:
    <<: *role
    hostname: node2
    command: ["fit", "run", "-c", "/etc/fit/node2.json"]
    ports: ["127.0.0.1:19102:9100"]
    volumes: ["node2-data:/data", "certs:/certs:ro", "./configs:/etc/fit:ro"]
    healthcheck: *node-health

  node3:
    <<: *role
    hostname: node3
    command: ["fit", "run", "-c", "/etc/fit/node3.json"]
    ports: ["127.0.0.1:19103:9100"]
    volumes: ["node3-data:/data", "certs:/certs:ro", "./configs:/etc/fit:ro"]
    healthcheck: *node-health

  proxy1:
    <<: *role
    hostname: proxy1
    command: ["fit", "run", "-c", "/etc/fit/proxy1.json"]
    ports: ["127.0.0.1:19301:9300", "127.0.0.1:19401:9400"]
    volumes: ["proxy1-data:/data", "certs:/certs:ro", "./configs:/etc/fit:ro"]
    healthcheck: &proxy-health
      <<: *health
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9300 && exec 4<>/dev/tcp/127.0.0.1/9400"]

  proxy2:
    <<: *role
    hostname: proxy2
    command: ["fit", "run", "-c", "/etc/fit/proxy2.json"]
    ports: ["127.0.0.1:19302:9300", "127.0.0.1:19402:9400"]
    volumes: ["proxy2-data:/data", "certs:/certs:ro", "./configs:/etc/fit:ro"]
    healthcheck: *proxy-health

  tester:
    image: fit-llm-e2e-tester:latest
    build:
      context: ../../..
      dockerfile: test/docker/llm/Dockerfile
      target: tester
      args:
        GOPROXY: ${GOPROXY:-https://proxy.golang.org,direct}
        GO_IMAGE: ${GO_IMAGE:-golang:1.27-bookworm}
        BASE_IMAGE: ${BASE_IMAGE:-debian:bookworm-slim}
    profiles: ["test"]
    environment:
      FIT_E2E_SHARED: /shared
    volumes: ["tester-shared:/shared"]

volumes:
  certs:
  hub-data:
  node1-data:
  node2-data:
  node3-data:
  proxy1-data:
  proxy2-data:
  tester-shared:
