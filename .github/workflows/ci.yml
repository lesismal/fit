name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (gofmt / vet / staticcheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: gofmt
        run: make fmt-check
      # Built against the latest x/tools, which keeps up with the compiler's
      # export data format sooner than the x/tools staticcheck pins.
      - name: Install staticcheck
        shell: bash
        run: |
          mkdir "$RUNNER_TEMP/staticcheck" && cd "$RUNNER_TEMP/staticcheck"
          go mod init staticcheck-build
          go get honnef.co/go/tools/cmd/staticcheck@latest golang.org/x/tools@latest
          go install honnef.co/go/tools/cmd/staticcheck
      # fib's engine is split per OS, so vet and staticcheck run once per target.
      - name: go vet
        run: |
          for goos in linux darwin windows; do
            echo "::group::GOOS=$goos"
            GOOS=$goos go vet ./...
            echo "::endgroup::"
          done
      - name: staticcheck
        run: |
          for goos in linux darwin windows; do
            echo "::group::GOOS=$goos"
            GOOS=$goos "$(go env GOPATH)/bin/staticcheck" ./...
            echo "::endgroup::"
          done

  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      # Pebble, the ACME test server, for the tests that obtain certificates
      # (see internal/pebbletest); its version is pebbletest.Version.
      - name: Install Pebble
        run: |
          go install github.com/letsencrypt/pebble/v2/cmd/pebble@v2.10.1
          go install github.com/letsencrypt/pebble/v2/cmd/pebble-challtestsrv@v2.10.1
          echo "FIT_PEBBLE_BIN=$(go env GOPATH)/bin" >> "$GITHUB_ENV"
      - name: go test -race
        shell: bash
        run: go test -race -json ./... | tee test.json | go run ./internal/testsummary
      # A job's log needs a GitHub sign-in to read; its annotations do not.
      # So each failed package's output goes to an annotation as well.
      - name: Annotate failures
        if: failure()
        shell: bash
        run: go run ./internal/testsummary -annotate < test.json

  # Statement coverage across every package, counted for the whole module
  # (-coverpkg) so a package exercised only by another's tests still counts.
  # On main the total is published as a shields.io endpoint file on the
  # `badges` branch, which the README badge reads.
  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Install Pebble
        run: |
          go install github.com/letsencrypt/pebble/v2/cmd/pebble@v2.10.1
          go install github.com/letsencrypt/pebble/v2/cmd/pebble-challtestsrv@v2.10.1
          echo "FIT_PEBBLE_BIN=$(go env GOPATH)/bin" >> "$GITHUB_ENV"
      # No -race here: the test jobs run it, and under it every coverage
      # counter is an atomic the race detector intercepts, which slows the
      # tests that move data many times over.
      # Its failures are annotated as the test jobs' are.
      - name: Test with coverage
        shell: bash
        run: |
          go test -json -count=1 -timeout 20m -covermode=atomic \
            -coverpkg=./... -coverprofile="$RUNNER_TEMP/cover.out" ./... |
            tee test.json | go run ./internal/testsummary
      - name: Annotate failures
        if: failure()
        shell: bash
        run: go run ./internal/testsummary -annotate < test.json
      - name: Summarize
        id: cover
        run: |
          go tool cover -func="$RUNNER_TEMP/cover.out" > "$RUNNER_TEMP/cover.txt"
          total=$(awk '/^total:/ {gsub("%","",$3); print $3}' "$RUNNER_TEMP/cover.txt")
          echo "total=$total" >> "$GITHUB_OUTPUT"
          echo "### Coverage: ${total}%" >> "$GITHUB_STEP_SUMMARY"
          go tool cover -html="$RUNNER_TEMP/cover.out" -o "$RUNNER_TEMP/coverage.html"
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            ${{ runner.temp }}/cover.out
            ${{ runner.temp }}/cover.txt
            ${{ runner.temp }}/coverage.html
      - name: Publish the badge
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          TOTAL: ${{ steps.cover.outputs.total }}
        run: |
          color=$(awk -v t="$TOTAL" 'BEGIN{ if (t>=97) print "brightgreen"; else if (t>=95) print "green"; else if (t>=90) print "yellowgreen"; else if (t>=85) print "yellow"; else if (t>=80) print "orange"; else print "red" }')
          mkdir "$RUNNER_TEMP/badges"
          cd "$RUNNER_TEMP/badges"
          printf '{"schemaVersion":1,"label":"coverage","message":"%s%%","color":"%s"}\n' "$TOTAL" "$color" > coverage.json
          git init -q -b badges
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add coverage.json
          git commit -q -m "coverage: ${TOTAL}%"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" badges
      # The floor the total may not fall below. Raise it as coverage rises;
      # never lower it to let a change in: add the tests instead.
      - name: Check the floor
        env:
          TOTAL: ${{ steps.cover.outputs.total }}
          FLOOR: "98.0"
        run: |
          if awk -v t="$TOTAL" -v f="$FLOOR" 'BEGIN{ exit !(t < f) }'; then
            echo "::error title=Coverage below the floor::${TOTAL}% < ${FLOOR}%"
            exit 1
          fi

  # M2's exit criteria, run on their own so that they show as a check of
  # their own; go test -race ./... above runs them too. With Pebble set
  # to be required, a missing binary fails the job rather than skipping it.
  m2-exit:
    name: M2 exit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Install Pebble
        run: |
          go install github.com/letsencrypt/pebble/v2/cmd/pebble@v2.10.1
          go install github.com/letsencrypt/pebble/v2/cmd/pebble-challtestsrv@v2.10.1
          echo "FIT_PEBBLE_BIN=$(go env GOPATH)/bin" >> "$GITHUB_ENV"
          echo "FIT_PEBBLE_REQUIRED=1" >> "$GITHUB_ENV"
      - name: make m2-exit
        shell: bash
        run: make -s m2-exit EXIT_FLAGS=-json | tee test.json | go run ./internal/testsummary
      - name: Annotate failures
        if: failure()
        shell: bash
        run: go run ./internal/testsummary -annotate < test.json

  # M3's exit criteria, a check of their own as M2's are.
  m3-exit:
    name: M3 exit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: make m3-exit
        shell: bash
        run: make -s m3-exit EXIT_FLAGS=-json | tee test.json | go run ./internal/testsummary
      - name: Annotate failures
        if: failure()
        shell: bash
        run: go run ./internal/testsummary -annotate < test.json

  # The Kubernetes provider against a kind cluster (I58): the runner reaches
  # the pods through a route to the node, as fit outside the cluster needs.
  kubernetes:
    name: Kubernetes e2e (kind)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Create a kind cluster
        run: |
          if ! command -v kind >/dev/null; then
            go install sigs.k8s.io/kind@v0.30.0
            export PATH="$(go env GOPATH)/bin:$PATH"
          fi
          kind create cluster --name fit --wait 120s --kubeconfig "$RUNNER_TEMP/kubeconfig"
          echo "FIT_E2E_KUBECONFIG=$RUNNER_TEMP/kubeconfig" >> "$GITHUB_ENV"
      # The experimental channel, for TCPRoutes, TLSRoutes and UDPRoutes (I59).
      - name: Install the Gateway API's CRDs
        run: kubectl --kubeconfig "$FIT_E2E_KUBECONFIG" apply --server-side -f https://github.com/kubernetes-sigs/gateway-api/releases/download/v1.3.0/experimental-install.yaml
      - name: Route the pod network through the node
        run: |
          node=$(docker inspect -f '{{.NetworkSettings.Networks.kind.IPAddress}}' fit-control-plane)
          cidr=$(kubectl --kubeconfig "$FIT_E2E_KUBECONFIG" get node fit-control-plane -o jsonpath='{.spec.podCIDR}')
          sudo ip route add "$cidr" via "$node"
      - name: go test
        run: go test -race -count=1 -v -run '^TestKubernetesGateway$' ./test/e2e

  # The Gateway API's conformance suite, the core of the GATEWAY-HTTP profile,
  # against fit outside a kind cluster (I61): Gateways on 127.0.0.1's ports
  # 80 and 443, which fit may bind with CAP_NET_BIND_SERVICE.
  conformance:
    name: Gateway API conformance (kind)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Create a kind cluster
        run: |
          if ! command -v kind >/dev/null; then
            go install sigs.k8s.io/kind@v0.30.0
            export PATH="$(go env GOPATH)/bin:$PATH"
          fi
          kind create cluster --name fit --wait 120s --kubeconfig "$RUNNER_TEMP/kubeconfig"
          echo "KUBECONFIG=$RUNNER_TEMP/kubeconfig" >> "$GITHUB_ENV"
      - name: Install the Gateway API's CRDs
        run: kubectl apply --server-side -f https://github.com/kubernetes-sigs/gateway-api/releases/download/v1.3.0/experimental-install.yaml
      - name: Route the pod network through the node
        run: |
          node=$(docker inspect -f '{{.NetworkSettings.Networks.kind.IPAddress}}' fit-control-plane)
          cidr=$(kubectl get node fit-control-plane -o jsonpath='{.spec.podCIDR}')
          sudo ip route add "$cidr" via "$node"
      - name: Build fit and the suite
        run: |
          go build -o "$RUNNER_TEMP/fit" ./cmd/fit
          sudo setcap cap_net_bind_service=+ep "$RUNNER_TEMP/fit"
          cd test/conformance && go test -c -o "$RUNNER_TEMP/conformance.test" .
      - name: Run the suite
        run: REPORT="$RUNNER_TEMP/report.yaml" FIT_LOG="$RUNNER_TEMP/fit.log" test/conformance/run.sh "$RUNNER_TEMP/fit" "$RUNNER_TEMP/conformance.test"
      - name: Keep the report and fit's log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conformance
          path: |
            ${{ runner.temp }}/report.yaml
            ${{ runner.temp }}/fit.log

  # The config examples, in lesismal/fit-examples, validated with the fit of
  # this checkout rather than the one they pin, and the template module
  # built into it.
  examples:
    name: Examples (fit-examples)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/checkout@v5
        with:
          repository: lesismal/fit-examples
          path: .fit-examples
      - name: Validate the examples
        working-directory: .fit-examples
        run: |
          go mod edit -replace "github.com/lesismal/fit=$GITHUB_WORKSPACE"
          go mod tidy
          go test -count=1 ./...
      - name: Build fit with the example module
        run: |
          go run ./cmd/fit build -fit . -with "github.com/lesismal/fit-examples/module/hello=.fit-examples/module/hello" -o "$RUNNER_TEMP/fit-hello"
          "$RUNNER_TEMP/fit-hello" version

  # The assistant's MCP server (I130) with the official Go MCP SDK's client,
  # in a module of its own (test/mcpsdk) so that the SDK stays out of fit's
  # dependencies: it builds this checkout's fit and runs it.
  mcp-sdk:
    name: MCP (official Go SDK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: go vet and go test -race
        working-directory: test/mcpsdk
        run: |
          go vet ./...
          go test -race -count=1 ./...

  # Sync's WASM plugins built by TinyGo and by Rust on the fit-guest crate
  # (I165b), through the same tests as the Go one (plugin/wasm's TestSync*),
  # which skip a guest whose toolchain is missing elsewhere; here
  # FIT_WASM_GUESTS makes a missing one fail. The toolchains are pinned.
  wasm-guests:
    name: WASM guests (TinyGo, Rust)
    runs-on: ubuntu-latest
    env:
      TINYGO_VERSION: 0.44.0
      RUST_VERSION: 1.99.0
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Install TinyGo
        run: |
          curl -sSfL -o "$RUNNER_TEMP/tinygo.deb" "https://github.com/tinygo-org/tinygo/releases/download/v${TINYGO_VERSION}/tinygo_${TINYGO_VERSION}_amd64.deb"
          sudo dpkg -i "$RUNNER_TEMP/tinygo.deb"
          tinygo version
      - name: Install Rust with wasm32-wasip1
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --target wasm32-wasip1
          rustup default "$RUST_VERSION"
          rustc --version
      - name: cargo test (fit-guest)
        working-directory: plugin/wasm/guest/rust
        run: cargo test --quiet
      - name: go test
        env:
          FIT_WASM_GUESTS: tinygo,rust
        run: go test -race -count=1 -v -run '^TestSync' ./plugin/wasm

  # Sync's interop tests against real servers: test/sync/run.sh starts, in
  # Docker, Elasticsearch 8 and OpenSearch 2 with TLS, authentication and a
  # write pool small enough to answer 429s (I168, I169), ClickHouse 25.8
  # (I170), MySQL 5.7, 8.0, 8.4 and MariaDB 10.11, 11 (I172), PostgreSQL 13 to
  # 17 with TLS, SCRAM and logical replication (I177), MongoDB 6, 7 and 8 as
  # replica sets (I181), Kafka 3.9 and Redpanda (I184), TiDB with TiCDC
  # (I185), Redis 7 and Valkey 8 (I186), and MinIO and SeaweedFS (I187), and
  # requires the interop tests to run rather than skip. One job per family
  # of servers, each starting only its own (SYNC_FAMILIES), in parallel
  # rather than every server on one 4-CPU runner; tidb is TiDB with TiCDC,
  # on Kafka, with PostgreSQL 17;
  # matrix is I192's interoperability and recovery matrix, each source into
  # every sink through pipelines killed at random points, on one server of
  # each kind (sync-matrix.yml runs it whole, nightly).
  sync-interop:
    name: Sync interop (${{ matrix.family }})
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.minutes }}
    strategy:
      fail-fast: false
      # go test's -timeout per family, about five times a local run's
      # (2026-11-09, images pulled: search 80s, mysql 277s, postgres 31s,
      # mongo 91s, kafka 66s, tidb 208s, matrix 91s), the job's limit
      # past it for the pulls and the servers' start.
      matrix:
        include:
          - {family: search, timeout: 15m, minutes: 30}
          - {family: mysql, timeout: 30m, minutes: 45}
          - {family: postgres, timeout: 15m, minutes: 30}
          - {family: mongo, timeout: 15m, minutes: 30}
          - {family: kafka, timeout: 15m, minutes: 30}
          - {family: tidb, timeout: 25m, minutes: 45}
          - {family: matrix, timeout: 20m, minutes: 40}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: test/sync/run.sh
        run: SYNC_FAMILIES=${{ matrix.family }} SYNC_TIMEOUT=${{ matrix.timeout }} test/sync/run.sh -v

  # The container image with the Docker Compose example, and the systemd
  # units, each run as deploy/README.md and the examples' READMEs say (I66).
  packaging:
    name: Packaging (image, Compose, systemd)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/checkout@v5
        with:
          repository: lesismal/fit-examples
          path: .fit-examples
      - name: Docker Compose example
        run: FIT_DIR="$GITHUB_WORKSPACE" .fit-examples/docker-compose/test.sh
      - name: systemd units
        run: |
          go build -o "$RUNNER_TEMP/fit" ./cmd/fit
          sudo deploy/systemd/test.sh "$RUNNER_TEMP/fit"

  # The Helm chart, installed in a kind cluster of the example's own with the
  # image built here, serving the Kubernetes example's Gateway and Ingress.
  helm:
    name: Helm chart and Kubernetes example (kind)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: azure/setup-helm@v4
      - name: Install kind
        run: |
          if ! command -v kind >/dev/null; then
            go install sigs.k8s.io/kind@v0.30.0
            echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          fi
      - name: helm lint
        run: helm lint deploy/helm/fit
      - uses: actions/checkout@v5
        with:
          repository: lesismal/fit-examples
          path: .fit-examples
      - name: Kubernetes example
        run: FIT_DIR="$GITHUB_WORKSPACE" .fit-examples/kubernetes/test.sh

  fuzz:
    name: Fuzz (short)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      # Each target briefly, from its committed corpus; fuzz.yml runs them
      # for longer on a schedule.
      - name: Fuzz each target
        run: |
          set -e
          while read -r pkg target; do
            echo "::group::$target"
            go test "$pkg" -run '^$' -fuzz "^$target\$" -fuzztime 15s
            echo "::endgroup::"
          done <<'TARGETS'
          ./config FuzzLoad
          ./router FuzzParseExpr
          ./l4 FuzzReadSNI
          ./l4 FuzzParseProxy
          ./handler/proxy FuzzHopByHop
          ./handler/proxy FuzzForwarded
          ./handler/proxy FuzzGRPCTimeout
          ./handler/fastcgi FuzzReader
          ./adapter/nginx FuzzConvert
          ./adapter/caddyfile FuzzConvert
          ./adapter/fitconf FuzzAdapt
          ./adapter/yaml FuzzAdapt
          ./middleware/cache FuzzDirectives
          ./p2p/stun FuzzParse
          ./vpn/packet FuzzParse
          TARGETS

  # The BitTorrent roles against anacrolix/torrent and libtorrent-rasterbar
  # (I205), in a module of its own (test/btinterop) so that anacrolix stays
  # out of fit's dependencies: it builds this checkout's fit and runs it.
  # fit's client both ways (TCP and uTP, MSE off, preferred and required,
  # v1, hybrid and v2, .torrent files and magnet links), the private tracker
  # over HTTP and UDP, bt_stream while anacrolix seeds, and a publish
  # entry's web seed. libtorrent through Ubuntu's python3-libtorrent; uTP
  # against anacrolix needs cgo (go-libutp). The btbench command beside the
  # tests is the benchmark host's (bench/bt.sh), only built here.
  bittorrent-interop:
    name: BitTorrent interop (anacrolix, libtorrent)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            test/btinterop/go.sum
      - name: Install libtorrent
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3-libtorrent
          python3 -c 'import libtorrent; print("libtorrent", libtorrent.__version__)'
      - name: go vet, go mod tidy -diff
        working-directory: test/btinterop
        run: |
          go vet ./...
          go mod tidy -diff
      - name: Test against anacrolix and libtorrent
        working-directory: test/btinterop
        env:
          CGO_ENABLED: '1'
          FIT_LIBTORRENT: '1'
        run: go test -race -count=1 -timeout 20m -v ./...
