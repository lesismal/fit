name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (gofmt / vet / staticcheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: gofmt
        run: make fmt-check
      # Built against the latest x/tools, which keeps up with the compiler's
      # export data format sooner than the x/tools staticcheck pins.
      - name: Install staticcheck
        shell: bash
        run: |
          mkdir "$RUNNER_TEMP/staticcheck" && cd "$RUNNER_TEMP/staticcheck"
          go mod init staticcheck-build
          go get honnef.co/go/tools/cmd/staticcheck@latest golang.org/x/tools@latest
          go install honnef.co/go/tools/cmd/staticcheck
      # fib's engine is split per OS, so vet and staticcheck run once per target.
      - name: go vet
        run: |
          for goos in linux darwin windows; do
            echo "::group::GOOS=$goos"
            GOOS=$goos go vet ./...
            echo "::endgroup::"
          done
      - name: staticcheck
        run: |
          for goos in linux darwin windows; do
            echo "::group::GOOS=$goos"
            GOOS=$goos "$(go env GOPATH)/bin/staticcheck" ./...
            echo "::endgroup::"
          done

  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      # Pebble, the ACME test server, for the tests that obtain certificates
      # (see internal/pebbletest); its version is pebbletest.Version.
      - name: Install Pebble
        run: |
          go install github.com/letsencrypt/pebble/v2/cmd/pebble@v2.10.1
          go install github.com/letsencrypt/pebble/v2/cmd/pebble-challtestsrv@v2.10.1
          echo "FIT_PEBBLE_BIN=$(go env GOPATH)/bin" >> "$GITHUB_ENV"
      - name: go test -race
        shell: bash
        run: go test -race -json ./... | tee test.json | go run ./internal/testsummary
      # A job's log needs a GitHub sign-in to read; its annotations do not.
      # So each failed package's output goes to an annotation as well.
      - name: Annotate failures
        if: failure()
        shell: bash
        run: go run ./internal/testsummary -annotate < test.json

  # M2's exit criteria, run on their own so that they show as a check of
  # their own; go test -race ./... above runs them too. With Pebble set
  # to be required, a missing binary fails the job rather than skipping it.
  m2-exit:
    name: M2 exit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Install Pebble
        run: |
          go install github.com/letsencrypt/pebble/v2/cmd/pebble@v2.10.1
          go install github.com/letsencrypt/pebble/v2/cmd/pebble-challtestsrv@v2.10.1
          echo "FIT_PEBBLE_BIN=$(go env GOPATH)/bin" >> "$GITHUB_ENV"
          echo "FIT_PEBBLE_REQUIRED=1" >> "$GITHUB_ENV"
      - name: make m2-exit
        run: make m2-exit

  fuzz:
    name: Fuzz (short)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: FuzzLoad
        run: go test ./config -run '^$' -fuzz FuzzLoad -fuzztime 30s
