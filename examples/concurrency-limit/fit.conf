# A concurrency limit: at most 50 report requests under way at once, so that a
# slow, expensive endpoint cannot take every backend connection; the rest are
# answered 503 at once.
# Run one file, from the repository's root: fit run -c examples/concurrency-limit/fit.conf
# fit.json, fit.yaml and fit.conf here say the same; -c on the directory would join all three.
listener web :8080 http/1.1 h2c

upstream reports 127.0.0.1:9000 { response_timeout 5m }

route reports {
	match { path /reports/* }
	middleware concurrency_limit { max 50; status 503 }
	handler proxy { upstream reports }
}
