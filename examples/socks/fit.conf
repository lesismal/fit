# A SOCKS5 (and SOCKS4) forward proxy on a listener of its own: CONNECT for
# the clients of one network, to the destinations allowed.
# Run one file, from the repository's root: fit run -c examples/socks/fit.conf
# fit.json, fit.yaml and fit.conf here say the same; -c on the directory would join all three.
# Try it: curl --socks5-hostname 127.0.0.1:1080 https://example.com/
listener socks :1080 socks {
	socks {
		clients 127.0.0.1/32 10.0.0.0/8
		allow *.example.com example.com 10.1.0.0/16
		deny 169.254.169.254
		ports 80 443
		connect_timeout 10s
		idle_timeout 5m
	}
}
