# ACME certificates shared by several fit instances through Redis: one
# instance obtains each certificate, holding a lock there, the others take it
# from there, and whichever instance the CA reaches answers its challenge.
# shared_storage takes etcd or consul in place of redis the same way.
# Run one file, from the repository's root: fit run -c examples/acme-shared-storage/fit.yaml
# fit.json, fit.yaml and fit.conf here say the same; -c on the directory would join all three.
listeners:
  - name: https
    address: :443
    protocols:
      - http/1.1
      - h2
    tls:
      acme:
        - example.com
        - www.example.com
  - name: http
    address: :80
    protocols:
      - http/1.1
routes:
  - name: site
    listeners:
      - https
    handler:
      module: respond
      params:
        body: |
          hello from one of several
  - name: to-https
    listeners:
      - http
    middleware:
      - module: redirect
        params:
          to: https://{host}{uri}
          status: 308
    handler:
      module: respond
      params:
        status: 404
acme:
  email: ops@example.com
  shared_storage:
    redis:
      address: redis.internal:6379
      username: fit
      # Read at each connection; not in this directory.
      password_file: /etc/fit/redis-password
      db: 0
    # Instances that share certificates share the prefix.
    prefix: fit/
    lock_ttl: 30s
    request_timeout: 10s
