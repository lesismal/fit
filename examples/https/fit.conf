# HTTPS with certificates of your own: HTTP/1.1 and HTTP/2 on 443, two
# certificates picked by the name the client asks for, and port 80
# redirecting to HTTPS. The certificate and key files are not in this
# directory: put yours at the paths below (fit validate opens them).
# Run one file, from the repository's root: fit run -c examples/https/fit.conf
# fit.json, fit.yaml and fit.conf here say the same; -c on the directory would join all three.
listener https :443 http/1.1 h2 {
	tls {
		# The first whose names match the client's SNI; the first of all otherwise.
		certificates {
			cert_file /etc/fit/certs/example.com.pem
			key_file /etc/fit/certs/example.com.key
		}
		certificates {
			cert_file /etc/fit/certs/example.org.pem
			key_file /etc/fit/certs/example.org.key
		}
	}
}

listener http :80 http/1.1

route to-https {
	listeners http
	middleware redirect { to https://{host}{uri}; status 308 }
	handler respond { status 404 }
}

route site {
	listeners https
	middleware headers {
		response { set { Strict-Transport-Security max-age=31536000 } }
	}
	handler respond { body "hello over HTTPS\n" }
}
