# Layer 4 UDP proxying: DNS datagrams spread over two resolvers, each client
# address a session of its own that keeps to one resolver.
# Run one file, from the repository's root: fit run -c examples/l4-udp/fit.yaml
# fit.json, fit.yaml and fit.conf here say the same; -c on the directory would join all three.
# Try it: dig @127.0.0.1 -p 5353 example.com
listeners:
  - name: dns
    address: :5353
    protocols:
      - udp
upstreams:
  - name: resolvers
    addresses:
      - 10.0.0.53:53
      - 10.0.1.53:53
    # A client keeps to one resolver.
    load_balancing: ip_hash
services:
  - name: dns
    listeners:
      - dns
    upstream: resolvers
    # A session with nothing either way for this long ends.
    idle_timeout: 30s
    max_conns: 10000
