# Listeners, routes, upstreams and services from etcd: each key under fit/
# holds a JSON object of them, as a config does, e.g.
#   etcdctl put fit/app '{"routes": [{"handler": {"module": "respond"}}]}'
# Run one file, from the repository's root: fit run -c examples/provider-etcd/fit.yaml
# fit.json, fit.yaml and fit.conf here say the same; -c on the directory would join all three.
listeners:
  - name: web
    address: :8080
    protocols:
      - http/1.1
      - h2c
providers:
  - name: etcd
    etcd:
      # Each member, tried in turn when one fails.
      endpoints:
        - http://10.0.0.71:2379
        - http://10.0.0.72:2379
        - http://10.0.0.73:2379
      prefix: fit/
      max_keys: 1000
      request_timeout: 10s
