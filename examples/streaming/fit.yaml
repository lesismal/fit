# fit's streaming role: a stream published once, over RTMP, RTSP, SRT or WHIP,
# plays over all of them and over HTTP-FLV, HLS and WHEP. Anyone may play;
# publishing takes the studio token (here "test": use your own, and its
# sha256sum) or alice's password.
# Run one file, from the repository's root: fit run -c examples/streaming/fit.yaml
# fit.json, fit.yaml and fit.conf here say the same; -c on the directory would join all three.
listeners:
  - name: web
    address: ":8080"
    protocols: [http/1.1, h2c]
media_auth:
  - name: live
    public: [play]
    tokens:
      # ffmpeg -re -i in.mp4 -c copy -f flv "rtmp://host/live/cam?token=test"
      - name: studio
        token_sha256: 9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08
        publish: [live/*]
    users:
      # RTSP's Digest needs the password itself: rtsp://alice:alice-password@host:8554/alice/cam
      - {name: alice, password: alice-password, publish: [alice/*], play: ["*"]}
streaming:
  max_streams: 32
  max_players: 200
  rtmp: {listen: ":1935", auth: live}
  rtsp: {listen: ":8554", auth: live}
  # ffmpeg ... -f mpegts "srt://host:8890?streamid=#!::r=live/cam,m=publish,s=test"
  srt: {listen: ":8890", auth: live, latency: 200ms}
  webrtc: {listen: ":8188"}
routes:
  # /live/cam.flv plays live/cam as HTTP-FLV, or WebSocket-FLV to an upgrade.
  - name: flv
    match: {path: [/live/*, /alice/*]}
    handler: {module: httpflv, params: {auth: live, cors: "*"}}
  # /hls/live/cam/index.m3u8, and ?format=ts for MPEG-TS segments.
  - name: hls
    match: {path: [/hls/*]}
    handler: {module: hls, params: {prefix: /hls/, auth: live}}
  - name: whip
    match: {path: [/whip/*]}
    handler: {module: stream_whip, params: {auth: live}}
  - name: whep
    match: {path: [/whep/*]}
    handler: {module: stream_whep, params: {auth: live}}
