# The tunnel's server, on a host both sides can reach: nodes behind NAT
# (examples/tunnel-node) and clients (examples/tunnel-client) link to it, and
# it joins a client's tunnels to a node's services. Its console is on
# 127.0.0.1:7080, user admin, password example-password.
# Run one file, from the repository's root: fit run -c examples/tunnel-server/fit.conf
# fit.json, fit.yaml and fit.conf here say the same; -c on the directory would join all three.
tunnel {
	server {
		name hub
		# What nodes and clients register with; never sent over the network.
		password a-registration-password
		# Encrypts every frame's body; nodes and clients need the same.
		body_password a-body-password
		listeners { protocol tcp; address :7000 }
		# For networks that let only HTTP through.
		listeners { protocol ws; address :7001; path /fibhub }
		console {
			address 127.0.0.1:7080
			users {
				username admin
				password_hash $2a$10$gkDJyGagxp1q7R24F0rSjulsgZOFL55Zm6JK2RcxTCLDk23szhZA2
			}
		}
		max_peers 1024
		max_tunnels 16384
	}
}
