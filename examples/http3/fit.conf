# HTTP/3: h3 over QUIC on UDP 443 beside HTTP/1.1 and HTTP/2 on TCP 443,
# announced to the TCP clients with Alt-Svc, the certificate from ACME.
# Run one file, from the repository's root: fit run -c examples/http3/fit.conf
# fit.json, fit.yaml and fit.conf here say the same; -c on the directory would join all three.
# Try it: curl --http3 https://example.com/
listener https :443 http/1.1 h2 h3 { tls { acme example.com } }
listener http :80 http/1.1

upstream app 127.0.0.1:9000

route app { listeners https; handler proxy { upstream app } }

route to-https {
	listeners http
	middleware redirect { to https://{host}{uri}; status 308 }
	handler respond { status 404 }
}

acme { email ops@example.com }
