# HTTP/3: h3 over QUIC on UDP 443 beside HTTP/1.1 and HTTP/2 on TCP 443,
# announced to the TCP clients with Alt-Svc, the certificate from ACME.
# Run one file, from the repository's root: fit run -c examples/http3/fit.yaml
# fit.json, fit.yaml and fit.conf here say the same; -c on the directory would join all three.
# Try it: curl --http3 https://example.com/
listeners:
  - name: https
    address: :443
    protocols:
      - http/1.1
      - h2
      - h3
    tls:
      acme:
        - example.com
  - name: http
    address: :80
    protocols:
      - http/1.1
upstreams:
  - name: app
    addresses:
      - 127.0.0.1:9000
routes:
  - name: app
    listeners:
      - https
    handler:
      module: proxy
      params:
        upstream: app
  - name: to-https
    listeners:
      - http
    middleware:
      - module: redirect
        params:
          to: https://{host}{uri}
          status: 308
    handler:
      module: respond
      params:
        status: 404
acme:
  email: ops@example.com
