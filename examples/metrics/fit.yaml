# Prometheus metrics: the Admin API serves them at /metrics, and metrics adds
# per listener and per route request counts and latencies.
# Run one file, from the repository's root: fit run -c examples/metrics/fit.yaml
# fit.json, fit.yaml and fit.conf here say the same; -c on the directory would join all three.
# Try it: curl http://127.0.0.1:2019/metrics
listeners:
  - name: web
    address: :8080
    protocols:
      - http/1.1
      - h2c
routes:
  - name: hello
    handler:
      module: respond
      params:
        body: |
          hello
admin:
  address: 127.0.0.1:2019
# Count and time requests by listener and route: a little cost on each.
metrics: {}
