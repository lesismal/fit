# The LLM feature's hub, which shares AI models among machines: nodes (GPU
# machines, see examples/llm-node) and proxies (see examples/llm-proxy)
# link to it, and it passes calls between them. Its console is on
# 127.0.0.1:9200, user admin, password example-password. The id is written
# out, as fit would otherwise write a new one back into this file.
# Run one file, from the repository's root: fit run -c examples/llm-hub/fit.conf
# fit.json, fit.yaml and fit.conf here say the same; -c on the directory would join all three.
llm {
	hub {
		id hub-5f1c0a8e2b7d4c39
		name hub-1
		console {
			address 127.0.0.1:9200
			users {
				username admin
				password_hash $2a$10$gkDJyGagxp1q7R24F0rSjulsgZOFL55Zm6JK2RcxTCLDk23szhZA2
			}
		}
		# Where nodes and proxies link to; they prove they know the password
		# without sending it.
		listen { address :9210; password mesh-secret }
		limits { max_conns 1024; max_inflight 1024; ping_interval 15s }
		max_nodes 1024
	}
}
