# A fixed response on port 8080, and 404 for any other path.
# Run one file, from the repository's root: fit run -c examples/hello/fit.conf
# fit.json, fit.yaml and fit.conf here say the same; -c on the directory would join all three.
# Try it: curl http://127.0.0.1:8080/hello
listener web {
	address :8080
	protocols http/1.1 h2c
}

route hello {
	match {
		path /hello
	}
	handler respond {
		body "hello from fit\n"
	}
}

route not-found {
	priority -1
	handler respond {
		status 404
		body "not found\n"
	}
}
