# Certificates obtained on demand, during the TLS handshake, for any name a
# client asks for (a SaaS with customers' own domains): an ask URL of yours
# says which names may have one, and rate and count limits bound the rest.
# Run one file, from the repository's root: fit run -c examples/acme-on-demand/fit.yaml
# fit.json, fit.yaml and fit.conf here say the same; -c on the directory would join all three.
listeners:
  - name: https
    address: :443
    protocols:
      - http/1.1
      - h2
    tls:
      # Names known ahead are obtained at start; others on demand.
      acme:
        - app.example.com
      on_demand: true
  # HTTP-01 challenges are answered on port 80.
  - name: http
    address: :80
    protocols:
      - http/1.1
routes:
  - name: tenants
    listeners:
      - https
    handler:
      module: respond
      params:
        body: |
          a customer's site
  - name: to-https
    listeners:
      - http
    middleware:
      - module: redirect
        params:
          to: https://{host}{uri}
          status: 308
    handler:
      module: respond
      params:
        status: 404
acme:
  email: ops@example.com
  on_demand:
    # fit asks GET http://127.0.0.1:5555/allowed?domain=<name>: 2xx allows it.
    ask: http://127.0.0.1:5555/allowed
    # At most 10 new certificates a minute, 5000 names in all.
    rate: 10
    interval: 1m
    max_names: 5000
    # A name no handshake asked for in a week is dropped.
    idle_timeout: 168h
