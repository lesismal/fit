# A tunnel node, behind NAT: it links out to the hub (examples/tunnel-hub)
# and opens tunnels, for the proxies the hub joins, to the services it
# exposes, and to nothing else.
# Run one file, from the repository's root: fit run -c examples/tunnel-node/fit.conf
# fit.json, fit.yaml and fit.conf here say the same; -c on the directory would join all three.
tunnel {
	node {
		name lab
		hubs hub {
			# Tried in turn: the WebSocket when TCP is blocked.
			endpoints { address 127.0.0.1:7000 }
			endpoints { address ws://127.0.0.1:7001/tunnel }
			password a-registration-password
			body_password a-body-password
			pool_size 4
		}
		services ssh { address 10.0.0.5:22; description "the lab's gateway" }
		services web { address 127.0.0.1:8080 }
		idle_timeout 2h
		max_tunnels 4096
	}
}
