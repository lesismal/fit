# Layer 4 TCP proxying: PostgreSQL passed through byte for byte to a primary
# and a standby, and TLS on 443 routed by SNI without being terminated, one
# service's upstream told the client's address with a PROXY header.
# Run one file, from the repository's root: fit run -c examples/l4-tcp/fit.yaml
# fit.json, fit.yaml and fit.conf here say the same; -c on the directory would join all three.
listeners:
  - name: postgres
    address: :5432
    protocols:
      - tcp
  - name: tls
    address: :443
    protocols:
      - tcp
upstreams:
  - name: db
    addresses:
      - 10.0.0.21:5432
      - 10.0.0.22:5432
    connect_timeout: 3s
    # A TCP check: the port accepts connections.
    health_check:
      type: tcp
      interval: 5s
  - name: mail
    addresses:
      - 10.0.0.31:443
  - name: web
    addresses:
      - 10.0.0.41:443
      - 10.0.0.42:443
services:
  - name: postgres
    listeners:
      - postgres
    upstream: db
    idle_timeout: 1h
    max_conns: 2000
  # TLS whose ClientHello asks for mail.example.com goes to mail...
  - name: mail
    listeners:
      - tls
    upstream: mail
    server_names:
      - mail.example.com
  # ...and every other name, or none, to web, with a PROXY v2 header first.
  - name: web
    listeners:
      - tls
    upstream: web
    proxy_protocol: v2
