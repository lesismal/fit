# Redirects: a moved section, permanently, keeping the rest of the path; an
# old host name to the new one; and the rest answered as usual.
# Run one file, from the repository's root: fit run -c examples/redirect/fit.yaml
# fit.json, fit.yaml and fit.conf here say the same; -c on the directory would join all three.
# Try it: curl -i http://127.0.0.1:8080/blog/2024/hello
listeners:
  - name: web
    address: :8080
    protocols:
      - http/1.1
      - h2c
routes:
  - name: old-host
    match:
      host:
        - old.example.com
    middleware:
      - module: redirect
        params:
          to: https://www.example.com{uri}
          status: 301
    handler:
      module: respond
      params:
        status: 404
  # Requests the regexp does not match go on to the handler.
  - name: moved
    middleware:
      - module: redirect
        params:
          regexp: ^/blog/(.*)$
          to: /articles/$1
          status: 308
    handler:
      module: respond
      params:
        body: |
          not moved
