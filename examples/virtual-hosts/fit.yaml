# Several sites on one listener, told apart by host name: exact names, a
# "*." wildcard, and a default for any other host. In fit.conf, each site's
# routes are written together in a site block.
# Run one file, from the repository's root: fit run -c examples/virtual-hosts/fit.yaml
# fit.json, fit.yaml and fit.conf here say the same; -c on the directory would join all three.
# Try it: curl -H 'Host: blog.example.com' http://127.0.0.1:8080/
listeners:
  - name: web
    address: :8080
    protocols:
      - http/1.1
      - h2c
routes:
  - name: www
    match:
      host:
        - example.com
        - www.example.com
    handler:
      module: respond
      params:
        body: |
          www
  - name: api
    match:
      host:
        - api.example.com
      path:
        - /v1/*
    handler:
      module: respond
      params:
        body: |
          api v1
  # One label below example.com: blog.example.com, shop.example.com.
  - name: tenants
    match:
      host:
        - '*.example.com'
    handler:
      module: respond
      params:
        body: |
          a tenant's site
  # Any other host.
  - name: default
    priority: -1
    handler:
      module: respond
      params:
        status: 421
        body: |
          unknown host
