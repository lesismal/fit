# fit's media pages at /media/: a room call, publish and play pages over
# fit's own media server, WHIP on /whip/<stream> and WHEP on /whep/<stream>,
# behind one media_auth policy. Log in on the pages as alice
# (alice-password), who may publish and play every stream, or as guest
# (guest-password), who may only use the room "lobby"; anyone may watch.
# Browsers open the camera and the microphone only over HTTPS, or on
# localhost: open http://localhost:8080/media/ here, and add a TLS listener
# for other machines.
# Run one file, from the repository's root: fit run -c examples/media-pages/fit.conf
# fit.json, fit.yaml and fit.conf here say the same; -c on the directory would join all three.
listener web :8080 http/1.1 h2c

media_auth media {
	# Signs the pages' logins; replace it with a long random secret.
	secret replace-me-with-a-long-random-secret
	public play
	# fit hash-password makes the hash of another password.
	users alice {
		password_hash $2a$10$Fq1ONPcWafh7L8Rqw/wBlOX87AVAV7hZrin/rWwd7vUZv6MlW.v.G
		publish *
		play *
	}
	users guest { password guest-password; publish lobby-*; play lobby-* }
}

route pages {
	match { path /media /media/* }
	handler media_pages { auth media; login true; title "fit media" }
}

route publish { match { path /whip/* }; handler whip { auth media } }
route play { match { path /whep/* }; handler whep { auth media } }

webrtc { media { listen :8189; max_streams 64; max_viewers 64 } }
