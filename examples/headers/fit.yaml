# Header fields: security headers on every response, internal fields removed
# on the way out, and fields set on the request the upstream gets.
# Run one file, from the repository's root: fit run -c examples/headers/fit.yaml
# fit.json, fit.yaml and fit.conf here say the same; -c on the directory would join all three.
listeners:
  - name: web
    address: :8080
    protocols:
      - http/1.1
      - h2c
upstreams:
  - name: app
    addresses:
      - 127.0.0.1:9000
routes:
  - name: app
    middleware:
      - module: headers
        params:
          request:
            set:
              X-Env: production
            # Never trust a client's own.
            delete:
              - X-Internal-*
          response:
            set:
              Strict-Transport-Security: max-age=31536000; includeSubDomains
              X-Content-Type-Options: nosniff
              Referrer-Policy: strict-origin-when-cross-origin
            add:
              Vary:
                - Accept-Encoding
            delete:
              - Server
              - X-Powered-By
              - X-Debug-*
    handler:
      module: proxy
      params:
        upstream: app
