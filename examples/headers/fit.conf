# Header fields: security headers on every response, internal fields removed
# on the way out, and fields set on the request the upstream gets.
# Run one file, from the repository's root: fit run -c examples/headers/fit.conf
# fit.json, fit.yaml and fit.conf here say the same; -c on the directory would join all three.
listener web :8080 http/1.1 h2c

upstream app 127.0.0.1:9000

route app {
	middleware headers {
		request {
			set { X-Env production }
			# Never trust a client's own.
			delete X-Internal-*
		}
		response {
			set {
				Strict-Transport-Security "max-age=31536000; includeSubDomains"
				X-Content-Type-Options nosniff
				Referrer-Policy strict-origin-when-cross-origin
			}
			add { Vary Accept-Encoding }
			delete Server X-Powered-By X-Debug-*
		}
	}
	handler proxy { upstream app }
}
