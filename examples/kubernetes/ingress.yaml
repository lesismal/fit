# The same app as an Ingress of fit's IngressClass, for whoami-ingress.example.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: whoami
spec:
  ingressClassName: fit
  rules:
    - host: whoami-ingress.example
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: whoami
                port: {number: 80}
