# hello.json, written in YAML: fit run, fit validate and fit adapt take either.
listeners:
  - name: web
    address: :8080
    protocols:
      - http/1.1
      - h2c
routes:
  - name: hello
    match:
      path:
        - /hello
    handler:
      module: respond
      params:
        body: |
          hello from fit
  - name: not-found
    priority: -1
    handler:
      module: respond
      params:
        status: 404
        body: |
          not found
