# A WebAssembly plugin on each request, on a pool of its own: continue.wasm
# lets every request through (continue.wat is its source); build a real one
# from Go with plugin/wasm/guest, or use a Proxy-Wasm filter.
# Run one file, from the repository's root: fit run -c examples/wasm/fit.yaml
# fit.json, fit.yaml and fit.conf here say the same; -c on the directory would join all three.
listeners:
  - name: web
    address: :8080
    protocols:
      - http/1.1
      - h2c
routes:
  - name: filtered
    middleware:
      - module: wasm
        params:
          # Relative to the directory fit runs in.
          path: examples/wasm/continue.wasm
          # A string the plugin reads, for settings of its own.
          config: '{"deny": ["/admin"]}'
          # 4 instances, each with its own memory, up to 64 MiB.
          instances: 4
          max_memory_bytes: 67108864
          queue: 1024
          timeout: 50ms
          wait_timeout: 1s
          # A plugin that fails lets the request go on rather than answer 500.
          on_error: skip
    handler:
      module: respond
      params:
        body: |
          passed the plugin
