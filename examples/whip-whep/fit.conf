# fit as a WebRTC media server (an SFU): publishers send a stream with WHIP to
# /whip/<name>, behind a JWT, and viewers play it with WHEP from /whep/<name>;
# every peer's media shares UDP port 8189.
# Run one file, from the repository's root: fit run -c examples/whip-whep/fit.conf
# fit.json, fit.yaml and fit.conf here say the same; -c on the directory would join all three.
listener web :8080 http/1.1 h2c

# /whip/cam1 publishes cam1; the session URLs below it match too.
route publish {
	match { path /whip/* }
	middleware jwt {
		jwks_url https://auth.example.com/.well-known/jwks.json
		audience whip
	}
	handler whip
}

route play { match { path /whep/* }; handler whep }

webrtc {
	media {
		listen :8189
		# Behind a 1:1 NAT: the address peers are told.
		public_ips 203.0.113.5
		ice_servers { urls stun:stun.l.google.com:19302 }
		codecs opus VP8 H264
		max_streams 16
		max_viewers 100
		max_bitrate 4000000
	}
}
