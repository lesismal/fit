# The PROXY protocol: fit behind a TCP load balancer (HAProxy, an AWS NLB)
# that sends a PROXY header first, so that fit sees, logs and limits by the
# real client address. Connections from elsewhere are served as they are.
# Sending one upstream is a service's proxy_protocol (see examples/l4-tcp).
# Run one file, from the repository's root: fit run -c examples/proxy-protocol/fit.conf
# fit.json, fit.yaml and fit.conf here say the same; -c on the directory would join all three.
listener web :8080 http/1.1 h2c {
	# Only these may send the header; each of their connections must.
	proxy_protocol { trusted 10.0.0.0/8 127.0.0.1/32 }
}

route who {
	# Counts by the address the header names.
	middleware rate_limit { rate 20; burst 40 }
	handler respond { body "hello\n" }
}
