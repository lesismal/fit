# Telegraf in the sync benchmark's mqtt-influxdb scenario, as fit
# (configs/fit/mqtt-influxdb.conf): the MQTT topic bench at QoS 1 in a
# persistent session (MQTT 3.1.1, the plugin's only version), each message
# acknowledged once the output has written it (tracking metrics), a reading
# a point of the measurement reading in InfluxDB 2's bucket bench: the tag
# sensor, the numbers as fields (floats, the json format's), the time ts.
# Batches of 500 metrics flushed after at most 1s (fit's batch max_records
# and max_wait; Telegraf's defaults are 1000 and 10s), 1000 messages
# unacknowledged at most (fit's receive_maximum, Mosquitto's
# max_inflight_messages), no host or topic tag, which fit does not write.
[agent]
  interval = "10s"
  round_interval = false
  metric_batch_size = 500
  metric_buffer_limit = 10000
  flush_interval = "1s"
  flush_jitter = "0s"
  omit_hostname = true

[[inputs.mqtt_consumer]]
  servers = ["tcp://mosquitto:1883"]
  topics = ["bench"]
  topic_tag = ""
  qos = 1
  persistent_session = true
  client_id = "telegraf-bench"
  max_undelivered_messages = 1000
  name_override = "reading"
  data_format = "json"
  tag_keys = ["sensor"]
  json_time_key = "ts"
  json_time_format = "2006-01-02T15:04:05Z07:00"

[[outputs.influxdb_v2]]
  urls = ["http://influxdb:8086"]
  token = "${INFLUX_TOKEN}"
  organization = "bench"
  bucket = "bench"
