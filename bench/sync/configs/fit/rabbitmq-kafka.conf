# fit in the sync benchmark's rabbitmq-kafka scenario: the queue bench,
# each message acknowledged once Kafka has it, into the topic bench, a
# message a message, as it is (the codec raw), as Kafka Connect's Camel
# connector does (configs/connect/rabbitmq.json).
admin { address unix//run/fit/admin.sock }
pprof { max_duration 5m }

sync {
	state_dir /tmp/fit-sync
	pipelines bench {
		source rabbitmq {
			addresses rabbitmq:5672
			username bench
			password_env RABBITMQ_PASSWORD
			queues bench
			prefetch 1000
			codec raw
		}
		sinks kafka {
			sink kafka {
				brokers kafka:9092
				topic bench
				codec raw
				create_topics { partitions 1; replication_factor 1 }
			}
		}
	}
}
