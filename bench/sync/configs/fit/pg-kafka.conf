# fit in the sync benchmark's pg-kafka scenario: public.items's changes,
# through a slot and a publication fit makes, from where the slot starts,
# into the topic bench, a message a row in Debezium's envelope.
admin { address unix//run/fit/admin.sock }
pprof { max_duration 5m }

sync {
	state_dir /tmp/fit-sync
	pipelines bench {
		source postgres {
			address postgres:5432
			user postgres
			password_env PG_PASSWORD
			database shop
			sslmode disable
			create true
			publication fit_bench
			slot fit_bench
			tables public.items
			snapshot never
		}
		sinks kafka {
			sink kafka {
				brokers kafka:9092
				topic bench
				codec debezium
				create_topics { partitions 1; replication_factor 1 }
			}
		}
	}
}
