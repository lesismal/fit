# fit in the sync benchmark's mysql-kafka scenario: shop.items's binlog,
# from where it is when fit starts, into the topic bench, a message a row in
# Debezium's envelope, keyed by the id.
admin { address unix//run/fit/admin.sock }
pprof { max_duration 5m }

sync {
	state_dir /tmp/fit-sync
	pipelines bench {
		source mysql {
			address mysql:3306
			username root
			password_env MYSQL_PASSWORD
			server_id 4101
			tables shop.items
			snapshot never
		}
		sinks kafka {
			sink kafka {
				brokers kafka:9092
				topic bench
				codec debezium
				create_topics { partitions 1; replication_factor 1 }
			}
		}
	}
}
