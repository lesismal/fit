# fit in the sync benchmark's mqtt-kafka scenario: the MQTT topic bench at
# QoS 1, each message acknowledged once Kafka has it, into the Kafka topic
# bench, a message a message, as it is (the codec raw), as Kafka Connect's
# Camel connector does (configs/connect/mqtt.json).
admin { address unix//run/fit/admin.sock }
pprof { max_duration 5m }

sync {
	state_dir /tmp/fit-sync
	pipelines bench {
		source mqtt {
			servers mosquitto:1883
			client_id fit-bench
			topics bench
			receive_maximum 1000
			codec raw
		}
		sinks kafka {
			sink kafka {
				brokers kafka:9092
				topic bench
				codec raw
				create_topics { partitions 1; replication_factor 1 }
			}
		}
	}
}
