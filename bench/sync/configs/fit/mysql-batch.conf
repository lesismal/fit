# fit in the sync benchmark's mysql-batch scenario: a job copying shop.items
# from mysql to mysql2, in chunks of its key read four at a time, as DataX's
# job does with four channels, and written in batches of 1,000 rows, its
# batchSize there.
admin { address unix//run/fit/admin.sock }
pprof { max_duration 5m }

sync {
	state_dir /tmp/fit-sync
	pipelines bench {
		mode once
		source mysql {
			address mysql:3306
			username root
			password_env MYSQL_PASSWORD
			server_id 4101
			tables shop.items
		}
		sinks copy {
			sink mysql {
				address mysql2:3306
				username root
				password_env MYSQL_PASSWORD
				transactions batch
			}
			batch { max_records 1000 }
		}
		job { max_parallel 4 }
	}
}
