# fit in the sync benchmark's mysql-es scenario: shop.items's binlog, from
# where it is when fit starts, into the index bench, a document a row by its
# id.
admin { address unix//run/fit/admin.sock }
pprof { max_duration 5m }

sync {
	state_dir /tmp/fit-sync
	pipelines bench {
		source mysql {
			address mysql:3306
			username root
			password_env MYSQL_PASSWORD
			server_id 4101
			tables shop.items
			snapshot never
		}
		sinks es {
			sink elasticsearch { urls http://es:9200; index bench }
		}
	}
}
