# fit in the sync benchmark's files scenario: the files' lines, as they
# are, into one file. The Admin API listens on a Unix socket in a volume
# syncbench mounts too, to take profiles through; nothing binds a port.
admin { address unix//run/fit/admin.sock }
pprof { max_duration 5m }

sync {
	state_dir /tmp/fit-sync
	pipelines bench {
		source file { paths /data/in/*.log }
		sinks out { sink file { path /data/out/fit.log } }
	}
}
