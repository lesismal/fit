# fit in the sync benchmark's files-loki scenario: the files' lines, as
# they are, into Loki, one stream labelled job=bench, as Promtail's config
# does (configs/promtail/promtail.yml): pushes of up to 1 MiB of lines,
# snappy protobuf. The Admin API listens on a Unix socket in a volume
# syncbench mounts too, to take profiles through; nothing binds a port.
admin { address unix//run/fit/admin.sock }
pprof { max_duration 5m }

sync {
	state_dir /tmp/fit-sync
	pipelines bench {
		source file { paths /data/in/*.log }
		sinks loki {
			sink loki {
				urls http://loki:3100
				labels { job bench }
			}
			batch { max_wait 1s }
		}
	}
}
