# fit in the sync benchmark's mqtt-influxdb scenario: the MQTT topic bench
# at QoS 1 in a persistent session, each message acknowledged once InfluxDB
# has it, a reading a point of the measurement reading in InfluxDB 2's
# bucket bench: the tag sensor, the fields id, temp and hum, the time ts.
# Batches of 500 points sent after at most 1s (fit's defaults), as
# Telegraf's metric_batch_size and flush_interval (configs/telegraf/
# mqtt-influxdb.conf); 1000 messages unacknowledged at most, as Telegraf's
# max_undelivered_messages and Mosquitto's max_inflight_messages.
admin { address unix//run/fit/admin.sock }
pprof { max_duration 5m }

sync {
	state_dir /tmp/fit-sync
	pipelines bench {
		source mqtt {
			servers mosquitto:1883
			client_id fit-bench
			topics bench
			receive_maximum 1000
			codec json
		}
		sinks influxdb {
			sink influxdb {
				url http://influxdb:8086
				org bench
				bucket bench
				token_env INFLUX_TOKEN
				measurement reading
				tags sensor
				fields id temp hum
				time_field ts
				precision ms
			}
			batch { max_records 500; max_wait 1s }
		}
	}
}
