# fit in the sync benchmark's mssql-kafka scenario: shop.dbo.items's
# changes from SQL Server's CDC tables, from where they are when fit
# starts, into the topic bench, a message a row in Debezium's envelope,
# keyed by the id, as Debezium's SQL Server connector does
# (configs/debezium/mssql.json).
admin { address unix//run/fit/admin.sock }
pprof { max_duration 5m }

sync {
	state_dir /tmp/fit-sync
	pipelines bench {
		source mssql {
			address mssql:1433
			username sa
			password_env MSSQL_PASSWORD
			database shop
			encrypt off
			tables dbo.items
			snapshot never
		}
		sinks kafka {
			sink kafka {
				brokers kafka:9092
				topic bench
				codec debezium
				create_topics { partitions 1; replication_factor 1 }
			}
		}
	}
}
