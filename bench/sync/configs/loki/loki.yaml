# Loki in the sync benchmark's files-loki scenario: the image's single
# binary, on its own filesystem, without authentication, with the limits
# raised so that no mover is slowed by Loki's rate limits (4 MB/s a tenant
# and 3 MB/s a stream by default) rather than by its own work. syncbench
# counts the lines its distributor took, from /metrics.
auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: warn
  grpc_server_max_recv_msg_size: 16777216

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2020-10-24
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  ingestion_rate_mb: 4096
  ingestion_burst_size_mb: 8192
  per_stream_rate_limit: 4GB
  per_stream_rate_limit_burst: 8GB
  max_line_size: 0
  reject_old_samples: false

analytics:
  reporting_enabled: false
