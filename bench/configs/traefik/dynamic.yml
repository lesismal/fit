# fitbench fills in the addresses of the proxy and WebSocket backends. The
# proxy scenario, the large download and upload, and the API workload all go
# to the proxy backend.
http:
  routers:
    proxy:
      rule: "Path(`/proxy`) || PathPrefix(`/proxy/`) || PathPrefix(`/api/`)"
      entryPoints: [h1, h2c]
      service: backend
    proxy-tls:
      rule: "Path(`/proxy`) || PathPrefix(`/proxy/`) || PathPrefix(`/api/`)"
      entryPoints: [tls, h2, h3]
      service: backend
      tls: {}
    ws:
      rule: "Path(`/ws`)"
      entryPoints: [h1]
      service: wsbackend
  services:
    backend:
      loadBalancer:
        servers:
          - url: "http://{{BACKEND}}"
    wsbackend:
      loadBalancer:
        servers:
          - url: "http://{{WSBACKEND}}"
tls:
  stores:
    default:
      defaultCertificate:
        certFile: /certs/cert.pem
        keyFile: /certs/key.pem
