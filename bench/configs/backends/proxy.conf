# The proxy backend: nginx on port 9000, on the backends' 2 CPUs, which every
# server's proxy scenarios forward to over HTTP/1.1 with keep-alive. It is
# no server under test, and the same for all of them. fitbench fills in
# {{BACKEND_WORKERS}}, one worker for each of the backends' CPUs, and the API
# workload's bodies.
#
#   /api/*          a GET answered with 1 KiB of JSON, a POST with 256 bytes
#   /proxy/upload   any request, its body read and dropped, answered with 256 bytes
#   /proxy/large    1 MiB, from the file the download scenario serves
#   anything else   200, text/plain, "hello, world"
worker_processes {{BACKEND_WORKERS}};
worker_rlimit_nofile 1048576;
error_log stderr error;

events {
    worker_connections 65536;
    multi_accept on;
}

http {
    access_log off;
    server_tokens off;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    # The proxies keep their idle connections 60s; the backend keeps them
    # longer, so that it is never the one to close them.
    keepalive_timeout 120s;
    keepalive_requests 1000000;
    client_max_body_size 16m;
    gzip off;

    server {
        listen 9000 reuseport;

        location /api/ {
            default_type application/json;
            if ($request_method = POST) {
                return 200 '{{APIPOSTREPLY}}';
            }
            return 200 '{{APIBODY}}';
        }
        location = /proxy/upload {
            default_type application/json;
            return 200 '{{APIPOSTREPLY}}';
        }
        location = /proxy/large {
            default_type application/octet-stream;
            alias /srv/www/site/large.bin;
        }
        location / {
            default_type text/plain;
            return 200 "hello, world";
        }
    }
}
