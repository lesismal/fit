# The proxy backend: nginx on port 9000, on the backends' 6 CPUs, which every
# server's proxy scenarios forward to over HTTP/1.1 with keep-alive. It is
# no server under test, and the same for all of them. fitbench fills in
# {{BACKEND_WORKERS}}, one worker for each of the backends' CPUs, and the API
# workload's bodies.
#
#   /api/*          a GET answered with 1 KiB of JSON, a POST with 256 bytes
#   /proxy/upload   any request, its body read whole and dropped, answered with 256 bytes
#   /proxy/large    1 MiB, from the file the download scenario serves
#   anything else   200, text/plain, "hello, world"
# Tuned for its own speed, not aligned with the servers under test: a
# worker pinned to each of its CPUs, its connections kept as long as the
# proxies want them, file metadata cached, and as little in each response
# as nginx allows.
worker_processes {{BACKEND_WORKERS}};
worker_cpu_affinity auto;
worker_rlimit_nofile 1048576;
error_log stderr crit;

events {
    use epoll;
    worker_connections 65536;
    multi_accept on;
    accept_mutex off;
}

http {
    access_log off;
    server_tokens off;
    etag off;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    open_file_cache max=20000 inactive=10m;
    open_file_cache_valid 60s;
    open_file_cache_min_uses 1;
    # The proxies keep their idle connections 60s; the backend keeps them
    # longer, so that it is never the one to close them.
    keepalive_timeout 300s;
    keepalive_requests 100000000;
    client_max_body_size 16m;
    gzip off;

    upstream upload_reply {
        server unix:/tmp/upload-reply.sock;
        keepalive 256;
    }

    server {
        listen unix:/tmp/upload-reply.sock;
        location / {
            default_type application/json;
            return 200 '{{APIPOSTREPLY}}';
        }
    }

    server {
        listen 9000 reuseport backlog=2048;

        location /api/ {
            default_type application/json;
            if ($request_method = POST) {
                return 200 '{{APIPOSTREPLY}}';
            }
            return 200 '{{APIBODY}}';
        }
        # The upload is read whole, into memory, before it is answered, as
        # an application reads a body first: nginx's return would answer at
        # once and drop the body as it came, which a proxy streaming the
        # upload sees as an answer before the end of its request. The body
        # is not passed on to the reply.
        location = /proxy/upload {
            client_body_buffer_size 2m;
            proxy_pass http://upload_reply;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
        }
        location = /proxy/large {
            default_type application/octet-stream;
            alias /srv/www/site/large.bin;
        }
        location / {
            default_type text/plain;
            return 200 "hello, world";
        }
    }
}
