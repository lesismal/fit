# The cache origin: nginx on port 9003, on the backends' 2 CPUs, which the
# caches of the cache and website-edge scenarios fetch from. Every response
# is fresh for 10 minutes. It counts what it answers with stub_status at
# 127.0.0.1:9004, from which fitbench works out the hit ratio; it is a
# process of its own, so that only the caches' requests are counted. fitbench
# fills in {{BACKEND_WORKERS}}.
#
#   /cache/*   4 KiB, the same for every path
#   /edge/*    the website's files
worker_processes {{BACKEND_WORKERS}};
worker_rlimit_nofile 1048576;
error_log stderr error;

events {
    worker_connections 65536;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    access_log off;
    server_tokens off;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 120s;
    keepalive_requests 1000000;

    server {
        listen 9003 reuseport;

        # Every /cache/ path is answered with the one file.
        location /cache/ {
            default_type text/plain;
            add_header Cache-Control "max-age=600";
            root /srv/www;
            try_files /backend/cache.txt =404;
        }
        location /edge/ {
            add_header Cache-Control "max-age=600";
            alias /srv/www/site/;
        }
    }

    server {
        listen 127.0.0.1:9004;
        location = /status {
            stub_status;
        }
    }
}
