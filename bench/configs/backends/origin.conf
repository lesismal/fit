# The cache origin: nginx on port 9003, on the backends' 6 CPUs, which the
# caches of the cache and website-edge scenarios fetch from. Every response
# is fresh for 10 minutes. It counts what it answers with stub_status at
# 127.0.0.1:9004, from which fitbench works out the hit ratio; it is a
# process of its own, so that only the caches' requests are counted. fitbench
# fills in {{BACKEND_WORKERS}}.
#
#   /cache/*   4 KiB, the same for every path
#   /edge/*    the website's files
# Tuned for its own speed, not aligned with the servers under test: a
# worker pinned to each of its CPUs, its connections kept as long as the
# proxies want them, file metadata cached, and as little in each response
# as nginx allows.
worker_processes {{BACKEND_WORKERS}};
worker_cpu_affinity auto;
worker_rlimit_nofile 1048576;
error_log stderr crit;

events {
    use epoll;
    worker_connections 65536;
    multi_accept on;
    accept_mutex off;
}

http {
    include /etc/nginx/mime.types;
    access_log off;
    server_tokens off;
    etag off;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    open_file_cache max=20000 inactive=10m;
    open_file_cache_valid 60s;
    open_file_cache_min_uses 1;
    keepalive_timeout 300s;
    keepalive_requests 100000000;

    server {
        listen 9003 reuseport backlog={{BACKLOG}};

        # Every /cache/ path is answered with the one file.
        location /cache/ {
            default_type text/plain;
            add_header Cache-Control "max-age=600";
            root /srv/www;
            try_files /backend/cache.txt =404;
        }
        location /edge/ {
            add_header Cache-Control "max-age=600";
            alias /srv/www/site/;
        }
    }

    server {
        listen 127.0.0.1:9004;
        location = /status {
            stub_status;
        }
    }
}
