# nginx for the fit benchmark harness. fitbench fills in {{WORKERS}}, one
# worker per CPU the server is pinned to, and the addresses of the proxy,
# WebSocket and cache backends.
#
# Port 8080 serves HTTP/1.1 and port 8081 h2c (HTTP/2 with prior knowledge);
# 8080 also proxies WebSockets at /ws. Port 8443 is HTTP/1.1 over TLS, port
# 8445 HTTP/2 over TLS and UDP port 8444 HTTP/3. Every port serves the
# locations in routes.conf.
#
# The settings every server shares are aligned (bench/README.md, "Aligned
# settings"): nothing here limits a run of the plan's top level in flight.
# fitbench fills in the {{...}} values (bench/README.md, "Deriving the
# plan"); on the benchmark host, for 10,000 in flight with 4 workers, the
# backend bound is 16,384, 4,096 of them idle a worker, and the backlog 2,048.
worker_processes {{WORKERS}};
worker_rlimit_nofile 1048576;
# Each listening socket queues {{BACKLOG}} connections not yet accepted, the
# host's somaxconn, as every server here does (nginx's default is 511).
error_log stderr error;

events {
    worker_connections {{WORKER_CONNECTIONS}};
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    access_log off;
    server_tokens off;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    # A client connection idle for 120s is closed, as every server here does.
    keepalive_timeout 120s;
    # No server here closes a client connection after a number of requests;
    # nginx's limit (1,000 by default, for HTTP/2 and HTTP/3 too) is set past
    # what any run reaches. At 1,000,000, a run of few connections reached it,
    # and the load generators, which do not reconnect, stopped early.
    keepalive_requests 1000000000;
    # Request bodies of up to 16 MiB, as fit allows; nginx's default is 1 MiB.
    client_max_body_size 16m;
    # Nothing is compressed, on the fly or precompressed, as with every
    # server here (both are nginx's defaults).
    gzip off;
    gzip_static off;
    # Static files: what nginx learns of a path, its open descriptor, size
    # and modification time, is kept for 10,000 paths (every file the
    # workloads ask for) and trusted for 1s, as fit's static handler trusts
    # what it learns for its check_interval of 1s; their bytes come from the
    # page cache, by sendfile, where fit keeps files of up to 1 MiB in memory
    # of its own, 64 MiB of them at most.
    open_file_cache max=10000 inactive=60s;
    open_file_cache_valid 1s;
    open_file_cache_min_uses 1;
    open_file_cache_errors on;

    # Proxied bodies: uploads stream to the backend, and responses are
    # buffered in memory and never written to temporary files, so that no
    # server's large transfers touch the disk.
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    # The client's Host, and who the client is, as every proxy here sends.
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_request_buffering off;
    proxy_max_temp_file_size 0;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;

    # HTTP/2 and HTTP/3: 250 streams a connection, and a stream receive
    # window of 1 MiB (nginx's default is 64 KiB), as the others have.
    http2_max_concurrent_streams 250;
    http2_body_preread_size 1m;
    http3_max_concurrent_streams 250;

    # At most {{BACKEND_CONNS}} backend connections, shared by the workers
    # through the zone, and as many kept idle in all:
    # {{BACKEND_IDLE_PER_WORKER}} for each of the {{WORKERS}} workers, since
    # nginx keeps them per worker; an idle one closed after
    # 60s. A failure does not take the only backend out of rotation
    # (max_fails=0), as no proxy here does.
    upstream backend {
        zone backend 1m;
        server {{BACKEND}} max_conns={{BACKEND_CONNS}} max_fails=0;
        keepalive {{BACKEND_IDLE_PER_WORKER}};
        keepalive_requests 1000000;
        keepalive_timeout 60s;
    }

    upstream wsbackend {
        server {{WSBACKEND}};
    }

    # The cache scenarios: up to 1 GiB of responses, as fit's cache keeps
    # in memory, here on disk and so in the page cache; enough for every
    # path the scenarios ask for (about 600 MB at most), since nginx's
    # max_size is enforced only by its cache manager, which at the
    # scenarios' rate lets the cache grow far past a smaller one. Keys for
    # about 128,000.
    proxy_cache_path /var/cache/nginx/fitbench levels=1:2 keys_zone=bench:16m max_size=1g inactive=1h use_temp_path=off;

    upstream cachebackend {
        zone cachebackend 1m;
        server {{CACHEBACKEND}} max_conns={{BACKEND_CONNS}} max_fails=0;
        keepalive {{BACKEND_IDLE_PER_WORKER}};
        keepalive_requests 1000000;
        keepalive_timeout 60s;
    }

    server {
        listen 8080 reuseport backlog={{BACKLOG}};
        include /etc/nginx/routes.conf;
        location = /ws {
            proxy_pass http://wsbackend;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 1h;
        }
    }

    server {
        listen 8081 reuseport backlog={{BACKLOG}};
        http2 on;
        include /etc/nginx/routes.conf;
    }

    # HTTP/1.1 over TLS on port 8443, HTTP/2 over TLS on 8445 and HTTP/3 on
    # UDP port 8444. A client on 8443 offers only http/1.1 by ALPN.
    server {
        listen 8443 ssl reuseport backlog={{BACKLOG}};
        listen 8445 ssl reuseport backlog={{BACKLOG}};
        http2 on;
        listen 8444 quic reuseport;
        http3 on;
        ssl_certificate /certs/cert.pem;
        ssl_certificate_key /certs/key.pem;
        ssl_protocols TLSv1.3;
        include /etc/nginx/routes.conf;
    }
}
