# nginx for the fit benchmark harness. fitbench fills in {{WORKERS}}, one
# worker per CPU the server is pinned to, and the addresses of the proxy and
# WebSocket backends.
#
# Port 8080 serves HTTP/1.1 and port 8081 h2c (HTTP/2 with prior knowledge),
# with the same three locations on both; 8080 also proxies WebSockets at /ws.
# Port 8443 is HTTP/1.1 over TLS, for idle TLS connections.
worker_processes {{WORKERS}};
worker_rlimit_nofile 1048576;
error_log stderr error;

events {
    worker_connections 65536;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    access_log off;
    server_tokens off;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 1000000;

    # Every proxy keeps up to 4096 idle connections to the backend, more than
    # the load generators have requests in flight, so none of them closes and
    # reopens upstream connections under load.
    upstream backend {
        server {{BACKEND}};
        keepalive 4096;
        keepalive_requests 1000000;
    }

    upstream wsbackend {
        server {{WSBACKEND}};
    }

    server {
        listen 8080 reuseport;

        location = /fixed {
            default_type text/plain;
            return 200 "hello, world";
        }
        location /static/ {
            root /srv/www;
        }
        location = /proxy {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }
        location = /ws {
            proxy_pass http://wsbackend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 1h;
        }
    }

    server {
        listen 8081 reuseport;
        http2 on;
        http2_max_concurrent_streams 256;
        keepalive_requests 1000000;

        location = /fixed {
            default_type text/plain;
            return 200 "hello, world";
        }
        location /static/ {
            root /srv/www;
        }
        location = /proxy {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }
    }

    server {
        listen 8443 ssl reuseport;
        ssl_certificate /certs/cert.pem;
        ssl_certificate_key /certs/key.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
    }
}
