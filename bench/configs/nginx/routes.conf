# The locations every port of nginx.conf serves.
location = /fixed {
    default_type text/plain;
    return 200 "hello, world";
}
location /static/ {
    root /srv/www;
}
# The website workload's files.
location /site/ {
    root /srv/www;
}
# The proxy scenario, the large download and upload, and the API workload.
location = /proxy {
    proxy_pass http://backend;
}
location /proxy/ {
    proxy_pass http://backend;
}
location /api/ {
    proxy_pass http://backend;
}
# The cache scenarios, and the website workload behind a cache.
location /cache/ {
    proxy_pass http://cachebackend;
    proxy_cache bench;
    proxy_cache_lock on;
}
location /edge/ {
    proxy_pass http://cachebackend;
    proxy_cache bench;
    proxy_cache_lock on;
}
