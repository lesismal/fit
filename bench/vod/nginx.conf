# nginx serving the library's files cut beforehand into HLS with ffmpeg
# (bench/vod/host.sh), the reference the vod handler is measured against: the
# segments are files, sent with sendfile, as a CDN origin of pre-cut HLS
# serves them. {{WORKERS}} is one worker a CPU the server is pinned to.
worker_processes {{WORKERS}};
worker_rlimit_nofile 1048576;
error_log stderr error;

events {
    worker_connections 65536;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    types {
        application/vnd.apple.mpegurl m3u8;
        video/mp4 m4s;
    }
    access_log off;
    server_tokens off;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 120s;
    keepalive_requests 1000000000;
    open_file_cache max=10000 inactive=60s;

    server {
        listen 18090 reuseport backlog=4096;
        location / {
            root /srv/cut;
        }
    }
}
