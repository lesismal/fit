worker_processes 8;
worker_cpu_affinity auto;
worker_rlimit_nofile 1000000;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;
events { worker_connections 65535; multi_accept on; }
http {
    access_log off;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 120s;
    keepalive_requests 100000000;
    open_file_cache max=16384 inactive=20s;
    open_file_cache_valid 1s;
    open_file_cache_errors on;
    default_type application/octet-stream;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    server { listen 8082 reuseport backlog=65535; root /mnt/fitrand; }
    server { listen 8080 reuseport backlog=65535; http2 on; root /mnt/fitrand; }
    server {
        listen 8443 ssl reuseport backlog=65535;
        ssl_certificate /certs/cert.pem;
        ssl_certificate_key /certs/key.pem;
        root /mnt/fitrand;
    }
}
