admin { address 127.0.0.1:9015 }
limits { max_conns 1000000 }
engine { backlog 65535 }
def certs { tls /root/sbench/certs/cert.pem /root/sbench/certs/key.pem }
listener h1 :8082 http/1.1
listener h2c :8080 h2c
listener tls :8443 http/1.1 { use certs }
route files { match { path /* }; handler static { root /mnt/fitrand; default_type application/octet-stream; disk_io inline } }
