admin { address 127.0.0.1:9015 }
limits { max_conns 1000000 }
engine { backlog 65535 }
def pool {
	max_conns 1024
	max_pending 1024
	max_idle_conns 1024
	idle_timeout 60s
	connect_timeout 5s
	max_fails 0
}
upstream backend 127.0.0.1:9090 { use pool }
listener h1 :8082 http/1.1
route files { match { path /f/* }; handler static { root /mnt/fitrand; strip_prefix /f } }
route proxy { match { path /* }; handler proxy { upstream backend; timeout 60s } }
