<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>fit tunnel node</title>
<link rel="stylesheet" href="/static/base.css">
<script src="/static/theme.js"></script>
<script src="/static/workbench.js"></script>
<script src="/static/i18n.js"></script>
</head>
<body>
<header><h1>tunnel node <span id="name"></span></h1><span id="meta"></span></header>
<main>
<section data-view="hubs" data-icon="hub"><h2>Hubs<button class="h2btn primary" data-click="editHub" data-args="[null]">Add hub</button></h2><div id="hubs"></div></section>
<section data-view="services" data-icon="node"><h2>Services this node reaches</h2>
<table><thead><tr><th>Name</th><th>Address (host:port)</th><th>Description</th><th>Connect</th><th></th></tr></thead><tbody id="services"></tbody></table>
<form class="inline" data-submit="saveServices"><button type="button" data-click="addService">Add service</button><button type="button" data-click="loadServices">Revert</button><button class="primary">Save and tell hubs</button></form></section>
<section data-view="tunnels" data-icon="tunnel"><h2>Tunnels<button class="h2btn" data-click="openFlow">Details</button></h2><div id="tunnels"></div></section>
</main>
<div id="msg"></div>
<script src="/static/base.js"></script>
<script src="/static/flow.js"></script>
<script src="/static/config.js"></script>
<script src="/node.js"></script>
</body>
</html>
