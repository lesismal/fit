# A fixed response on port 8080, and 404 for any other path.
# Try it: curl http://127.0.0.1:8080/hello
listeners:
  - name: web
    address: :8080
    protocols:
      - http/1.1
      - h2c
routes:
  - name: hello
    match:
      path:
        - /hello
    handler:
      module: respond
      params:
        body: |
          hello from fit
  - name: not-found
    priority: -1
    handler:
      module: respond
      params:
        status: 404
        body: |
          not found
