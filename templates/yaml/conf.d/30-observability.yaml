# fit's config template as a directory: every field of the config and of every module's
# params, in files by kind. Generated by schema.TemplateDir; regenerate with:
# go test ./schema -update
#
# fit run -c <this directory> reads every file in it, its subdirectories too, in lexical
# order. listeners, routes, upstreams, services and providers are joined across the files;
# any other field is written in one file only. What is written out runs as it is: a
# listener on :8080, example.com answering "hello from fit", and api.example.com proxied
# to 127.0.0.1:9000. Every other field is commented out, with its default or an example:
# uncomment what you need. docs/reference/config.md describes them all.
#
# This file:
# What fit tells about itself: its own log, the access log, OpenTelemetry, request
# metrics, and the Admin API.

# fit's own log: what it says about starting, reloading, certificates, providers and the
# engine, by logger, each with the least level written, and the format and output it writes
# in, as fib writes its own. Messages at info and debug to stdout and the rest to stderr, at
# info and above, as lines, when left out.
# object.
# log:
  # # The least level written, of every logger levels and loggers do not set one for: debug, info,
  # # warn or error. info when left out. A change takes effect on reload.
  # # one of: debug, info, warn, error; default "info".
  # level: "info"

  # # The least level of some loggers, by name, over level: server (listeners, loading and
  # # reloading configs, shutting down), admin (the Admin API), tls (certificates: ACME, OCSP,
  # # certificate files), provider (providers), telemetry (exporting over OTLP), access_log (the
  # # access log's dropped lines), plugin (wasm plugins), fastcgi (what FastCGI applications write
  # # to their stderr), llm and tunnel (their roles), webrtc (the TURN server) and engine (fib,
  # # the network engine, and whatever else writes to Go's log and log/slog). The same as loggers'
  # # level, which a logger may not have both of. A change takes effect on reload.
  # # object of string.
  # levels: {"tls": "debug", "engine": "warn"}

  # # "stdout", "stderr", or the path of a file messages are appended to, of every logger loggers
  # # does not set one for. When left out, debug and info messages go to stdout and warn and error
  # # ones to stderr. A change takes a restart.
  # # string.
  # output: "/var/log/fit/fit.log"

  # # How messages are written, those of every logger loggers does not set one for, as fib writes
  # # its own: line, the time, level and message, then the attributes as key=value; text, every
  # # part as key=value (logfmt); or json, a JSON object a line. Each carries the logger's name as
  # # logger. line when left out. A change takes a restart.
  # # one of: line, text, json; default "line".
  # format: "line"

  # # The zone the time of every line is written in, and the zone a file's interval is rotated at:
  # # local (the default), utc, or an IANA zone name such as Asia/Shanghai. So 24h turns at local
  # # midnight by default, and at UTC midnight with utc. The zone database is embedded, so an IANA
  # # name works in a container without zoneinfo. A change takes effect on reload.
  # # string.
  # time_zone: ""

  # # Rotate the file log.output names, and remove old rotated files: the size and interval a file
  # # is rotated at, and the age, count and total size past which rotated files are removed. None
  # # when left out: the file grows without bound, as before.
  # # object.
  # rotate:
    # # How large a file may grow before it is rotated: a write that would take it past this starts
    # # a new file. 1 GiB when left out; 0 does not rotate by size.
    # # integer, 0 or more; default 1073741824.
    # max_bytes: 1073741824

    # # How long a file is written before it is rotated, at the next period boundary of the log's
    # # time_zone: 24h turns at midnight, 1h on the hour; a fraction of a second, or a period over
    # # 24h that is not a whole number of days, is refused. Off when left out.
    # # duration, as "1.5s" or "2m".
    # interval: "10s"

    # # How long a rotated file is kept after it was last written: 720h (30 days) when left out; 0
    # # keeps it until a count or size limit removes it.
    # # duration, as "1.5s" or "2m"; default "720h".
    # max_age: "720h"

    # # The most rotated files kept, newest first; 0 or left out has no count limit.
    # # integer, 0 or more.
    # max_files: 0

    # # The most the rotated files may total, the oldest removed until they fit. 1 GiB when left
    # # out; 0 does not limit the total.
    # # integer, 0 or more; default 1073741824.
    # max_total_bytes: 1073741824

    # # Gzip a file when it is rotated. On when left out.
    # # boolean; default true.
    # compress: true

  # # Settings of some loggers of their own, by name (those levels lists), over level, output,
  # # format and rotate: engine's to a file of its own, say, or access_log's as json.
  # # object of object.
  # loggers: {"engine": {"output": "/var/log/fit/engine.log", "format": "json"}}

# Where a line is written for each request, as JSON or, as its format says, text or line; no
# access log when left out.
# object.
# access_log:
  # # "stdout", "stderr", or the path of a file lines are appended to; "stdout" when left out.
  # # string; default "stdout".
  # output: "/var/log/fit/access.log"

  # # How long a line may wait in the buffer before it is written; 1s when left out.
  # # duration, as "1.5s" or "2m"; default "1s".
  # flush_interval: "1s"

  # # How many bytes of lines may wait to be written; lines past it are dropped. 4 MiB when left
  # # out.
  # # integer, 0 or more; default 4194304.
  # buffer_bytes: 4194304

  # # The least level of the requests written: a response with a status below 400 is info, a 4xx
  # # warn and a 5xx error, so warn writes the requests answered with 4xx and 5xx, and error those
  # # answered with 5xx. Every request when left out. A change takes effect on reload.
  # # one of: info, warn, error; default "info".
  # level: "info"

  # # How a request's line is written, with the same fields whichever: json, a JSON object; text,
  # # time, level, msg and the fields as key=value (logfmt); or line, the time and level, then the
  # # fields as key=value, as fit's own log writes lines. A request's level is its status's, as
  # # level says. json when left out. A change takes a restart.
  # # one of: json, text, line; default "json".
  # format: "json"

  # # The zone a line's time is written in, and the zone a file's interval is rotated at: local
  # # (the default), utc, or an IANA zone name such as Asia/Shanghai. json and text wrote UTC and
  # # line local before this setting; now every format writes this zone, local when left out, and
  # # 24h turns at local midnight. A change takes effect on reload.
  # # string.
  # time_zone: ""

  # # Rotate the file output names, and remove old rotated files: the size and interval a file is
  # # rotated at, and the age, count and total size past which rotated files are removed. None
  # # when left out: the file grows without bound, as before.
  # # object.
  # rotate:
    # # How large a file may grow before it is rotated: a write that would take it past this starts
    # # a new file. 1 GiB when left out; 0 does not rotate by size.
    # # integer, 0 or more; default 1073741824.
    # max_bytes: 1073741824

    # # How long a file is written before it is rotated, at the next period boundary of the log's
    # # time_zone: 24h turns at midnight, 1h on the hour; a fraction of a second, or a period over
    # # 24h that is not a whole number of days, is refused. Off when left out.
    # # duration, as "1.5s" or "2m".
    # interval: "10s"

    # # How long a rotated file is kept after it was last written: 720h (30 days) when left out; 0
    # # keeps it until a count or size limit removes it.
    # # duration, as "1.5s" or "2m"; default "720h".
    # max_age: "720h"

    # # The most rotated files kept, newest first; 0 or left out has no count limit.
    # # integer, 0 or more.
    # max_files: 0

    # # The most the rotated files may total, the oldest removed until they fit. 1 GiB when left
    # # out; 0 does not limit the total.
    # # integer, 0 or more; default 1073741824.
    # max_total_bytes: 1073741824

    # # Gzip a file when it is rotated. On when left out.
    # # boolean; default true.
    # compress: true

# OpenTelemetry: traces of requests, with W3C trace context sent on to upstreams, and metrics,
# exported over OTLP/HTTP to a collector. Neither when left out. Read when fit starts: a
# change takes effect when fit restarts.
# object.
# telemetry:
  # # The OTLP/HTTP receiver: http:// or https:// and a host and port, as of an OpenTelemetry
  # # Collector; traces go to its /v1/traces and metrics to /v1/metrics, as JSON.
  # # http://127.0.0.1:4318 when left out.
  # # string; default "http://127.0.0.1:4318".
  # endpoint: "http://127.0.0.1:4318"

  # # A file of header fields sent with each export, one "Name: value" a line, as an API key a
  # # receiver asks for; read when fit starts. None when left out.
  # # string.
  # headers_file: "/etc/fit/otlp-headers"

  # # A PEM file with the CAs the receiver's certificate is verified with, over https; the
  # # system's when left out.
  # # string.
  # ca_file: "/etc/fit/ca.pem"

  # # A PEM file with the client certificate sent over https; with key_file.
  # # string.
  # cert_file: "/etc/fit/example.com.pem"

  # # A PEM file with cert_file's private key.
  # # string.
  # key_file: "/etc/fit/example.com.key"

  # # The service.name of the resource traces and metrics are about. fit when left out.
  # # string; default "fit".
  # service_name: "fit"

  # # How long an export may take, connecting included; a batch not sent by then is dropped and
  # # counted. 10s when left out.
  # # duration, as "1.5s" or "2m"; default "10s".
  # timeout: "10s"

  # # Trace requests: a server span for each one sampled, and its context sent on to upstreams in
  # # traceparent. No traces when left out.
  # # object.
  # traces:
    # # The share of requests traced among those whose caller did not decide: from 0 to 1. A request
    # # whose traceparent says its caller sampled it is always traced, and one that says it did not
    # # is never. 0, only those a caller sampled, when left out.
    # # number, 0 to 1.
    # sample_ratio: 0.1

    # # The most bytes of spans waiting to be exported, besides the batch being sent; spans past it
    # # are dropped and counted. 4 MiB when left out or 0.
    # # integer, 0 or more; default 4194304.
    # max_queue_bytes: 4194304

    # # How often spans are exported, and sooner when 256 KiB of them wait. 5s when left out.
    # # duration, as "1.5s" or "2m"; default "5s".
    # interval: "5s"

  # # Export the metrics the Admin API's /metrics serves, requests counted included, every
  # # interval. No metrics over OTLP when left out.
  # # object.
  # metrics:
    # # How often the metrics are exported. 30s when left out.
    # # duration, as "1.5s" or "2m"; default "30s".
    # interval: "30s"

# The Admin API, through which the running config is read and replaced, and which serves
# metrics in Prometheus's text format at /metrics; off when left out. Its settings are read
# when fit starts: a change to them takes effect when fit restarts.
# object.
# admin:
  # # Where the Admin API listens: a host and port, or "unix/" and the path of a Unix socket, as
  # # in "unix//run/fit/admin.sock". A host that is not a loopback address or localhost needs
  # # token_file, cert_file and key_file, so that only holders of the token reach the API and the
  # # token never crosses a network in the clear. 127.0.0.1:2019 when left out.
  # # string; default "127.0.0.1:2019".
  # address: "127.0.0.1:2019"

  # # Listen the Admin API with Multipath TCP where the kernel offers it (Linux 5.6+,
  # # net.mptcp.enabled), falling back to plain TCP where it does not. Off by default; a Unix
  # # socket has no paths.
  # # boolean.
  # mptcp: true

  # # A file holding a token that every request must carry, as "Authorization: Bearer <token>"; no
  # # token is asked for when left out.
  # # string.
  # token_file: "/etc/fit/token"

  # # A PEM file with the Admin API's certificate, followed by any intermediates; with key_file,
  # # the API is served over TLS, 1.2 or later. The files are read again when they change, so that
  # # a renewed certificate is served without a restart. Not for a Unix socket.
  # # string.
  # cert_file: "/etc/fit/example.com.pem"

  # # A PEM file with the certificate's private key.
  # # string.
  # key_file: "/etc/fit/example.com.key"

  # # A PEM file with the CAs that clients' certificates must chain to: with it, every client must
  # # present a valid certificate, besides the token, before it is heard. Needs cert_file and
  # # key_file; read again when it changes, as they are.
  # # string.
  # client_ca_file: ""

  # # How many of the configs applied, the running one included, are kept to be read back. 10 when
  # # left out or 0.
  # # integer, 0 or more; default 10.
  # history: 10

  # # The largest config the Admin API takes; a larger one gets 413. 4 MiB when left out or 0.
  # # integer, 0 or more; default 4194304.
  # max_config_bytes: 4194304

  # # The most connections the Admin API keeps open at once, a quarter of them kept for those that
  # # have made a request with the token (any request, without token_file). When they are taken, a
  # # new connection closes the oldest of those that have not, of the client holding the most, and
  # # is closed as it is accepted only when every one has; one past a client's share, a quarter of
  # # them, is closed too, but for loopback clients. A connection that has not is closed 5s after
  # # it is accepted, whatever it is doing. 16 when left out or 0.
  # # integer, 0 or more; default 16.
  # max_conns: 16

  # # Do not serve the dashboard, the read-only web pages at /dashboard/ that show the routes,
  # # services, upstreams and their health, certificates and config versions from the Admin API's
  # # GET endpoints; served when left out or false.
  # # boolean.
  # disable_dashboard: true

  # # Keep the config encrypted in a file of its own, the store, which is the base config fit runs
  # # from then on: every config applied is written to it, and what this file sets beside admin is
  # # only the store's first content, used when the store does not exist yet. Left out, the config
  # # lives in this file.
  # # object.
  # store:
    # # The store's file, made 0600 when it is written. fit stops at start if it exists and does not
    # # open with the password.
    # # string; required.
    # path: "/var/lib/fit/fit.store"

    # # The password the store is encrypted with. Written here, it protects a store copied away from
    # # this file, not one read beside it; password_file or password_env keep it out of the file.
    # # string.
    # password: ""

    # # A file holding the password, its surrounding spaces trimmed.
    # # string.
    # password_file: "/etc/fit/store-password"

    # # An environment variable holding the password.
    # # string.
    # password_env: "FIT_STORE_PASSWORD"

  # # Serve the console, web pages behind a user name and password from which the whole config,
  # # admin aside, is read and changed; off when left out.
  # # object.
  # console:
    # # The host and port the console listens on. A host that is not a loopback address needs
    # # cert_file and key_file, so that passwords never cross a network in the clear. 127.0.0.1:2020
    # # when left out.
    # # string; default "127.0.0.1:2020".
    # address: "127.0.0.1:2020"

    # # Listen the console with Multipath TCP where the kernel offers it (Linux 5.6+,
    # # net.mptcp.enabled), falling back to plain TCP where it does not. Off by default.
    # # boolean.
    # mptcp: true

    # # A PEM file with the console's certificate, followed by any intermediates; with key_file, the
    # # console is served over TLS.
    # # string.
    # cert_file: "/etc/fit/example.com.pem"

    # # A PEM file with the certificate's private key.
    # # string.
    # key_file: "/etc/fit/example.com.key"

    # # Who may log in: at least one user.
    # # list of object; required.
    # users:
      # -
        # # The user's name.
        # # string; required.
        # username: "admin"

        # # The bcrypt hash of the user's password, as fit hash-password makes it.
        # # string; required.
        # password_hash: "$2a$14$Zkx19XLiW6VYouLHR5NmfOFU0z2GTNmpkT/5qqR7hx4IjWJPDhjvG"

    # # How long a login lasts without a request. 30m when left out.
    # # duration, as "1.5s" or "2m"; default "30m".
    # session_timeout: "30m"

    # # How long a login lasts at most, however busy. 12h when left out.
    # # duration, as "1.5s" or "2m"; default "12h".
    # session_lifetime: "12h"

    # # The most logins kept at once; one more ends the oldest. 64 when left out or 0.
    # # integer, 0 or more; default 64.
    # max_sessions: 64

    # # The most connections the console keeps open at once, a quarter of them kept for those with a
    # # login. When they are taken, a new connection closes the oldest of those without one, of the
    # # client holding the most, and is closed as it is accepted only when every one has a login;
    # # one past a client's share, a quarter of them, is closed too, but for loopback clients. 32
    # # when left out or 0.
    # # integer, 0 or more; default 32.
    # max_conns: 32

# Count and time requests by listener and route, for the Admin API's /metrics, which serves
# the rest of fit's metrics without it; off when left out, since it costs every request a
# little. Needs admin.
# object.
# metrics:
