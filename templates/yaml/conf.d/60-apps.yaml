# fit's config template as a directory: every field of the config and of every module's
# params, in files by kind. Generated by schema.TemplateDir; regenerate with:
# go test ./schema -update
#
# fit run -c <this directory> reads every file in it, its subdirectories too, in lexical
# order. listeners, routes, upstreams, services and providers are joined across the files;
# any other field is written in one file only. What is written out runs as it is: a
# listener on :8080, example.com answering "hello from fit", and api.example.com proxied
# to 127.0.0.1:9000. Every other field is commented out, with its default or an example:
# uncomment what you need. docs/reference/config.md describes them all.
#
# This file:
# The roles run beside the gateway on its engine: the LLM feature's and the tunnel's, AI
# models shared among machines and services behind NAT reached through a server,
# WebRTC's TURN server and media server, and the media_auth policies of who may publish
# and play which streams.

# The LLM feature's roles to run beside the gateway, on its engine: a hub, a node and a proxy,
# which share AI models among machines and serve them to agents. None when left out. What
# their web pages change is written back here.
# object.
# llm:
  # # Run a hub: nodes and proxies link to it, and it passes calls between them.
  # # object.
  # hub:
    # # The hub's stable ID, which its peers know it by. Made when left out, and written back here.
    # # string.
    # id: ""

    # # The name the hub shows its peers; the host's name when left out. Its pages change it.
    # # string.
    # name: ""

    # # The hub's web pages; none when left out.
    # # object.
    # console:
      # # The host and port the pages listen on. A host that is not a loopback address needs cert_file
      # # and key_file, so that passwords never cross a network in the clear.
      # # string; required.
      # address: "127.0.0.1:9000"

      # # A PEM file with the pages' certificate, followed by any intermediates; with key_file, the
      # # pages are served over TLS.
      # # string.
      # cert_file: "/etc/fit/example.com.pem"

      # # A PEM file with the certificate's private key.
      # # string.
      # key_file: "/etc/fit/example.com.key"

      # # Who may log in: at least one user.
      # # list of object; required.
      # users:
        # -
          # # The user's name.
          # # string; required.
          # username: "fit"

          # # The bcrypt hash of the user's password, as fit hash-password makes it.
          # # string; required.
          # password_hash: "$2a$14$Zkx19XLiW6VYouLHR5NmfOFU0z2GTNmpkT/5qqR7hx4IjWJPDhjvG"

      # # How long a login lasts without a request. 30m when left out.
      # # duration, as "1.5s" or "2m"; default "30m".
      # session_timeout: "30m"

      # # How long a login lasts at most, however busy. 12h when left out.
      # # duration, as "1.5s" or "2m"; default "12h".
      # session_lifetime: "12h"

      # # The most logins kept at once; one more ends the oldest. 64 when left out or 0.
      # # integer, 0 or more; default 64.
      # max_sessions: 64

      # # The most connections the pages keep open at once; one past it is closed as soon as it is
      # # accepted. 32 when left out or 0.
      # # integer, 0 or more; default 32.
      # max_conns: 32

    # # Where the hub takes links from nodes and proxies; none when left out. Its pages change it.
    # # object.
    # listen:
      # # The host and port the role takes links on, as a binding of its own on the listeners' engine;
      # # the WebSocket path is /ws. An empty host listens on every address.
      # # string; required.
      # address: "127.0.0.1:9000"

      # # The password peers prove they know when they link; it never crosses the network.
      # # string; required.
      # password: ""

    # # The nodes and proxies the hub dials. Its pages change them.
    # # list of object.
    # peers:
      # -
        # # The peer's host and port, as its listen.address says.
        # # string; required.
        # address: "127.0.0.1:9000"

        # # The peer's listen.password.
        # # string; required.
        # password: ""

        # # The role the peer must announce; a link to a peer of another role is refused. Never the
        # # dialing role's own.
        # # one of: hub, node, proxy; required.
        # role: "hub"

    # # Bounds on the hub's links; the defaults when left out.
    # # object.
    # limits:
      # # The most links the role takes from its peers at once; one past it is refused, and its dialer
      # # backs off. 1024 when left out or 0.
      # # integer, 0 or more; default 1024.
      # max_conns: 1024

      # # The most calls and streams a peer may have running here on one link at once; one past it
      # # fails at once. 1024 when left out or 0.
      # # integer, 0 or more; default 1024.
      # max_inflight: 1024

      # # How long a link may hear nothing before it is pinged; one that hears nothing for three of
      # # them is closed. 15s when left out.
      # # duration, as "1.5s" or "2m"; default "15s".
      # ping_interval: "15s"

      # # How long a ping may wait for its pong, behind everything sent before it, before the link is
      # # taken for too slow and closed. 30s when left out.
      # # duration, as "1.5s" or "2m"; default "30s".
      # slow_timeout: "30s"

      # # The most a dialer waits between attempts at a peer it cannot reach; the waits grow to it, at
      # # random within each step. 5s when left out.
      # # duration, as "1.5s" or "2m"; default "5s".
      # retry_interval: "5s"

      # # How long a stream, as a model call relayed between roles, may carry nothing either way
      # # before it ends. 2m when left out.
      # # duration, as "1.5s" or "2m"; default "2m".
      # stream_idle: "2m"

    # # The most nodes the hub keeps in its table, offline ones included; past it the offline node
    # # seen longest ago is forgotten; online nodes are bounded by limits.max_conns and the hub's
    # # peers. 1024 when left out or 0.
    # # integer, 0 or more; default 1024.
    # max_nodes: 1024

  # # Run a node: it serves models from local or remote upstreams to the hubs and proxies linked
  # # to it.
  # # object.
  # node:
    # # The node's stable ID, which its peers know it by. Made when left out, and written back here.
    # # string.
    # id: ""

    # # The name the node shows its peers; the host's name when left out. Its pages, and a hub that
    # # settings.allow_hub_manage lets, change it.
    # # string.
    # name: ""

    # # A note about the node its peers show. Its pages, and a hub that settings.allow_hub_manage
    # # lets, change it.
    # # string.
    # description: ""

    # # The node's web pages; none when left out.
    # # object.
    # console:
      # # The host and port the pages listen on. A host that is not a loopback address needs cert_file
      # # and key_file, so that passwords never cross a network in the clear.
      # # string; required.
      # address: "127.0.0.1:9000"

      # # A PEM file with the pages' certificate, followed by any intermediates; with key_file, the
      # # pages are served over TLS.
      # # string.
      # cert_file: "/etc/fit/example.com.pem"

      # # A PEM file with the certificate's private key.
      # # string.
      # key_file: "/etc/fit/example.com.key"

      # # Who may log in: at least one user.
      # # list of object; required.
      # users:
        # -
          # # The user's name.
          # # string; required.
          # username: "fit"

          # # The bcrypt hash of the user's password, as fit hash-password makes it.
          # # string; required.
          # password_hash: "$2a$14$Zkx19XLiW6VYouLHR5NmfOFU0z2GTNmpkT/5qqR7hx4IjWJPDhjvG"

      # # How long a login lasts without a request. 30m when left out.
      # # duration, as "1.5s" or "2m"; default "30m".
      # session_timeout: "30m"

      # # How long a login lasts at most, however busy. 12h when left out.
      # # duration, as "1.5s" or "2m"; default "12h".
      # session_lifetime: "12h"

      # # The most logins kept at once; one more ends the oldest. 64 when left out or 0.
      # # integer, 0 or more; default 64.
      # max_sessions: 64

      # # The most connections the pages keep open at once; one past it is closed as soon as it is
      # # accepted. 32 when left out or 0.
      # # integer, 0 or more; default 32.
      # max_conns: 32

    # # Where the node takes links from hubs and proxies; none when left out. Its pages change it.
    # # object.
    # listen:
      # # The host and port the role takes links on, as a binding of its own on the listeners' engine;
      # # the WebSocket path is /ws. An empty host listens on every address.
      # # string; required.
      # address: "127.0.0.1:9000"

      # # The password peers prove they know when they link; it never crosses the network.
      # # string; required.
      # password: ""

    # # The hubs and proxies the node dials. Its pages change them.
    # # list of object.
    # peers:
      # -
        # # The peer's host and port, as its listen.address says.
        # # string; required.
        # address: "127.0.0.1:9000"

        # # The peer's listen.password.
        # # string; required.
        # password: ""

        # # The role the peer must announce; a link to a peer of another role is refused. Never the
        # # dialing role's own.
        # # one of: hub, node, proxy; required.
        # role: "hub"

    # # Bounds on the node's links; the defaults when left out.
    # # object.
    # limits:
      # # The most links the role takes from its peers at once; one past it is refused, and its dialer
      # # backs off. 1024 when left out or 0.
      # # integer, 0 or more; default 1024.
      # max_conns: 1024

      # # The most calls and streams a peer may have running here on one link at once; one past it
      # # fails at once. 1024 when left out or 0.
      # # integer, 0 or more; default 1024.
      # max_inflight: 1024

      # # How long a link may hear nothing before it is pinged; one that hears nothing for three of
      # # them is closed. 15s when left out.
      # # duration, as "1.5s" or "2m"; default "15s".
      # ping_interval: "15s"

      # # How long a ping may wait for its pong, behind everything sent before it, before the link is
      # # taken for too slow and closed. 30s when left out.
      # # duration, as "1.5s" or "2m"; default "30s".
      # slow_timeout: "30s"

      # # The most a dialer waits between attempts at a peer it cannot reach; the waits grow to it, at
      # # random within each step. 5s when left out.
      # # duration, as "1.5s" or "2m"; default "5s".
      # retry_interval: "5s"

      # # How long a stream, as a model call relayed between roles, may carry nothing either way
      # # before it ends. 2m when left out.
      # # duration, as "1.5s" or "2m"; default "2m".
      # stream_idle: "2m"

    # # The models the node serves: each an upstream API endpoint. Its pages, and a hub that
    # # settings.allow_hub_manage lets, change them.
    # # list of object.
    # models:
      # -
        # # The name agents ask for the model by: 1 to 128 characters, no spaces. A name is unique among
        # # a node's models of one agent API: an azure_openai model shares openai's.
        # # string; required.
        # name: ""

        # # The API the upstream speaks: openai (OpenAI and every OpenAI-compatible server, as DeepSeek,
        # # Qwen, Mistral, Groq, xAI, OpenRouter, vLLM, llama.cpp), anthropic, gemini (Google's Gemini
        # # API), azure_openai (Azure OpenAI deployments, which agents call as openai), ollama (Ollama's
        # # own API) or cohere (Cohere's v2 API). It sets the agent endpoints the model is reached
        # # through, the upstream URL and the auth header.
        # # one of: openai, anthropic, gemini, azure_openai, ollama, cohere; required.
        # api: "openai"

        # # The upstream's base URL, http or https, without a query or a trailing slash. openai,
        # # anthropic and cohere calls go to it with their path appended, as base_url/chat/completions
        # # with http://127.0.0.1:8000/v1; gemini's to base_url/models/{upstream}:{method}, with
        # # https://generativelanguage.googleapis.com/v1beta; azure_openai's to
        # # base_url/openai/deployments/{upstream}/{path}, with https://{resource}.openai.azure.com;
        # # ollama's to base_url/api/chat, with http://127.0.0.1:11434.
        # # string; required.
        # base_url: ""

        # # The model ID sent upstream in place of name: in the body's model, a form's model field,
        # # Gemini's path, or as an azure_openai model's deployment. name when left out.
        # # string.
        # upstream: "app"

        # # The key sent upstream: as Authorization: Bearer for openai, ollama and cohere, as x-api-key
        # # for anthropic, x-goog-api-key for gemini, api-key for azure_openai. None when left out. The
        # # pages never show it whole.
        # # string.
        # api_key: ""

        # # The api-version query every call of an azure_openai model carries, as 2024-10-21: required
        # # for azure_openai, and only taken there.
        # # string.
        # api_version: ""

        # # Keep the model without serving it.
        # # boolean.
        # disabled: true

        # # A note about the model its peers show.
        # # string.
        # description: ""

        # # The most calls to the model the node forwards at once; a call past it goes to another node.
        # # No bound but proxy.max_inflight's when left out or 0.
        # # integer, 0 to 100000.
        # max_inflight: 0

    # # The node's own settings; the defaults when left out. Only its own pages change them.
    # # object.
    # settings:
      # # Let linked hubs manage the node: edit its models, change GPU settings, run its fixed actions
      # # and follow their jobs. Never its own settings, and never a command of their own. Off when
      # # left out.
      # # boolean.
      # allow_hub_manage: true

      # # Run GPU settings, tool installs and actions that need root with sudo -n when fit does not
      # # run as root; sudo must not ask for a password. On when left out.
      # # boolean; default true.
      # gpu_sudo: true

      # # How often the node reads its hardware again, 5s to 1h. 30s when left out.
      # # duration, as "1.5s" or "2m"; default "30s".
      # refresh_interval: "30s"

      # # How long a job, an action or an install, may run before it is killed, 10s to 168h. 1h when
      # # left out.
      # # duration, as "1.5s" or "2m"; default "1h".
      # job_timeout: "1h"

      # # A directory the install scripts of vendors whose drivers are downloaded by hand look for the
      # # packages in, under the vendor's name; the working directory when left out.
      # # string.
      # gpu_data_dir: ""

    # # Bounds on the calls the node forwards to its models' upstreams; the defaults when left out.
    # # object.
    # proxy:
      # # How long a connection to an upstream may take. 10s when left out.
      # # duration, as "1.5s" or "2m"; default "10s".
      # connect_timeout: "10s"

      # # How long an upstream may take to begin its response, from when the call starts, its connect
      # # included, as a model reading a long prompt does. 5m when left out.
      # # duration, as "1.5s" or "2m"; default "5m".
      # first_byte_timeout: "5m"

      # # How long an upstream may go silent in the middle of its response before the call is cut
      # # short. 5m when left out.
      # # duration, as "1.5s" or "2m"; default "5m".
      # idle_timeout: "5m"

      # # The most one call may take, from its start to the end of its response. 30m when left out.
      # # duration, as "1.5s" or "2m"; default "30m".
      # timeout: "30m"

      # # The most calls the node forwards at once, across its models; a call past it goes to another
      # # node. 256 when left out or 0.
      # # integer, 0 or more; default 256.
      # max_inflight: 256

      # # The largest request body a call may carry; one past it fails. A body is held whole only when
      # # the model's upstream differs from the name the call gives and the model is named in the body
      # # (its JSON model, or a form's model field), to set it. 32 MiB when left out or 0.
      # # integer, 0 or more; default 33554432.
      # max_body_bytes: 33554432

  # # Run a proxy: an OpenAI- and Anthropic-compatible API, for agents, that calls the models of
  # # the nodes it reaches.
  # # object.
  # proxy:
    # # The proxy's stable ID, which its peers know it by. Made when left out, and written back
    # # here.
    # # string.
    # id: ""

    # # The name the proxy shows its peers; the host's name when left out. Its pages change it.
    # # string.
    # name: ""

    # # The proxy's web pages; none when left out.
    # # object.
    # console:
      # # The host and port the pages listen on. A host that is not a loopback address needs cert_file
      # # and key_file, so that passwords never cross a network in the clear.
      # # string; required.
      # address: "127.0.0.1:9000"

      # # A PEM file with the pages' certificate, followed by any intermediates; with key_file, the
      # # pages are served over TLS.
      # # string.
      # cert_file: "/etc/fit/example.com.pem"

      # # A PEM file with the certificate's private key.
      # # string.
      # key_file: "/etc/fit/example.com.key"

      # # Who may log in: at least one user.
      # # list of object; required.
      # users:
        # -
          # # The user's name.
          # # string; required.
          # username: "fit"

          # # The bcrypt hash of the user's password, as fit hash-password makes it.
          # # string; required.
          # password_hash: "$2a$14$Zkx19XLiW6VYouLHR5NmfOFU0z2GTNmpkT/5qqR7hx4IjWJPDhjvG"

      # # How long a login lasts without a request. 30m when left out.
      # # duration, as "1.5s" or "2m"; default "30m".
      # session_timeout: "30m"

      # # How long a login lasts at most, however busy. 12h when left out.
      # # duration, as "1.5s" or "2m"; default "12h".
      # session_lifetime: "12h"

      # # The most logins kept at once; one more ends the oldest. 64 when left out or 0.
      # # integer, 0 or more; default 64.
      # max_sessions: 64

      # # The most connections the pages keep open at once; one past it is closed as soon as it is
      # # accepted. 32 when left out or 0.
      # # integer, 0 or more; default 32.
      # max_conns: 32

    # # Where the proxy takes links from hubs and nodes; none when left out. Its pages change it.
    # # object.
    # listen:
      # # The host and port the role takes links on, as a binding of its own on the listeners' engine;
      # # the WebSocket path is /ws. An empty host listens on every address.
      # # string; required.
      # address: "127.0.0.1:9000"

      # # The password peers prove they know when they link; it never crosses the network.
      # # string; required.
      # password: ""

    # # The hubs and nodes the proxy dials. Its pages change them.
    # # list of object.
    # peers:
      # -
        # # The peer's host and port, as its listen.address says.
        # # string; required.
        # address: "127.0.0.1:9000"

        # # The peer's listen.password.
        # # string; required.
        # password: ""

        # # The role the peer must announce; a link to a peer of another role is refused. Never the
        # # dialing role's own.
        # # one of: hub, node, proxy; required.
        # role: "hub"

    # # Bounds on the proxy's links; the defaults when left out.
    # # object.
    # limits:
      # # The most links the role takes from its peers at once; one past it is refused, and its dialer
      # # backs off. 1024 when left out or 0.
      # # integer, 0 or more; default 1024.
      # max_conns: 1024

      # # The most calls and streams a peer may have running here on one link at once; one past it
      # # fails at once. 1024 when left out or 0.
      # # integer, 0 or more; default 1024.
      # max_inflight: 1024

      # # How long a link may hear nothing before it is pinged; one that hears nothing for three of
      # # them is closed. 15s when left out.
      # # duration, as "1.5s" or "2m"; default "15s".
      # ping_interval: "15s"

      # # How long a ping may wait for its pong, behind everything sent before it, before the link is
      # # taken for too slow and closed. 30s when left out.
      # # duration, as "1.5s" or "2m"; default "30s".
      # slow_timeout: "30s"

      # # The most a dialer waits between attempts at a peer it cannot reach; the waits grow to it, at
      # # random within each step. 5s when left out.
      # # duration, as "1.5s" or "2m"; default "5s".
      # retry_interval: "5s"

      # # How long a stream, as a model call relayed between roles, may carry nothing either way
      # # before it ends. 2m when left out.
      # # duration, as "1.5s" or "2m"; default "2m".
      # stream_idle: "2m"

    # # The API agents on this machine or the LAN call, /v1/chat/completions, /v1/messages,
    # # /v1beta/models/{model}:generateContent, /api/chat, /v2/chat and the rest; none when left
    # # out.
    # # object.
    # api:
      # # The host and port the API listens on: a loopback address serves agents on this machine; a
      # # LAN address, or an empty host, serves agents on other machines too, and needs cert_file and
      # # key_file, so that keys never cross a network in the clear.
      # # string; required.
      # address: "127.0.0.1:9000"

      # # A PEM file with the API's certificate, followed by any intermediates; with key_file, the API
      # # is served over TLS.
      # # string.
      # cert_file: "/etc/fit/example.com.pem"

      # # A PEM file with the certificate's private key.
      # # string.
      # key_file: "/etc/fit/example.com.key"

      # # The largest request body a call may carry; one past it gets 413. It is held whole, to read
      # # the model it names and to send it again when a route cannot serve it. 32 MiB when left out
      # # or 0.
      # # integer, 0 or more; default 33554432.
      # max_body_bytes: 33554432

      # # The most connections the API keeps open at once; one past it is closed as soon as it is
      # # accepted. 256 when left out or 0.
      # # integer, 0 or more; default 256.
      # max_conns: 256

      # # The most calls the API forwards at once; one past it gets 429. 256 when left out or 0.
      # # integer, 0 or more; default 256.
      # max_inflight: 256

      # # How long a call may wait for its response to begin. 5m when left out.
      # # duration, as "1.5s" or "2m"; default "5m".
      # first_byte_timeout: "5m"

      # # The most one call may take, to the end of its response. 30m when left out.
      # # duration, as "1.5s" or "2m"; default "30m".
      # timeout: "30m"

    # # The keys agents call the API with, each kept as its SHA-256 alone. Its pages make and delete
    # # them.
    # # list of object.
    # api_keys:
      # -
        # # The key's ID, 16 hex digits.
        # # string; required.
        # id: ""

        # # What the key is for: 1 to 64 characters.
        # # string; required.
        # name: ""

        # # The key's first characters, to tell it by on the pages.
        # # string.
        # prefix: ""

        # # The SHA-256 of the key, in hex.
        # # string; required.
        # hash: ""

        # # When the key was made, in seconds since 1970.
        # # integer, 0 or more.
        # created_at: 0

# The tunnel's roles to run beside the gateway, on its engine: a hub, a node and a proxy,
# which reach services behind NAT through the hub. None when left out. What their web pages
# change is written back here.
# object.
# tunnel:
  # # Run a hub: nodes and proxies link to it, and it joins a proxy's tunnels to a node's.
  # # object.
  # hub:
    # # The name the hub tells the nodes and proxies that register. The host's name when left out.
    # # string.
    # name: ""

    # # The password nodes and proxies register with, which they prove they know without sending it.
    # # The hub refuses every registration while it is left out.
    # # string.
    # password: ""

    # # When set, the body of every frame on the links is encrypted with AES-256-GCM under a key
    # # made from it, and nodes and proxies need the same one. It applies to the links that open
    # # after it changes.
    # # string.
    # body_password: ""

    # # Where nodes and proxies link to the hub, each over its protocol. None when left out: the
    # # console's pages add them.
    # # list of object.
    # listeners:
      # -
        # # The protocol: tcp, a WebSocket (ws), for networks that let only HTTP through, or quic, over
        # # UDP.
        # # one of: tcp, ws, quic; required.
        # protocol: "tcp"

        # # The host and port it listens on, as in ":7000"; an empty host is every address.
        # # string; required.
        # address: "127.0.0.1:9000"

        # # A ws listener's path. /tunnel when left out.
        # # string; default "/tunnel".
        # path: "/tunnel"

    # # An encrypted WebSocket that carries the hub's console pages to the web_proxies of proxies
    # # that cannot reach them otherwise. Needs console. None when left out.
    # # object.
    # console_socket:
      # # The host and port the WebSocket listens on; it answers on any path.
      # # string; required.
      # address: "127.0.0.1:9000"

      # # The password the WebSocket's messages are encrypted with, which a proxy's web_proxy needs.
      # # The hub's password when left out.
      # # string.
      # password: ""

      # # The most WebSockets open at once; one past it is closed as soon as it opens. 32 when left
      # # out or 0.
      # # integer, 0 or more; default 32.
      # max_conns: 32

    # # The certificate and the connections of the quic listeners. The hub makes a self-signed
    # # certificate and writes it here when a quic listener needs one and none is set.
    # # object.
    # quic:
      # # The PEM certificate the quic listeners present, which nodes and proxies pin by its SHA-256
      # # fingerprint; with key. The hub makes a self-signed one and writes it here when a quic
      # # listener needs one and none is set.
      # # string.
      # cert: ""

      # # The PEM private key of cert.
      # # string.
      # key: ""

      # # How long a QUIC connection may hear nothing from its peer before it is closed. 30s when left
      # # out.
      # # duration, as "1.5s" or "2m"; default "30s".
      # idle_timeout: "30s"

      # # How often a quiet QUIC connection is pinged, so that it neither idles out nor loses its NAT
      # # mapping. 10s when left out.
      # # duration, as "1.5s" or "2m"; default "10s".
      # keep_alive: "10s"

      # # How long a QUIC handshake may take. 10s when left out.
      # # duration, as "1.5s" or "2m"; default "10s".
      # handshake_timeout: "10s"

      # # The most QUIC handshakes under way at once; a new connection past it is dropped, and its
      # # proxy tries again. 64 when left out or 0.
      # # integer, 0 or more; default 64.
      # max_handshakes: 64

    # # How long a link may take to register once it is open; it is closed past it. 10s when left
    # # out.
    # # duration, as "1.5s" or "2m"; default "10s".
    # register_timeout: "10s"

    # # How long a node may take to answer the hub: to open a tunnel, or to list or set its
    # # services. 15s when left out.
    # # duration, as "1.5s" or "2m"; default "15s".
    # call_timeout: "15s"

    # # The most links the hub keeps open at once, registered or not; one past it is closed as soon
    # # as it opens. 1024 when left out or 0.
    # # integer, 0 or more; default 1024.
    # max_links: 1024

    # # The most links one node or proxy may register, from however many processes of the same name.
    # # 128 when left out or 0.
    # # integer, 0 or more; default 128.
    # max_links_per_peer: 128

    # # The most nodes and proxies registered at once. 1024 when left out or 0.
    # # integer, 0 or more; default 1024.
    # max_peers: 1024

    # # The most tunnels the hub passes at once; a proxy's request for one more is refused. 16384
    # # when left out or 0.
    # # integer, 0 or more; default 16384.
    # max_tunnels: 16384

    # # The hub's web pages; none when left out.
    # # object.
    # console:
      # # The host and port the pages listen on. A host that is not a loopback address needs cert_file
      # # and key_file, so that passwords never cross a network in the clear.
      # # string; required.
      # address: "127.0.0.1:9000"

      # # A PEM file with the pages' certificate, followed by any intermediates; with key_file, the
      # # pages are served over TLS.
      # # string.
      # cert_file: "/etc/fit/example.com.pem"

      # # A PEM file with the certificate's private key.
      # # string.
      # key_file: "/etc/fit/example.com.key"

      # # Who may log in: at least one user.
      # # list of object; required.
      # users:
        # -
          # # The user's name.
          # # string; required.
          # username: "fit"

          # # The bcrypt hash of the user's password, as fit hash-password makes it.
          # # string; required.
          # password_hash: "$2a$14$Zkx19XLiW6VYouLHR5NmfOFU0z2GTNmpkT/5qqR7hx4IjWJPDhjvG"

      # # How long a login lasts without a request. 30m when left out.
      # # duration, as "1.5s" or "2m"; default "30m".
      # session_timeout: "30m"

      # # How long a login lasts at most, however busy. 12h when left out.
      # # duration, as "1.5s" or "2m"; default "12h".
      # session_lifetime: "12h"

      # # The most logins kept at once; one more ends the oldest. 64 when left out or 0.
      # # integer, 0 or more; default 64.
      # max_sessions: 64

      # # The most connections the pages keep open at once; one past it is closed as soon as it is
      # # accepted. 32 when left out or 0.
      # # integer, 0 or more; default 32.
      # max_conns: 32

  # # Run a node: it links to hubs and opens the tunnels they ask for to the services it exposes.
  # # object.
  # node:
    # # The node's name, which proxies name to reach its services. The host's name when left out.
    # # string.
    # name: ""

    # # Anything else the node tells the hubs, which their pages show.
    # # object of string.
