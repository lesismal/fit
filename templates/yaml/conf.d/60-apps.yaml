        # # The host and port it listens on, as in ":7000"; an empty host is every address.
        # # string; required.
        # address: "127.0.0.1:9000"

        # # A ws or wss listener's path. /tunnel when left out.
        # # string; default "/tunnel".
        # path: "/tunnel"

        # # A tls, wss or quic listener's certificate: a PEM file with it, followed by any
        # # intermediates, for nodes and proxies that check it with ca_file or the system's roots; with
        # # key_file. Read when the hub's member is applied, and again when it changes on disk (fit run
        # # -watch-certs). The hub's own certificate, in quic, when left out.
        # # string.
        # cert_file: "/etc/fit/example.com.pem"

        # # The PEM private key of cert_file.
        # # string.
        # key_file: "/etc/fit/example.com.key"

    # # An encrypted WebSocket that carries the hub's console pages to the web_proxies of proxies
    # # that cannot reach them otherwise. Needs console. None when left out.
    # # object.
    # console_socket:
      # # The host and port the WebSocket listens on; it answers on any path.
      # # string; required.
      # address: "127.0.0.1:9000"

      # # The password the WebSocket's messages are encrypted with, which a proxy's web_proxy needs.
      # # The hub's password when left out.
      # # string.
      # password: ""

      # # The most WebSockets open at once; one past it is closed as soon as it opens. A WebSocket
