    # # duration, as "1.5s" or "2m"; default "500ms".
    # key_frame_interval: "500ms"

  # # Put media servers behind fit: the UDP port the webrtc_proxy handler's answers name, which
  # # relays each peer to the media server that answered it, found by the ICE ufrag of the peer's
