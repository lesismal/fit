    # name: ""

    # # Anything else the node tells the hubs, which their pages show.
    # # object of string.
    # meta: {}

    # # The hubs the node links to and registers with. None when left out: the console's pages add
    # # them.
    # # list of object.
    # hubs:
      # -
        # # The hub's name here, which forwards and the pages name it by. The first endpoint's address
        # # when left out.
        # # string.
        # name: ""

        # # The hub's addresses, in the order each link tries them: it dials the first one not disabled,
        # # and the next when that fails.
        # # list of object; required.
        # endpoints:
          # -
            # # The hub's address: tls://host:port for TCP over TLS, wss://host:port/path for a WebSocket
            # # over TLS, quic://host:port for QUIC; or, only to a loopback host or with body_password,
            # # host:port or tcp://host:port for TCP and ws://host:port/path for a WebSocket in the clear.
            # # An address has no query, fragment or user ('?', '#', '@'): pin and ca_file say how the hub's
            # # certificate is checked.
            # # string; required.
            # address: "127.0.0.1:9000"

            # # Leave the endpoint out of the dials, keeping it for later.
            # # boolean.
            # disabled: true

        # # The token the hub issued for this node or proxy, as fitt1.<id>.<secret>, which its pages,
        # # its Admin API module or fit token show once when they make it. Set token or password, not
        # # both.
        # # string.
        # token: ""

        # # The hub's shared password: deprecated for token, taken by hubs of this release with a
        # # warning, and refused by the next.
        # # string.
        # password: ""

        # # The hub's body_password, when it has one. A tcp:// or ws:// endpoint whose host is not a
        # # loopback one needs it.
        # # string.
        # body_password: ""

        # # The SHA-256 fingerprint of the hub's certificate, as its pages show it, which tls://, wss://
        # # and quic:// endpoints check the certificate against, in place of the chain and name checks:
        # # for a hub with a self-signed certificate. Without it or ca_file, the certificate is checked
        # # against the system's roots.
        # # string.
        # pin: ""

        # # Deprecated: renamed pin; the old name goes in config version 2.
        # quic_pin: null

        # # A PEM file of the CAs that sign the hub's certificate, which tls://, wss:// and quic://
        # # endpoints check it against, its name too, in place of the system's roots. Read at each dial.
        # # Not with pin.
        # # string.
        # ca_file: "/etc/fit/ca.pem"

        # # Take any QUIC certificate, which lets anyone on the path read and change what the quic links
        # # carry: for tests only. Refused for a quic:// endpoint whose host is not a loopback one,
        # # unless body_password is set; pin and ca_file override it.
        # # boolean.
        # quic_insecure: true

        # # How many links to the hub carry tunnels; each tunnel goes over one throughout. 10 when left
        # # out or 0.
        # # integer, 0 to 100; default 10.
        # pool_size: 10

        # # How long a link's dial may take. 5s when left out.
        # # duration, as "1.5s" or "2m"; default "5s".
        # dial_timeout: "5s"

        # # How long the hub may take to answer a registration or a call. 10s when left out.
        # # duration, as "1.5s" or "2m"; default "10s".
        # call_timeout: "10s"

        # # How long a link waits after a failed dial, or a lost hub, before it dials again. 3s when
        # # left out.
        # # duration, as "1.5s" or "2m"; default "3s".
        # retry_interval: "3s"

        # # How often the round trip to the hub is measured. 5s when left out.
        # # duration, as "1.5s" or "2m"; default "5s".
        # ping_interval: "5s"

        # # How long a ping may go unanswered before it counts as lost. 5s when left out.
        # # duration, as "1.5s" or "2m"; default "5s".
        # ping_timeout: "5s"

    # # The services the node reaches, and the only addresses it opens tunnels to.
    # # list of object.
    # services:
      # -
        # # The service's name among the node's, which proxies' forwards name.
        # # string; required.
        # name: ""

        # # The service's TCP address, host and port.
        # # string; required.
        # address: "127.0.0.1:9000"

        # # What the service is, for the pages.
        # # string.
        # description: ""

    # # Let the hubs the node registers with set its services, which are the addresses it opens
    # # tunnels to, and write them into this member. Off when left out: only this member and the
    # # node's own pages set them.
    # # boolean.
    # allow_hub_services: true

    # # How long a connect to a service may take; shorter than a hub's call_timeout, so that the hub
    # # hears either way. 5s when left out.
    # # duration, as "1.5s" or "2m"; default "5s".
    # dial_timeout: "5s"

    # # How long a tunnel may carry nothing either way before it is closed. 2h when left out.
    # # duration, as "1.5s" or "2m"; default "2h".
    # idle_timeout: "2h"

    # # The most tunnels open at once, over every hub; a hub's request for one more is refused. 4096
    # # when left out or 0.
    # # integer, 0 or more; default 4096.
    # max_tunnels: 4096

    # # The node's web pages; none when left out.
    # # object.
    # console:
      # # The host and port the pages listen on. A host that is not a loopback address needs cert_file
      # # and key_file, so that passwords never cross a network in the clear.
      # # string; required.
      # address: "127.0.0.1:9000"

      # # Listen the pages with Multipath TCP where the kernel offers it (Linux 5.6+,
      # # net.mptcp.enabled), falling back to plain TCP where it does not. Off by default.
      # # boolean.
      # mptcp: true

      # # A PEM file with the pages' certificate, followed by any intermediates; with key_file, the
      # # pages are served over TLS.
      # # string.
      # cert_file: "/etc/fit/example.com.pem"

      # # A PEM file with the certificate's private key.
      # # string.
      # key_file: "/etc/fit/example.com.key"

      # # Who may log in: at least one user.
      # # list of object; required.
      # users:
        # -
          # # The user's name.
          # # string; required.
          # username: "fit"

          # # The bcrypt hash of the user's password, as fit hash-password makes it.
          # # string; required.
          # password_hash: "$2a$14$Zkx19XLiW6VYouLHR5NmfOFU0z2GTNmpkT/5qqR7hx4IjWJPDhjvG"

      # # How long a login lasts without a request. 30m when left out.
      # # duration, as "1.5s" or "2m"; default "30m".
      # session_timeout: "30m"

      # # How long a login lasts at most, however busy. 12h when left out.
      # # duration, as "1.5s" or "2m"; default "12h".
      # session_lifetime: "12h"

      # # The most logins kept at once; one more ends the oldest. 64 when left out or 0.
      # # integer, 0 or more; default 64.
      # max_sessions: 64

      # # The most connections the pages keep open at once, a quarter of them kept for those with a
      # # login. When they are taken, a new connection closes the oldest of those without one, of the
      # # client holding the most, and is closed as it is accepted only when every one has a login;
      # # one past a client's share, a quarter of them, is closed too, but for loopback clients. 32
      # # when left out or 0.
      # # integer, 0 or more; default 32.
      # max_conns: 32

