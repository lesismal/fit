# fit's config template as a directory: every field of the config and of every module's
# params, in files by kind. Generated by schema.TemplateDir; regenerate with:
# go test ./schema -update
#
# fit run -c <this directory> reads every file in it, its subdirectories too, in lexical
# order. listeners, routes, upstreams, services and providers are joined across the files;
# any other field is written in one file only. What is written out runs as it is: a
# listener on :8080, example.com answering "hello from fit", and api.example.com proxied
# to 127.0.0.1:9000. Every other field is commented out, with its default or an example:
# uncomment what you need. docs/reference/config.md describes them all.
#
# This file:
# The roles run beside the gateway on its engine: the LLM feature's and the tunnel's, AI
# models shared among machines and services behind NAT reached through a server,
# WebRTC's TURN server and media server, the media_auth policies of who may publish
# and play which streams, the streaming role's hub with its RTMP, RTSP, SRT and
# WebRTC listeners, the media libraries, directories of files catalogued, and the sync
# role's pipelines, records read from a source and written to sinks.

# The LLM feature's roles to run beside the gateway, on its engine: a hub, a node and a proxy,
# which share AI models among machines and serve them to agents. None when left out. What
# their web pages change is written back here.
# object.
# llm:
  # # Run a hub: nodes and proxies link to it, and it passes calls between them.
  # # object.
  # hub:
    # # The hub's stable ID, which its peers know it by. Made when left out, and written back here.
    # # string.
    # id: ""

    # # The name the hub shows its peers; the host's name when left out. Its pages change it.
    # # string.
    # name: ""

    # # The hub's web pages; none when left out.
    # # object.
    # console:
      # # The host and port the pages listen on. A host that is not a loopback address needs cert_file
      # # and key_file, so that passwords never cross a network in the clear.
      # # string; required.
      # address: "127.0.0.1:9000"

      # # Listen the pages with Multipath TCP where the kernel offers it (Linux 5.6+,
      # # net.mptcp.enabled), falling back to plain TCP where it does not. Off by default.
      # # boolean.
      # mptcp: true

      # # A PEM file with the pages' certificate, followed by any intermediates; with key_file, the
      # # pages are served over TLS.
      # # string.
      # cert_file: "/etc/fit/example.com.pem"

      # # A PEM file with the certificate's private key.
      # # string.
      # key_file: "/etc/fit/example.com.key"

      # # Who may log in: at least one user.
      # # list of object; required.
      # users:
        # -
          # # The user's name.
          # # string; required.
          # username: "fit"

          # # The bcrypt hash of the user's password, as fit hash-password makes it.
          # # string; required.
          # password_hash: "$2a$14$Zkx19XLiW6VYouLHR5NmfOFU0z2GTNmpkT/5qqR7hx4IjWJPDhjvG"

      # # How long a login lasts without a request. 30m when left out.
      # # duration, as "1.5s" or "2m"; default "30m".
      # session_timeout: "30m"

      # # How long a login lasts at most, however busy. 12h when left out.
      # # duration, as "1.5s" or "2m"; default "12h".
      # session_lifetime: "12h"

      # # The most logins kept at once; one more ends the oldest. 64 when left out or 0.
      # # integer, 0 or more; default 64.
      # max_sessions: 64

      # # The most connections the pages keep open at once, a quarter of them kept for those with a
      # # login. When they are taken, a new connection closes the oldest of those without one, of the
      # # client holding the most, and is closed as it is accepted only when every one has a login;
      # # one past a client's share, a quarter of them, is closed too, but for loopback clients. 32
      # # when left out or 0.
      # # integer, 0 or more; default 32.
      # max_conns: 32

      # # The client addresses the pages serve, deciding before the global access, which applies to
      # # the pages too: a connection either refuses is closed as soon as it is accepted. It follows
      # # every config applied, without restarting the pages. Set allow to "127.0.0.1" (and "::1") to
      # # keep local access whatever the global access says. Every address is served, unless the
      # # global access says otherwise, when left out.
      # # object.
      # access:
        # # IP addresses and CIDR prefixes served, as "10.0.0.0/8" or "2001:db8::/32": with any entry
        # # here or in allow_files, every address neither holds is refused, unless deny refuses it
        # # first.
        # # list of string.
        # allow: ["127.0.0.1", "::1", "10.0.0.0/8"]

        # # IP addresses and CIDR prefixes refused, whatever allow holds.
        # # list of string.
        # deny: ["203.0.113.0/24"]

        # # Files of more allow entries: an address or prefix on each line, with blank lines and what
        # # follows # or ; left out, as the lists published for firewalls are written. Read when the
        # # config is applied, and applied again when one changes; each at most 64 MiB.
        # # list of string.
        # allow_files: []

        # # Files of more deny entries, written as allow_files.
        # # list of string.
        # deny_files: []

    # # Where the hub takes links from nodes and proxies; none when left out. Its pages change it.
    # # object.
    # listen:
      # # The host and port the role takes links on, as a binding of its own on the listeners' engine;
      # # the WebSocket path is /ws. An empty host listens on every address.
      # # string; required.
      # address: "127.0.0.1:9000"

      # # The password of every role the listener links with that has no password of its own: peers
      # # prove they know it when they link, and it never crosses the network. Whoever holds it may
      # # link as any of those roles, so give each role its own instead. None when left out.
      # # string.
      # password: ""

      # # The password nodes prove to link as a node, on a hub's or a proxy's listener; password when
      # # left out.
      # # string.
      # node_password: ""

      # # The password proxies prove to link as a proxy, on a hub's or a node's listener; password
      # # when left out.
      # # string.
      # proxy_password: ""

      # # The password hubs prove to link as a hub, on a node's or a proxy's listener; password when
      # # left out.
      # # string.
      # hub_password: ""

      # # A PEM file with the certificate the listener presents, followed by any intermediates; with
      # # key_file, links are taken over TLS (wss://), and peers check it with their ca_file or pin. A
      # # listener on an address other than a loopback one needs TLS: this, or self_signed. Read when
      # # the listener starts, and again when it changes on disk (fit run -watch-certs): links from
      # # then on are taken with the new certificate, and those open stay.
      # # string.
      # cert_file: "/etc/fit/example.com.pem"

      # # A PEM file with the private key of cert_file.
      # # string.
      # key_file: "/etc/fit/example.com.key"

      # # Take links over TLS (wss://) with a self-signed certificate the role makes and keeps, so
      # # that it outlives a restart: in cert and key with admin.store, or else in a file beside the
      # # config, 0600, as fit.llm.hub.pem beside fit.json; its pages and its log show its SHA-256
      # # fingerprint, which peers set as their pin. For a listener without cert_file.
      # # boolean.
      # self_signed: true

      # # The PEM certificate self_signed made; with key. Written by the role; delete both for a new
      # # one, which every peer must pin again.
      # # string.
      # cert: ""

      # # The PEM private key of cert.
      # # string.
      # key: ""

    # # The client addresses the hub's listen takes links from, deciding before the global access: a
    # # connection it refuses is closed as soon as it is accepted. A change applies to the links
    # # that open from then on, without listening anew; those already open stay. Its console's pages
    # # take console.access.
    # # object.
    # access:
      # # IP addresses and CIDR prefixes served, as "10.0.0.0/8" or "2001:db8::/32": with any entry
      # # here or in allow_files, every address neither holds is refused, unless deny refuses it
      # # first.
      # # list of string.
      # allow: ["10.0.0.0/8", "192.168.0.0/16"]

      # # IP addresses and CIDR prefixes refused, whatever allow holds.
      # # list of string.
      # deny: ["203.0.113.0/24"]

