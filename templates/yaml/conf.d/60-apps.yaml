# The tunnel's roles to run beside the gateway, on its engine: a server, a node and a client,
# which reach services behind NAT through the server. None when left out. What their web pages
# change is written back here.
# object.
# tunnel:
  # # Run a server: nodes and clients link to it, and it joins a client's tunnels to a node's.
  # # object.
  # server:
    # # The name the server tells the nodes and clients that register. The host's name when left
    # # out.
    # # string.
    # name: ""

    # # The password nodes and clients register with, which they prove they know without sending it.
    # # The server refuses every registration while it is left out.
    # # string.
    # password: ""

    # # When set, the body of every frame on the links is encrypted with AES-256-GCM under a key
    # # made from it, and nodes and clients need the same one. It applies to the links that open
    # # after it changes.
    # # string.
    # body_password: ""

    # # Where nodes and clients link to the server, each over its protocol. None when left out: the
    # # console's pages add them.
    # # list of object.
    # listeners:
      # -
        # # The protocol: tcp, a WebSocket (ws), for networks that let only HTTP through, or quic, over
        # # UDP.
        # # one of: tcp, ws, quic; required.
        # protocol: "tcp"

        # # The host and port it listens on, as in ":7000"; an empty host is every address.
        # # string; required.
        # address: "127.0.0.1:9000"

        # # A ws listener's path. /fibhub when left out.
        # # string; default "/fibhub".
        # path: "/fibhub"

    # # An encrypted WebSocket that carries the server's console pages to the web_proxies of clients
    # # that cannot reach them otherwise. Needs console. None when left out.
    # # object.
    # console_socket:
      # # The host and port the WebSocket listens on; it answers on any path.
      # # string; required.
      # address: "127.0.0.1:9000"

      # # The password the WebSocket's messages are encrypted with, which a client's web_proxy needs.
      # # The server's password when left out.
      # # string.
      # password: ""

      # # The most WebSockets open at once; one past it is closed as soon as it opens. 32 when left
      # # out or 0.
      # # integer, 0 or more; default 32.
      # max_conns: 32

    # # The certificate and the connections of the quic listeners. The server makes a self-signed
    # # certificate and writes it here when a quic listener needs one and none is set.
    # # object.
    # quic:
      # # The PEM certificate the quic listeners present, which nodes and clients pin by its SHA-256
      # # fingerprint; with key. The server makes a self-signed one and writes it here when a quic
      # # listener needs one and none is set.
      # # string.
      # cert: ""

      # # The PEM private key of cert.
      # # string.
      # key: ""

      # # How long a QUIC connection may hear nothing from its peer before it is closed. 30s when left
      # # out.
      # # duration, as "1.5s" or "2m"; default "30s".
      # idle_timeout: "30s"

      # # How often a quiet QUIC connection is pinged, so that it neither idles out nor loses its NAT
      # # mapping. 10s when left out.
      # # duration, as "1.5s" or "2m"; default "10s".
      # keep_alive: "10s"

      # # How long a QUIC handshake may take. 10s when left out.
      # # duration, as "1.5s" or "2m"; default "10s".
      # handshake_timeout: "10s"

      # # The most QUIC handshakes under way at once; a new connection past it is dropped, and its
      # # client tries again. 64 when left out or 0.
      # # integer, 0 or more; default 64.
      # max_handshakes: 64

    # # How long a link may take to register once it is open; it is closed past it. 10s when left
    # # out.
    # # duration, as "1.5s" or "2m"; default "10s".
    # register_timeout: "10s"

    # # How long a node may take to answer the server: to open a tunnel, or to list or set its
    # # services. 15s when left out.
    # # duration, as "1.5s" or "2m"; default "15s".
    # call_timeout: "15s"

    # # The most links the server keeps open at once, registered or not; one past it is closed as
    # # soon as it opens. 1024 when left out or 0.
    # # integer, 0 or more; default 1024.
    # max_links: 1024

    # # The most links one node or client may register, from however many processes of the same
    # # name. 128 when left out or 0.
    # # integer, 0 or more; default 128.
    # max_links_per_peer: 128

    # # The most nodes and clients registered at once. 1024 when left out or 0.
    # # integer, 0 or more; default 1024.
    # max_peers: 1024

    # # The most tunnels the server passes at once; a client's request for one more is refused.
    # # 16384 when left out or 0.
    # # integer, 0 or more; default 16384.
    # max_tunnels: 16384

    # # The server's web pages; none when left out.
    # # object.
    # console:
      # # The host and port the pages listen on. A host that is not a loopback address needs cert_file
      # # and key_file, so that passwords never cross a network in the clear.
      # # string; required.
      # address: "127.0.0.1:9000"

      # # A PEM file with the pages' certificate, followed by any intermediates; with key_file, the
      # # pages are served over TLS.
      # # string.
      # cert_file: "/etc/fit/example.com.pem"

      # # A PEM file with the certificate's private key.
      # # string.
      # key_file: "/etc/fit/example.com.key"

      # # Who may log in: at least one user.
      # # list of object; required.
      # users:
        # -
          # # The user's name.
          # # string; required.
          # username: "fit"

          # # The bcrypt hash of the user's password, as fit hash-password makes it.
          # # string; required.
          # password_hash: "$2a$14$Zkx19XLiW6VYouLHR5NmfOFU0z2GTNmpkT/5qqR7hx4IjWJPDhjvG"

      # # How long a login lasts without a request. 30m when left out.
      # # duration, as "1.5s" or "2m"; default "30m".
      # session_timeout: "30m"

      # # How long a login lasts at most, however busy. 12h when left out.
      # # duration, as "1.5s" or "2m"; default "12h".
      # session_lifetime: "12h"

      # # The most logins kept at once; one more ends the oldest. 64 when left out or 0.
      # # integer, 0 or more; default 64.
      # max_sessions: 64

      # # The most connections the pages keep open at once; one past it is closed as soon as it is
      # # accepted. 32 when left out or 0.
      # # integer, 0 or more; default 32.
      # max_conns: 32

  # # Run a node: it links to servers and opens the tunnels they ask for to the services it
  # # exposes.
  # # object.
  # node:
    # # The node's name, which clients name to reach its services. The host's name when left out.
    # # string.
    # name: ""

    # # Anything else the node tells the servers, which their pages show.
    # # object of string.
    # meta: {}

    # # The servers the node links to and registers with. None when left out: the console's pages
    # # add them.
    # # list of object.
    # servers:
      # -
        # # The server's name here, which forwards and the pages name it by. The first endpoint's
        # # address when left out.
        # # string.
        # name: ""

        # # The server's addresses, in the order each link tries them: it dials the first one not
        # # disabled, and the next when that fails.
        # # list of object; required.
        # endpoints:
          # -
            # # The server's address: host:port or tcp://host:port for TCP, ws://host:port/path for a
            # # WebSocket, quic://host:port for QUIC.
            # # string; required.
            # address: "127.0.0.1:9000"

            # # Leave the endpoint out of the dials, keeping it for later.
            # # boolean.
            # disabled: true

        # # The server's password.
        # # string; required.
        # password: ""

        # # The server's body_password, when it has one.
        # # string.
        # body_password: ""

        # # The SHA-256 fingerprint of the server's QUIC certificate, as its pages show it, which a quic
        # # endpoint checks the certificate against. Without it, or quic_insecure, the certificate is
        # # checked against the system's roots.
        # # string.
        # quic_pin: ""

        # # Take any QUIC certificate, for tests only.
        # # boolean.
        # quic_insecure: true

        # # How many links to the server carry tunnels; each tunnel goes over one throughout. 10 when
        # # left out or 0.
        # # integer, 0 to 100; default 10.
        # pool_size: 10

        # # How long a link's dial may take. 5s when left out.
        # # duration, as "1.5s" or "2m"; default "5s".
        # dial_timeout: "5s"

        # # How long the server may take to answer a registration or a call. 10s when left out.
        # # duration, as "1.5s" or "2m"; default "10s".
        # call_timeout: "10s"

        # # How long a link waits after a failed dial, or a lost server, before it dials again. 3s when
        # # left out.
        # # duration, as "1.5s" or "2m"; default "3s".
        # retry_interval: "3s"

        # # How often the round trip to the server is measured. 5s when left out.
        # # duration, as "1.5s" or "2m"; default "5s".
        # ping_interval: "5s"

        # # How long a ping may go unanswered before it counts as lost. 5s when left out.
        # # duration, as "1.5s" or "2m"; default "5s".
        # ping_timeout: "5s"

    # # The services the node reaches, and the only addresses it opens tunnels to. fibhub called
    # # them nodes.
    # # list of object.
    # services:
      # -
        # # The service's name among the node's, which clients' forwards name.
        # # string; required.
        # name: ""

        # # The service's TCP address, host and port.
        # # string; required.
        # address: "127.0.0.1:9000"

        # # What the service is, for the pages.
        # # string.
        # description: ""

    # # How long a connect to a service may take; shorter than a server's call_timeout, so that the
    # # server hears either way. 5s when left out.
    # # duration, as "1.5s" or "2m"; default "5s".
    # dial_timeout: "5s"

    # # How long a tunnel may carry nothing either way before it is closed. 2h when left out.
    # # duration, as "1.5s" or "2m"; default "2h".
    # idle_timeout: "2h"

    # # The most tunnels open at once, over every server; a server's request for one more is
    # # refused. 4096 when left out or 0.
    # # integer, 0 or more; default 4096.
    # max_tunnels: 4096

    # # The node's web pages; none when left out.
    # # object.
    # console:
      # # The host and port the pages listen on. A host that is not a loopback address needs cert_file
