    # # The hubs the node links to and registers with. None when left out: the console's pages add
    # # them.
    # # list of object.
    # hubs:
      # -
        # # The hub's name here, which forwards and the pages name it by. The first endpoint's address
        # # when left out.
        # # string.
        # name: ""

        # # The hub's addresses, in the order each link tries them: it dials the first one not disabled,
        # # and the next when that fails.
        # # list of object; required.
