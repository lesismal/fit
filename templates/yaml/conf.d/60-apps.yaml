    # # The password every node and proxy may register with, which they prove they know without
    # # sending it: deprecated for tokens, which give each member a credential of its own. Still
    # # taken in this release, with a warning on the pages while a member uses it; refused in the
    # # next. Without it, only tokens register.
    # # string.
    # password: ""

    # # The tokens the hub issued, which nodes and proxies register with in place of the password:
    # # each its own credential, kept as a hash, with an optional expiry. The hub's pages, its Admin
    # # API module and fit token make, list, change and revoke them; not written by hand.
    # # list of object.
    # tokens:
      # -
        # # The token's ID, 16 hex digits, the part of the token before its secret; unique among the
        # # listener's.
        # # string; required.
        # id: ""

        # # What the token is for, as the pages list it: 1 to 64 characters.
        # # string; required.
        # name: ""

        # # The SHA-256 of the key the token's secret derives, in hex: what the listener checks a link's
        # # proof with, which cannot be used to link. The token itself is not kept.
        # # string; required.
        # hash: ""

        # # When the token was made, in seconds since 1970.
        # # integer, 0 or more.
        # created_at: 0

        # # When the token expires, in seconds since 1970: it is refused from then on, and the links it
        # # holds are closed. Never when left out or 0.
        # # integer, 0 or more.
        # expires_at: 0

        # # Anything else about the token, for the pages; up to 1024 bytes.
        # # string.
        # note: ""

        # # The members that first linked with the token, which no other token may link as: a tunnel's
        # # node/<name> or proxy/<name>, an LLM role's ID. Written by the listener; revoking the token
        # # frees them.
        # # list of string.
        # members: []

    # # When set, the body of every frame on the links is encrypted with AES-256-GCM, and nodes and
    # # proxies need the same one: each frame is authenticated, so a tcp or ws listener on an
    # # address that is not a loopback one is allowed only with it. A link registered with a token
    # # derives its keys from the token and this, by HKDF; one with the password, from the
    # # password's PBKDF2. It applies to the links that open after it changes.
