        # # How long a ping may go unanswered before it counts as lost. 5s when left out.
        # # duration, as "1.5s" or "2m"; default "5s".
        # ping_timeout: "5s"

    # # The services the node reaches, and the only addresses it opens tunnels to.
    # # list of object.
    # services:
      # -
        # # The service's name among the node's, which proxies' forwards name.
