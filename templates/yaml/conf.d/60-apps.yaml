    # # How long a tunnel may carry nothing either way before it is closed. 2h when left out.
    # # duration, as "1.5s" or "2m"; default "2h".
    # idle_timeout: "2h"

    # # The most tunnels open at once, over every forward; a connection past it is closed as soon as
    # # it is accepted. 4096 when left out or 0.
    # # integer, 0 or more; default 4096.
    # max_tunnels: 4096

    # # The proxy's web pages; none when left out.
    # # object.
    # console:
      # # The host and port the pages listen on. A host that is not a loopback address needs cert_file
      # # and key_file, so that passwords never cross a network in the clear.
      # # string; required.
      # address: "127.0.0.1:9000"

      # # Listen the pages with Multipath TCP where the kernel offers it (Linux 5.6+,
      # # net.mptcp.enabled), falling back to plain TCP where it does not. Off by default.
      # # boolean.
      # mptcp: true

      # # A PEM file with the pages' certificate, followed by any intermediates; with key_file, the
      # # pages are served over TLS.
      # # string.
      # cert_file: "/etc/fit/example.com.pem"

      # # A PEM file with the certificate's private key.
      # # string.
      # key_file: "/etc/fit/example.com.key"

      # # Who may log in: at least one user.
      # # list of object; required.
      # users:
        # -
          # # The user's name.
          # # string; required.
          # username: "fit"

          # # The bcrypt hash of the user's password, as fit hash-password makes it.
          # # string; required.
          # password_hash: "$2a$14$Zkx19XLiW6VYouLHR5NmfOFU0z2GTNmpkT/5qqR7hx4IjWJPDhjvG"

      # # How long a login lasts without a request. 30m when left out.
      # # duration, as "1.5s" or "2m"; default "30m".
      # session_timeout: "30m"

      # # How long a login lasts at most, however busy. 12h when left out.
      # # duration, as "1.5s" or "2m"; default "12h".
      # session_lifetime: "12h"

      # # The most logins kept at once; one more ends the oldest. 64 when left out or 0.
      # # integer, 0 or more; default 64.
      # max_sessions: 64

      # # The most connections the pages keep open at once, a quarter of them kept for those with a
      # # login. When they are taken, a new connection closes the oldest of those without one, of the
      # # client holding the most, and is closed as it is accepted only when every one has a login;
      # # one past a client's share, a quarter of them, is closed too, but for loopback clients. 32
      # # when left out or 0.
      # # integer, 0 or more; default 32.
      # max_conns: 32

      # # The client addresses the pages serve, deciding before the global access, which applies to
      # # the pages too: a connection either refuses is closed as soon as it is accepted. It follows
      # # every config applied, without restarting the pages. Set allow to "127.0.0.1" (and "::1") to
      # # keep local access whatever the global access says. Every address is served, unless the
      # # global access says otherwise, when left out.
      # # object.
      # access:
        # # IP addresses and CIDR prefixes served, as "10.0.0.0/8" or "2001:db8::/32": with any entry
        # # here or in allow_files, every address neither holds is refused, unless deny refuses it
        # # first.
        # # list of string.
        # allow: ["127.0.0.1", "::1", "10.0.0.0/8"]

        # # IP addresses and CIDR prefixes refused, whatever allow holds.
        # # list of string.
        # deny: ["203.0.113.0/24"]

        # # Files of more allow entries: an address or prefix on each line, with blank lines and what
        # # follows # or ; left out, as the lists published for firewalls are written. Read when the
        # # config is applied, and applied again when one changes; each at most 64 MiB.
        # # list of string.
        # allow_files: []

        # # Files of more deny entries, written as allow_files.
        # # list of string.
        # deny_files: []

# What fit runs for WebRTC beside the gateway, on its engine: a TURN server, the media port of
# the whip and whep handlers, and the relay of the webrtc_proxy handler. None when left out.
# object.
# webrtc:
  # # Run a TURN server (RFC 8656), which relays UDP for WebRTC peers and other ICE agents that
  # # cannot reach each other directly. None when left out.
  # # object.
  # turn:
    # # The UDP addresses clients reach the server at, as in ":3478", the port TURN's turn: URIs
    # # default to. A change of listen, listen_tcp or listen_tls starts a new server and drains the
    # # old one.
    # # list of string; required.
    # listen: []

    # # TCP addresses clients reach the server at, as in ":3478", for clients on networks that block
    # # UDP: turn:host:3478?transport=tcp. Their allocations relay UDP, and end when their
    # # connection closes.
    # # list of string.
    # listen_tcp: []

    # # TLS addresses clients reach the server at, as in ":5349" or ":443", with tls's certificates,
    # # for clients that only TLS gets through for: turns:host:5349?transport=tcp. As listen_tcp
    # # otherwise.
    # # list of string.
    # listen_tls: []

    # # Listen listen_tcp and listen_tls with Multipath TCP where the kernel offers it (Linux 5.6+,
    # # net.mptcp.enabled), falling back to plain TCP where it does not. Off by default; listen's
    # # UDP sockets have none. A change of it starts a new server and drains the old one.
    # # boolean.
    # mptcp: true

    # # The certificates of listen_tls, from files, as a listener's tls.certificates has them, and
    # # watched as theirs are: a change applies to the next handshake.
    # # object.
    # tls:
      # # Certificates from files. A client is given the first whose names match the one it asks for,
      # # or the first of all when none does or it asks for none.
      # # list of object; required.
      # certificates:
        # -
          # # A PEM file with the certificate, followed by any intermediates.
          # # string; required.
          # cert_file: "/etc/fit/example.com.pem"

          # # A PEM file with the certificate's private key.
          # # string; required.
          # key_file: "/etc/fit/example.com.key"

    # # The client addresses the server serves on listen, listen_tcp and listen_tls, deciding before
    # # the global access: a connection it refuses is closed as soon as it is accepted, and the
    # # datagrams of a UDP client it refuses are dropped. Peers are not clients: allowed_peers and
    # # denied_peers decide those. A change applies to the next client, without starting a new
    # # server; the allocations held are kept.
    # # object.
    # access:
      # # IP addresses and CIDR prefixes served, as "10.0.0.0/8" or "2001:db8::/32": with any entry
      # # here or in allow_files, every address neither holds is refused, unless deny refuses it
      # # first.
      # # list of string.
      # allow: ["10.0.0.0/8", "192.168.0.0/16"]

      # # IP addresses and CIDR prefixes refused, whatever allow holds.
      # # list of string.
      # deny: ["203.0.113.0/24"]

      # # Files of more allow entries: an address or prefix on each line, with blank lines and what
      # # follows # or ; left out, as the lists published for firewalls are written. Read when the
      # # config is applied, and applied again when one changes; each at most 64 MiB.
      # # list of string.
      # allow_files: []

      # # Files of more deny entries, written as allow_files.
      # # list of string.
      # deny_files: []

    # # The realm of the credentials, sent in every challenge: clients derive their key from their
    # # name, the realm and their password. A change starts a new server, ending the allocations of
    # # the old one when they share an address and draining it otherwise.
    # # string; required.
    # realm: "fit"

    # # The users with fixed credentials. With secret, or alone; at least one of the two.
    # # list of object.
    # users:
      # -
        # # The username.
        # # string; required.
        # name: ""

        # # The password; or key.
        # # string.
        # password: ""

        # # Instead of the password, the long-term key it derives, as coturn's turnadmin -k prints it:
        # # MD5(name ":" realm ":" password) in hex, optionally after 0x, so that the password is not
        # # kept.
        # # string.
        # key: ""

    # # The shared secret of time-limited credentials, as coturn's static-auth-secret
    # # (use-auth-secret) has it: a username "<expiry in Unix seconds>:<anything>" whose password is
    # # the base64 of HMAC-SHA1(secret, username), valid until the expiry. A web service that knows
    # # the secret hands them out.
    # # string.
    # secret: ""

    # # The address the relayed sockets bind to, one of the host's, not a wildcard; clients are told
    # # it, unless public_ip is set. Its family is every allocation's. Peers on it, and on
    # # public_ip, are relayed to on the ports of the server's own relayed addresses alone, and on
    # # those allowed_peers lists with their port. A change starts a new server.
    # # string; required.
    # relay_ip: ""

    # # The address clients are told for their relayed sockets instead of relay_ip, for a server
    # # behind a 1:1 NAT that maps it to relay_ip. Of relay_ip's family. A change starts a new
    # # server.
    # # string.
    # public_ip: ""

    # # The lowest port of the relayed sockets, as a firewall that opens a range expects; with
    # # port_max. Ports the kernel picks when both are left out. A change starts a new server.
    # # integer, 0 to 65535.
    # port_min: 0

    # # The highest port of the relayed sockets; with port_min.
    # # integer, 0 to 65535.
    # port_max: 0

    # # The most allocations held at once; one more is refused with 508. Each holds a relayed socket
    # # on every event loop. 1024 when left out or 0. A change applies to the next allocation; those
    # # held past a lowered one are kept until they end.
    # # integer, 0 or more; default 1024.
    # max_allocations: 1024

    # # The most allocations of one username; one more is refused with 486. 16 when left out or 0.
    # # Applies to the next allocation.
    # # integer, 0 or more; default 16.
    # max_allocations_per_user: 16

    # # The most permissions, peer addresses, one allocation holds; one more is refused with 508. A
    # # channel's peer counts. 64 when left out or 0. Applies to the next request.
    # # integer, 0 or more; default 64.
    # max_permissions: 64

    # # The most channels one allocation binds; one more is refused with 508. 64 when left out or 0.
    # # Applies to the next request.
    # # integer, 0 or more; default 64.
    # max_channels: 64

    # # The largest message a TCP or TLS client may send, and so what its connection buffers of one
    # # not yet whole; a connection whose next message claims more is closed. At least 2048. 8 KiB
    # # when left out or 0. A change starts a new server.
    # # integer, 0 or more; default 8192.
    # max_stream_message: 8192

    # # How long a TCP or TLS client's connection may stay open without an allocation, before its
    # # first Allocate or after its allocation ended, before it is closed. 30s when left out. A
    # # change starts a new server.
    # # duration, as "1.5s" or "2m"; default "30s".
    # stream_idle_timeout: "30s"

    # # The most bytes a second relayed for one username each way, to peers and from them, with a
    # # second's worth of burst; datagrams past it are dropped. 2 MiB when left out or 0.
    # # integer, 0 or more; default 2097152.
    # user_bandwidth: 2097152

    # # The lifetime of an allocation whose client asks for less, or for none; clients refresh it
    # # before it ends. 10m when left out. Applies to the next allocation or refresh.
    # # duration, as "1.5s" or "2m"; default "10m".
    # default_lifetime: "10m"

    # # The longest lifetime a client may ask for. 1h when left out. Applies to the next allocation
    # # or refresh.
    # # duration, as "1.5s" or "2m"; default "1h".
    # max_lifetime: "1h"

    # # How long a nonce is good for; a request with an older one is answered 438 with a fresh one.
    # # 10m when left out. Applies to the next nonce.
    # # duration, as "1.5s" or "2m"; default "10m".
    # nonce_lifetime: "10m"

    # # The key nonces are made with; a random one when left out. Servers behind one load balancer,
    # # which may each see a client's requests, share one. A change starts a new server.
    # # string.
    # nonce_secret: ""

    # # The addresses and prefixes, as in "10.1.0.0/16", peers may be at even when denied_peers or
    # # the default denial cover them: loopback, private, link-local and other internal ranges are
    # # denied unless listed here, so that the relay cannot reach into the network it runs in. An
    # # address with a port, as in "10.0.0.5:8189", allows that port alone, which is how a peer on
    # # relay_ip itself, such as webrtc.media, is reached.
    # # list of string.
    # allowed_peers: []

    # # Addresses and prefixes peers may not be at, beyond the internal ranges denied by default; an
    # # address with a port denies that port alone.
    # # list of string.
    # denied_peers: []

  # # Run fit as a WebRTC media server: the UDP port the PeerConnections of the whip and whep
  # # handlers share, the ICE servers told to their peers, and their limits. Routes with whip or
  # # whep handlers answer 503 without it. None when left out.
  # # object.
  # media:
    # # The UDP address every peer's media reaches fit at, one port all PeerConnections share, as in
    # # ":8189". A wildcard host advertises the address of every interface that is up, unless
    # # public_ips is set. A change starts the media server again, ending its sessions.
    # # string; required.
    # listen: ""

    # # The addresses peers are told to reach the port at, with its port, instead of the interfaces'
    # # own: a server behind a 1:1 NAT, or a load balancer that forwards the port unchanged. A
    # # change starts the media server again.
    # # list of string.
    # public_ips: []

    # # The peer addresses the port serves, deciding before the global access: the datagrams of an
    # # address it refuses are dropped, so its ICE checks go unanswered. A change applies to the
    # # next new address, without starting the media server again; the sessions and addresses served
    # # are kept.
    # # object.
    # access:
      # # IP addresses and CIDR prefixes served, as "10.0.0.0/8" or "2001:db8::/32": with any entry
      # # here or in allow_files, every address neither holds is refused, unless deny refuses it
      # # first.
      # # list of string.
      # allow: ["10.0.0.0/8", "192.168.0.0/16"]

      # # IP addresses and CIDR prefixes refused, whatever allow holds.
      # # list of string.
      # deny: ["203.0.113.0/24"]

      # # Files of more allow entries: an address or prefix on each line, with blank lines and what
      # # follows # or ; left out, as the lists published for firewalls are written. Read when the
      # # config is applied, and applied again when one changes; each at most 64 MiB.
      # # list of string.
      # allow_files: []

      # # Files of more deny entries, written as allow_files.
      # # list of string.
      # deny_files: []

    # # STUN and TURN servers the peers are told of in Link headers (RFC 9725), for their side of
    # # ICE; fit's side needs none, as it is an ICE lite agent on its own address.
    # # list of object.
    # ice_servers:
      # -
        # # The server's stun:, stuns:, turn: or turns: URLs.
        # # list of string; required.
        # urls: []

        # # A TURN server's username.
        # # string.
        # username: "fit"

        # # A TURN server's password.
        # # string.
        # credential: ""

    # # URLs of fit's own TURN server, webrtc.turn, as peers reach it, as in
    # # "turn:turn.example.com:3478": each answer's Link headers carry them with time-limited
    # # credentials made from webrtc.turn's secret, which must be set.
    # # list of string.
    # turn_urls: []

    # # How long the TURN credentials an answer carries are good for. 1h when left out.
    # # duration, as "1.5s" or "2m"; default "1h".
    # turn_credential_ttl: "1h"

    # # The codecs publishers may send, by encoding name: opus, VP8, VP9, H264 and AV1, every one
    # # when left out. Each publisher's offer is answered with the first of its codecs of each kind
    # # that is listed here, which its viewers must accept.
    # # list of string; default ["opus","VP8","VP9","H264","AV1"].
    # codecs: ["opus","VP8","VP9","H264","AV1"]

    # # The most PeerConnections at once, publishers' and viewers'; one more offer is answered 503.
    # # 1024 when left out or 0.
    # # integer, 0 or more; default 1024.
    # max_peer_connections: 1024

    # # The most streams published at once; one more publisher is answered 503. 64 when left out or
    # # 0.
    # # integer, 0 or more; default 64.
    # max_streams: 64

    # # The most viewers of one stream; one more is answered 503. Each packet a publisher sends is
    # # sent again to every viewer, on the worker that received it. 256 when left out or 0.
    # # integer, 0 or more; default 256.
    # max_viewers: 256

    # # The most bits a second a publisher may send: told to it as REMB feedback, which browsers
    # # keep under, and enforced with two seconds of burst, past which its packets are dropped.
    # # 8000000 when left out or 0.
    # # integer, 0 or more; default 8000000.
    # max_bitrate: 8000000

    # # The largest offer taken; a larger one is answered 413. 32 KiB when left out or 0.
    # # integer, 0 or more; default 32768.
    # max_sdp_bytes: 32768

    # # How long a session may take from its answer to a connected PeerConnection before it is
    # # ended. 30s when left out.
    # # duration, as "1.5s" or "2m"; default "30s".
    # connect_timeout: "30s"

    # # How long a connected peer may be silent, its media and ICE consent checks alike, before its
    # # session is ended: a publisher's ends its stream and its viewers. 30s when left out.
    # # duration, as "1.5s" or "2m"; default "30s".
    # ice_timeout: "30s"

    # # The least time between two key frame requests (PLI) passed to a publisher, for the viewers
