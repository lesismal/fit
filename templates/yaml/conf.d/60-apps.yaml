# What fit runs for WebRTC beside the gateway, on its engine: a TURN server, the media port of
# the whip and whep handlers, and the relay of the webrtc_proxy handler. None when left out.
# object.
# webrtc:
  # # Run a TURN server (RFC 8656), which relays UDP for WebRTC peers and other ICE agents that
  # # cannot reach each other directly. None when left out.
  # # object.
  # turn:
    # # The UDP addresses clients reach the server at, as in ":3478", the port TURN's turn: URIs
    # # default to. A change of listen, listen_tcp or listen_tls starts a new server and drains the
    # # old one.
    # # list of string; required.
    # listen: []

    # # TCP addresses clients reach the server at, as in ":3478", for clients on networks that block
    # # UDP: turn:host:3478?transport=tcp. Their allocations relay UDP, and end when their
    # # connection closes.
    # # list of string.
    # listen_tcp: []

    # # TLS addresses clients reach the server at, as in ":5349" or ":443", with tls's certificates,
    # # for clients that only TLS gets through for: turns:host:5349?transport=tcp. As listen_tcp
    # # otherwise.
    # # list of string.
    # listen_tls: []

    # # Listen listen_tcp and listen_tls with Multipath TCP where the kernel offers it (Linux 5.6+,
    # # net.mptcp.enabled), falling back to plain TCP where it does not. Off by default; listen's
    # # UDP sockets have none. A change of it starts a new server and drains the old one.
    # # boolean.
    # mptcp: true

    # # The certificates of listen_tls, from files, as a listener's tls.certificates has them, and
    # # watched as theirs are: a change applies to the next handshake.
    # # object.
    # tls:
      # # Certificates from files. A client is given the first whose names match the one it asks for,
      # # or the first of all when none does or it asks for none.
      # # list of object; required.
      # certificates:
        # -
          # # A PEM file with the certificate, followed by any intermediates.
          # # string; required.
          # cert_file: "/etc/fit/example.com.pem"

          # # A PEM file with the certificate's private key.
          # # string; required.
          # key_file: "/etc/fit/example.com.key"

    # # The client addresses the server serves on listen, listen_tcp and listen_tls, deciding before
    # # the global access: a connection it refuses is closed as soon as it is accepted, and the
    # # datagrams of a UDP client it refuses are dropped. Peers are not clients: allowed_peers and
    # # denied_peers decide those. A change applies to the next client, without starting a new
    # # server; the allocations held are kept.
    # # object.
    # access:
      # # IP addresses and CIDR prefixes served, as "10.0.0.0/8" or "2001:db8::/32": with any entry
      # # here or in allow_files, every address neither holds is refused, unless deny refuses it
      # # first.
      # # list of string.
      # allow: ["*.example.com", "10.1.0.0/16"]

      # # IP addresses and CIDR prefixes refused, whatever allow holds.
      # # list of string.
      # deny: ["169.254.169.254"]

      # # Files of more allow entries: an address or prefix on each line, with blank lines and what
      # # follows # or ; left out, as the lists published for firewalls are written. Read when the
      # # config is applied, and applied again when one changes; each at most 64 MiB.
      # # list of string.
      # allow_files: []

      # # Files of more deny entries, written as allow_files.
      # # list of string.
      # deny_files: []

    # # The realm of the credentials, sent in every challenge: clients derive their key from their
    # # name, the realm and their password. A change starts a new server, ending the allocations of
    # # the old one when they share an address and draining it otherwise.
    # # string; required.
    # realm: "fit"

    # # The users with fixed credentials. With secret, or alone; at least one of the two.
    # # list of object.
    # users:
      # -
        # # The username.
        # # string; required.
        # name: ""

        # # The password; or key.
        # # string.
        # password: ""

        # # Instead of the password, the long-term key it derives, as coturn's turnadmin -k prints it:
        # # MD5(name ":" realm ":" password) in hex, optionally after 0x, so that the password is not
        # # kept.
        # # string.
        # key: ""

    # # The shared secret of time-limited credentials, as coturn's static-auth-secret
    # # (use-auth-secret) has it: a username "<expiry in Unix seconds>:<anything>" whose password is
    # # the base64 of HMAC-SHA1(secret, username), valid until the expiry. A web service that knows
    # # the secret hands them out.
    # # string.
    # secret: ""

    # # The address the relayed sockets bind to, one of the host's, not a wildcard; clients are told
    # # it, unless public_ip is set. Its family is every allocation's. Peers on it, and on
    # # public_ip, are relayed to on the ports of the server's own relayed addresses alone, and on
    # # those allowed_peers lists with their port. A change starts a new server.
    # # string; required.
    # relay_ip: ""

    # # The address clients are told for their relayed sockets instead of relay_ip, for a server
    # # behind a 1:1 NAT that maps it to relay_ip. Of relay_ip's family. A change starts a new
    # # server.
    # # string.
    # public_ip: ""

    # # The lowest port of the relayed sockets, as a firewall that opens a range expects; with
    # # port_max. Ports the kernel picks when both are left out. A change starts a new server.
    # # integer, 0 to 65535.
    # port_min: 0

    # # The highest port of the relayed sockets; with port_min.
    # # integer, 0 to 65535.
    # port_max: 0

    # # The most allocations held at once; one more is refused with 508. Each holds a relayed socket
    # # on every event loop. 1024 when left out or 0. A change applies to the next allocation; those
    # # held past a lowered one are kept until they end.
    # # integer, 0 or more; default 1024.
    # max_allocations: 1024

    # # The most allocations of one username; one more is refused with 486. 16 when left out or 0.
    # # Applies to the next allocation.
    # # integer, 0 or more; default 16.
    # max_allocations_per_user: 16

    # # The most permissions, peer addresses, one allocation holds; one more is refused with 508. A
    # # channel's peer counts. 64 when left out or 0. Applies to the next request.
    # # integer, 0 or more; default 64.
    # max_permissions: 64

    # # The most channels one allocation binds; one more is refused with 508. 64 when left out or 0.
    # # Applies to the next request.
    # # integer, 0 or more; default 64.
    # max_channels: 64

    # # The largest message a TCP or TLS client may send, and so what its connection buffers of one
    # # not yet whole; a connection whose next message claims more is closed. At least 2048. 8 KiB
    # # when left out or 0. A change starts a new server.
    # # integer, 0 or more; default 8192.
    # max_stream_message: 8192

    # # How long a TCP or TLS client's connection may stay open without an allocation, before its
    # # first Allocate or after its allocation ended, before it is closed. 30s when left out. A
    # # change starts a new server.
    # # duration, as "1.5s" or "2m"; default "30s".
    # stream_idle_timeout: "30s"

    # # The most bytes a second relayed for one username each way, to peers and from them, with a
    # # second's worth of burst; datagrams past it are dropped. 2 MiB when left out or 0.
    # # integer, 0 or more; default 2097152.
    # user_bandwidth: 2097152

    # # The lifetime of an allocation whose client asks for less, or for none; clients refresh it
    # # before it ends. 10m when left out. Applies to the next allocation or refresh.
    # # duration, as "1.5s" or "2m"; default "10m".
    # default_lifetime: "10m"

    # # The longest lifetime a client may ask for. 1h when left out. Applies to the next allocation
    # # or refresh.
    # # duration, as "1.5s" or "2m"; default "1h".
    # max_lifetime: "1h"

    # # How long a nonce is good for; a request with an older one is answered 438 with a fresh one.
    # # 10m when left out. Applies to the next nonce.
    # # duration, as "1.5s" or "2m"; default "10m".
    # nonce_lifetime: "10m"

    # # The key nonces are made with; a random one when left out. Servers behind one load balancer,
    # # which may each see a client's requests, share one. A change starts a new server.
    # # string.
    # nonce_secret: ""

    # # The addresses and prefixes, as in "10.1.0.0/16", peers may be at even when denied_peers or
    # # the default denial cover them: loopback, private, link-local and other internal ranges are
    # # denied unless listed here, so that the relay cannot reach into the network it runs in. An
    # # address with a port, as in "10.0.0.5:8189", allows that port alone, which is how a peer on
    # # relay_ip itself, such as webrtc.media, is reached.
    # # list of string.
    # allowed_peers: []

    # # Addresses and prefixes peers may not be at, beyond the internal ranges denied by default; an
    # # address with a port denies that port alone.
    # # list of string.
    # denied_peers: []

  # # Run fit as a WebRTC media server: the UDP port the PeerConnections of the whip and whep
  # # handlers share, the ICE servers told to their peers, and their limits. Routes with whip or
  # # whep handlers answer 503 without it. None when left out.
  # # object.
  # media:
    # # The UDP address every peer's media reaches fit at, one port all PeerConnections share, as in
    # # ":8189". A wildcard host advertises the address of every interface that is up, unless
    # # public_ips is set. A change starts the media server again, ending its sessions.
    # # string; required.
    # listen: ""

    # # The addresses peers are told to reach the port at, with its port, instead of the interfaces'
    # # own: a server behind a 1:1 NAT, or a load balancer that forwards the port unchanged. A
    # # change starts the media server again.
    # # list of string.
    # public_ips: []

    # # The peer addresses the port serves, deciding before the global access: the datagrams of an
    # # address it refuses are dropped, so its ICE checks go unanswered. A change applies to the
    # # next new address, without starting the media server again; the sessions and addresses served
    # # are kept.
    # # object.
    # access:
      # # IP addresses and CIDR prefixes served, as "10.0.0.0/8" or "2001:db8::/32": with any entry
      # # here or in allow_files, every address neither holds is refused, unless deny refuses it
      # # first.
      # # list of string.
      # allow: ["*.example.com", "10.1.0.0/16"]

      # # IP addresses and CIDR prefixes refused, whatever allow holds.
      # # list of string.
      # deny: ["169.254.169.254"]

      # # Files of more allow entries: an address or prefix on each line, with blank lines and what
      # # follows # or ; left out, as the lists published for firewalls are written. Read when the
      # # config is applied, and applied again when one changes; each at most 64 MiB.
      # # list of string.
      # allow_files: []

      # # Files of more deny entries, written as allow_files.
      # # list of string.
      # deny_files: []

    # # STUN and TURN servers the peers are told of in Link headers (RFC 9725), for their side of
    # # ICE; fit's side needs none, as it is an ICE lite agent on its own address.
    # # list of object.
    # ice_servers:
      # -
        # # The server's stun:, stuns:, turn: or turns: URLs.
        # # list of string; required.
        # urls: []

        # # A TURN server's username.
        # # string.
        # username: "fit"

        # # A TURN server's password.
        # # string.
        # credential: ""

    # # URLs of fit's own TURN server, webrtc.turn, as peers reach it, as in
    # # "turn:turn.example.com:3478": each answer's Link headers carry them with time-limited
    # # credentials made from webrtc.turn's secret, which must be set.
    # # list of string.
    # turn_urls: []

    # # How long the TURN credentials an answer carries are good for. 1h when left out.
    # # duration, as "1.5s" or "2m"; default "1h".
    # turn_credential_ttl: "1h"

    # # The codecs publishers may send, by encoding name: opus, VP8, VP9, H264 and AV1, every one
    # # when left out. Each publisher's offer is answered with the first of its codecs of each kind
    # # that is listed here, which its viewers must accept.
    # # list of string; default ["opus","VP8","VP9","H264","AV1"].
    # codecs: ["opus","VP8","VP9","H264","AV1"]

    # # The most PeerConnections at once, publishers' and viewers'; one more offer is answered 503.
    # # 1024 when left out or 0.
    # # integer, 0 or more; default 1024.
    # max_peer_connections: 1024

    # # The most streams published at once; one more publisher is answered 503. 64 when left out or
    # # 0.
    # # integer, 0 or more; default 64.
    # max_streams: 64

    # # The most viewers of one stream; one more is answered 503. Each packet a publisher sends is
    # # sent again to every viewer, on the worker that received it. 256 when left out or 0.
    # # integer, 0 or more; default 256.
    # max_viewers: 256

    # # The most bits a second a publisher may send: told to it as REMB feedback, which browsers
    # # keep under, and enforced with two seconds of burst, past which its packets are dropped.
    # # 8000000 when left out or 0.
    # # integer, 0 or more; default 8000000.
    # max_bitrate: 8000000

    # # The largest offer taken; a larger one is answered 413. 32 KiB when left out or 0.
    # # integer, 0 or more; default 32768.
    # max_sdp_bytes: 32768

    # # How long a session may take from its answer to a connected PeerConnection before it is
    # # ended. 30s when left out.
    # # duration, as "1.5s" or "2m"; default "30s".
    # connect_timeout: "30s"

    # # How long a connected peer may be silent, its media and ICE consent checks alike, before its
    # # session is ended: a publisher's ends its stream and its viewers. 30s when left out.
    # # duration, as "1.5s" or "2m"; default "30s".
    # ice_timeout: "30s"

    # # The least time between two key frame requests (PLI) passed to a publisher, for the viewers
    # # that join or lose packets: the rest are dropped. 500ms when left out.
    # # duration, as "1.5s" or "2m"; default "500ms".
    # key_frame_interval: "500ms"

  # # Put media servers behind fit: the UDP port the webrtc_proxy handler's answers name, which
  # # relays each peer to the media server that answered it, found by the ICE ufrag of the peer's
  # # first STUN request. Routes with webrtc_proxy handlers answer 503 without it. None when left
  # # out.
  # # object.
  # proxy:
    # # The UDP address peers reach the media servers behind fit at, one port for them all, as in
    # # ":8190": the proxied answers name it as their only candidate. A wildcard host advertises the
    # # address of every interface that is up, unless public_ips is set. A change ends every relay
    # # and session.
    # # string; required.
    # listen: ""

    # # The addresses peers are told to reach the port at, with its port, instead of the interfaces'
    # # own: a server behind a 1:1 NAT. Applies to the next answer.
    # # list of string.
    # public_ips: []

    # # The peer addresses the port relays, deciding before the global access: the datagrams of an
    # # address it refuses are dropped. A change applies to the next new address, without ending a
    # # session or relay; the addresses relayed are kept.
    # # object.
    # access:
      # # IP addresses and CIDR prefixes served, as "10.0.0.0/8" or "2001:db8::/32": with any entry
      # # here or in allow_files, every address neither holds is refused, unless deny refuses it
      # # first.
      # # list of string.
      # allow: ["*.example.com", "10.1.0.0/16"]

      # # IP addresses and CIDR prefixes refused, whatever allow holds.
      # # list of string.
      # deny: ["169.254.169.254"]

      # # Files of more allow entries: an address or prefix on each line, with blank lines and what
      # # follows # or ; left out, as the lists published for firewalls are written. Read when the
      # # config is applied, and applied again when one changes; each at most 64 MiB.
      # # list of string.
      # allow_files: []

      # # Files of more deny entries, written as allow_files.
      # # list of string.
      # deny_files: []

    # # The most sessions proxied at once; one more offer is answered 503 before it reaches a media
    # # server. 4096 when left out or 0.
    # # integer, 0 or more; default 4096.
    # max_sessions: 4096

    # # The most peer addresses relayed at once, each with a UDP socket of its own toward its media
    # # server; past it, a new address's STUN request is dropped. A session relays at most 8 of its
    # # peer's addresses. 4096 when left out or 0.
    # # integer, 0 or more; default 4096.
    # max_relays: 4096

    # # How long a session is kept with nothing relayed for it: from its answer until its peer's
    # # first request, and after its last relay ends. Its ufrags are forgotten then, and its URL
    # # answers 404. 30s when left out.
    # # duration, as "1.5s" or "2m"; default "30s".
    # session_timeout: "30s"

    # # How long a relayed peer address may send nothing before its relay is closed, whatever its
    # # media server sends it; ICE's consent checks, every 5 seconds or so, keep a live one open.
    # # 30s when left out.
    # # duration, as "1.5s" or "2m"; default "30s".
    # idle_timeout: "30s"

    # # The address the sockets toward the media servers leave from, one of the host's, for a
    # # firewall in front of them that admits one source address, or a host with several interfaces.
    # # Of the media servers' family: a media address of the other family is not relayed. The
    # # route's pick when left out. Applies to the next relay.
    # # string.
    # relay_ip: ""

    # # The lowest local port of the sockets toward the media servers, for a firewall in front of
    # # them that admits a range; with port_max. A port in use is skipped, and a peer address that
    # # finds the range full is dropped. Ports the kernel picks when both are left out. Applies to
    # # the next relay.
    # # integer, 0 to 65535.
    # port_min: 0

    # # The highest local port of the sockets toward the media servers; with port_min. The range
    # # bounds the relays at once, beside max_relays.
    # # integer, 0 to 65535.
    # port_max: 0

# Named policies of who may publish and play which streams, with tokens, users and keys for
# tokens fit signs: the handlers and roles that take media (whip, whep, webrtc_proxy) refer to
# one with their auth param. A handler without auth lets everyone in, as the route's
# middleware allow.
# list of object.
# media_auth:
  # -
    # # The policy's name, which the auth param of whip, whep and webrtc_proxy, and the media roles,
    # # refer to it by. Letters, digits, '_', '.' and '-'.
    # # string; required.
    # name: ""

    # # Static bearer tokens, each with the streams it may publish and play: sent as Authorization:
    # # Bearer, a token query parameter or the fit_media_token cookie.
    # # list of object.
    # tokens:
      # -
        # # What the token is called in logs, which never show the token itself: token:<name>, or token
        # # when left out.
        # # string.
        # name: ""

        # # The token, at least 16 characters. Or token_sha256, one of the two.
        # # string.
        # token: ""

        # # Instead of the token, its SHA-256 in hex, so that the config does not hold it, as sha256sum
        # # prints it for the token alone, without a newline: printf %s "$TOKEN" | sha256sum.
        # # string.
        # token_sha256: ""

        # # The streams the token may publish, by name or path, with * matching any run of characters,
        # # '/' among them, as live/* or room1-*. None when left out.
        # # list of string.
        # publish: []

        # # The streams the token may play, as publish lists them. None when left out.
        # # list of string.
        # play: []

    # # Users with a password, each with the streams they may publish and play: sent as
    # # Authorization: Basic, as user and pass query parameters where a protocol has no header
    # # (RTMP, SRT), or RTSP's Digest. They also log in to fit's media pages, which hand out tokens
    # # signed with secret.
    # # list of object.
    # users:
      # -
        # # The user's name; it may not contain a colon or a control character.
        # # string; required.
        # name: ""

        # # The user's password. A user with one can also log in with RTSP's Digest, which needs the
        # # password itself. Or password_hash, one of the two.
        # # string.
        # password: ""

        # # Instead of the password, its bcrypt hash, as fit hash-password makes it: Basic and the
        # # query's user and pass only, checked off fib's workers. A password once found right is
        # # remembered, as a keyed SHA-256, so that the next check is at once.
        # # string.
        # password_hash: "$2a$14$Zkx19XLiW6VYouLHR5NmfOFU0z2GTNmpkT/5qqR7hx4IjWJPDhjvG"

        # # The streams the user may publish, as a token's publish lists them. None when left out.
        # # list of string.
        # publish: []

        # # The streams the user may play. None when left out.
        # # list of string.
        # play: []

    # # The key, at least 16 bytes, that tokens fit issues are signed with (HMAC-SHA256): fit
    # # media-token's and the media pages' logins. Tokens are good for this policy alone, until
    # # their expiry. When left out, a random key of the process's signs the pages' logins, which a
    # # restart forgets; fit media-token needs it. Or secret_file, one of the two, or keys.
    # # string.
    # secret: ""

    # # A file holding the secret tokens are signed with, read each time the config is applied: the
    # # handler media_tokens rotates it, and every token signed before is refused. At least 16
    # # bytes, its line breaks at the end aside. Or secret, one of the two, or keys. None when left
    # # out: a random key of the process's signs, which a restart forgets.
    # # string.
    # secret_file: ""

    # # A keyring of signing keys, each a name and its secret or secret_file, in place of secret or
    # # secret_file: a token is signed with one key and checked against every key, so rotating one
    # # key, as the handler media_tokens does, refuses only the tokens that key signed and the
    # # others stay good. One of the two: keys, or secret/secret_file. None when left out.
    # # list of object.
    # keys:
      # -
        # # The key's name: 1 to 64 letters, digits, '_', '.', '~' and '-', which a media_tokens request
        # # names to sign with it, and a revoke to rotate it.
        # # string; required.
        # key: ""

        # # The key's secret, at least 16 bytes. Or secret_file, one of the two.
        # # string.
        # secret: ""

        # # A file holding the key's secret, read each time the config is applied; the handler
        # # media_tokens rotates this file to refuse just the tokens this key signed. At least 16 bytes,
        # # its line breaks at the end aside. Or secret, one of the two.
        # # string.
        # secret_file: ""

    # # The actions anyone may take without credentials, as ["play"] for streams anyone may watch
    # # and only some may publish. None when left out: every request needs credentials.
    # # list of: publish, play.
    # public: ["publish","play"]

    # # How long a token fit issues is good for, unless fit media-token's -ttl says otherwise. 12h
    # # when left out.
    # # duration, as "1.5s" or "2m"; default "12h".
    # token_ttl: "12h"

    # # Turns on playback URLs that expire: URLs signed for one viewer and one resource (an item of
    # # vod, a stream of hls or httpflv) with the policy's secret or a key of its keys, as
    # # media_tokens' /urls issues them, and checked by those handlers on every playlist, segment
    # # and subtitle, at once and without a callback. Needs secret, secret_file or keys. Off when
    # # left out.
    # # object.
    # url_signing:
      # # How long a URL media_tokens' /urls issues is good for when the request names no ttl, and at
      # # most the route's max_ttl. 10m when left out.
      # # duration, as "1.5s" or "2m"; default "10m".
      # ttl: "10m"

      # # How a URL issued for a viewer's address is bound to it: ip, to that address alone, or
      # # subnet, to its /24 for IPv4 and its /64 for IPv6, for viewers whose address changes within
      # # their network. A URL issued without an address is good from anywhere. ip when left out.
      # # one of: ip, subnet; default "ip".
      # bind_address: "ip"

      # # How long the grant a playlist hands its segments, init segments, keys and subtitles lives
      # # past the later of the URL's expiry and the item's end, played from when the playlist is
      # # fetched: so that a film does not stop halfway, nor after a pause, while the URL itself dies
      # # soon. A live stream's grant lives this long past the URL's expiry. 30m when left out.
      # # duration, as "1.5s" or "2m"; default "30m".
      # play_grace: "30m"

      # # Hands the grant on as the cookie fit_media_grant, on the resource's path and HttpOnly,
      # # rather than in the query of every URI a playlist names, for players that drop a playlist's
      # # query parameters. The URL the player starts from keeps its query. Off when left out.
      # # boolean.
      # cookie: true

      # # The most playback sessions one subject may have at once, a session being a URL's sid,
      # # playing while it fetches within session_idle; past it, on_limit says what happens. No cap
      # # when left out or 0.
      # # integer, 0 or more.
      # max_sessions: 0

      # # What a new session past max_sessions does: refuse, answered 403, or end_oldest, which ends
      # # the subject's session that started first, whose next request is answered 403. refuse when
      # # left out.
      # # one of: refuse, end_oldest; default "refuse".
      # on_limit: "refuse"

      # # How long a session may go without a request and still count as playing. 2m when left out.
      # # duration, as "1.5s" or "2m"; default "2m".
      # session_idle: "2m"

      # # The most sessions the policy keeps track of, of all its subjects; a new session past it is
      # # answered 503. 100000 when left out or 0.
      # # integer, 0 or more; default 100000.
      # max_tracked_sessions: 100000

      # # The origins of the pages that may play the URLs, as https://www.example.com or
      # # https://*.example.com, * matching any run of characters, matched against the origin of a
      # # request's Referer: a request with another Referer is answered 403, one without any let
      # # through. Any when left out.
      # # list of string.
      # referers: []

      # # The origins whose scripts may fetch the URLs, as referers lists them, matched against a
      # # request's Origin: a request with another Origin is answered 403, one without any let
      # # through. Any when left out.
      # # list of string.
      # origins: []

      # # The addresses ("10.0.0.1") and networks ("10.0.0.0/8") of proxies in front of fit, whose
      # # X-Forwarded-For is believed when a URL bound to an address is checked: the viewer is the
      # # last address in it that is not one of them. None when left out: the viewer is the
      # # connection's peer.
      # # list of string.
      # trusted_proxies: ["10.0.0.0/8"]

# fit's streaming role, beside the gateway on its engine: one media hub where a stream is
# published once, over RTMP, RTSP, SRT or WHIP, and played over any of them, HTTP-FLV and HLS
# too, each listener and handler with its media_auth policy. None when left out.
# object.
# streaming:
  # # The most streams at once, each a path with a publisher or players waiting for one; one more
  # # publisher is refused. 64 when left out or 0. A change of max_streams, max_players or
  # # gop_cache_bytes starts the hub again, ending every stream and connection.
  # # integer, 0 or more; default 64.
  # max_streams: 64

  # # The most players of one stream at once, over every protocol, HLS counting once a stream and
  # # format; one more is refused. Each packet a publisher sends is handed to every player on the
  # # worker that received it. 256 when left out or 0.
  # # integer, 0 or more; default 256.
  # max_players: 256

  # # The bytes each stream keeps of its latest group of pictures, from its last key frame on, so
  # # that a new player starts at once with a picture; a group that outgrows it is dropped and
  # # caching starts again at the next key frame. 8 MiB when left out or 0.
  # # integer, 0 or more; default 8388608.
  # gop_cache_bytes: 8388608

  # # Take and play streams over RTMP, as rtmp://host/app/stream: OBS and ffmpeg publish, players
  # # play. None when left out.
  # # object.
  # rtmp:
    # # The TCP address RTMP clients connect to, as in ":1935". A change of any field but auth
    # # starts the listener again, closing its connections.
    # # string; required.
    # listen: ""

    # # Listen the RTMP connections with Multipath TCP where the kernel offers it (Linux 5.6+,
    # # net.mptcp.enabled), falling back to plain TCP where it does not. Off by default.
    # # boolean.
    # mptcp: true

    # # The media_auth policy a publish and a play must satisfy, by the stream's path, app/stream:
    # # credentials go in the query of the stream name or the app, as rtmp://host/live/cam?token=T
    # # or ?user=U&pass=P. A refusal is answered with NetStream.Publish.Unauthorized or
    # # NetStream.Play.Failed and the connection closed. Everyone may publish and play when left
    # # out. A change applies to the next publish and play.
    # # string.
    # auth: ""

    # # The most connections at once; one more is closed as it opens. 1024 when left out or 0.
    # # integer, 0 or more; default 1024.
    # max_conns: 1024

    # # How long a client may take from connecting to publishing or playing. 10s when left out.
    # # duration, as "1.5s" or "2m"; default "10s".
    # handshake_timeout: "10s"

    # # How long a publisher may send nothing, and a player's output not move, before its connection
    # # is closed. 30s when left out.
    # # duration, as "1.5s" or "2m"; default "30s".
    # idle_timeout: "30s"

    # # How long a player may wait for a stream with no publisher yet, or for the next one after its
    # # publisher leaves. A play of a stream without a publisher fails at once when left out.
    # # duration, as "1.5s" or "2m".
    # play_wait: "10s"

    # # The largest RTMP message a client may send, a video frame among them; a larger one closes
    # # its connection. 8 MiB when left out or 0.
    # # integer, 0 or more; default 8388608.
    # max_message_bytes: 8388608

  # # Take and play streams over RTSP 1.0 with interleaved RTP (RTP/AVP/TCP), as
  # # rtsp://host/app/stream. None when left out.
  # # object.
  # rtsp:
    # # The TCP address RTSP clients connect to, as in ":8554". RTP goes interleaved on the same
    # # connection (RTP/AVP/TCP); a SETUP asking for UDP is answered 461, which ffmpeg and most
    # # players then retry over TCP. A change of any field but auth starts the listener again,
    # # closing its connections.
    # # string; required.
    # listen: ""

    # # Listen the RTSP connections with Multipath TCP where the kernel offers it (Linux 5.6+,
    # # net.mptcp.enabled), falling back to plain TCP where it does not. Off by default.
    # # boolean.
    # mptcp: true

    # # The media_auth policy RTSP requests must satisfy, by the stream's path: ANNOUNCE publish and
    # # DESCRIBE play on the stream their URL names, RECORD publish and PLAY play on the stream of
    # # the connection's session (one whose URL names another stream is refused with 455), and a
    # # SETUP play on its stream, or once a session is set up, play or publish on the session's.
    # # Credentials are a user with a plaintext password by Digest, a user by Basic when
    # # auth_methods offers it, or a token in the URL's query, as rtsp://host/live/cam?token=T. A
    # # refusal is 401 with the challenges, or 403. Everyone may publish and play when left out. A
    # # change applies to the next request.
    # # string.
    # auth: ""

    # # The schemes a 401 offers for users: digest, which needs a user's plaintext password, and
    # # basic, which sends the password in the clear and is the only one a password_hash user can
    # # use. ["digest"] when left out.
    # # list of: digest, basic.
    # auth_methods: ["digest","basic"]

    # # The realm of the challenges, which Digest's response is computed with. fit when left out.
    # # string; default "fit".
    # realm: "fit"

    # # The most connections at once; one more is closed as it opens. 1024 when left out or 0.
    # # integer, 0 or more; default 1024.
    # max_conns: 1024

    # # How long a session may go without a request, RTCP or, while recording, RTP before it and its
    # # connection end; clients are told so in the Session header and send keep-alives. 60s when
    # # left out.
    # # duration, as "1.5s" or "2m"; default "60s".
    # session_timeout: "60s"

    # # How long a connection without a session may go without a request before it is closed. 60s
    # # when left out.
    # # duration, as "1.5s" or "2m"; default "60s".
    # idle_timeout: "60s"

    # # How long a player may outlive its stream's publisher, waiting for the next one. A player
    # # ends with its publisher when left out.
    # # duration, as "1.5s" or "2m".
    # play_wait: "10s"

  # # Take and play streams over SRT, MPEG-TS on UDP, the stream named by the caller's stream ID.
  # # None when left out.
  # # object.
  # srt:
    # # The UDP address SRT callers reach, as in ":8890". A change of any field but auth starts the
    # # listener again, ending its sessions.
    # # string; required.
    # listen: ""

    # # The media_auth policy a caller must satisfy, publish for m=publish and play otherwise, by
    # # the stream ID's resource: a token as s= (#!::r=live/cam,m=publish,s=T), a user and password
    # # as u= and s=, or token, or user and pass, in the resource's query (live/cam?token=T). A
    # # refusal rejects the handshake with 1401 (unauthorized) or 1403 (forbidden). Everyone may
    # # publish and play when left out. A change applies to the next caller.
    # # string.
    # auth: ""

    # # The most sessions at once; one more caller is rejected with 1402. 1024 when left out or 0.
    # # integer, 0 or more; default 1024.
    # max_conns: 1024

    # # The receive latency asked for, the time a packet may take to be sent again when lost; the
    # # caller's wins when larger. 120ms when left out.
    # # duration, as "1.5s" or "2m"; default "120ms".
    # latency: "120ms"

    # # Encrypt every session with this passphrase, 10 to 79 characters, which callers must have too
    # # (pbkeylen 16). Unencrypted when left out.
    # # string.
    # passphrase: ""

    # # How long a peer may send nothing, keep-alives included, before its session ends. 5s when
    # # left out.
    # # duration, as "1.5s" or "2m"; default "5s".
    # peer_idle_timeout: "5s"

    # # How long a player may wait for a stream with no publisher yet, or for the next one after its
    # # publisher leaves. A caller playing a stream without a publisher is rejected with 1404 when
    # # left out.
    # # duration, as "1.5s" or "2m".
    # play_wait: "10s"

  # # The UDP port the PeerConnections of the stream_whip and stream_whep handlers share, which
  # # publish into the hub with WHIP and play from it with WHEP. Routes with those handlers answer
  # # 503 without it. None when left out.
  # # object.
  # webrtc:
    # # The UDP address every peer's media reaches fit at, one port all the role's PeerConnections
    # # share, as in ":8188"; not webrtc.media's. A wildcard host advertises every interface's
    # # address that is up, unless public_ips is set. A change of any field starts it again, ending
    # # its sessions.
    # # string; required.
    # listen: ""

    # # The addresses peers are told to reach the port at instead of the interfaces' own, as behind
    # # a 1:1 NAT.
    # # list of string.
    # public_ips: []

    # # STUN and TURN servers the peers are told of in Link headers (RFC 9725), for their side of
    # # ICE; fit's is an ICE lite agent on its own address.
    # # list of object.
    # ice_servers:
      # -
        # # The server's stun:, stuns:, turn: or turns: URLs.
        # # list of string; required.
        # urls: []

        # # A TURN server's username.
        # # string.
        # username: "fit"

        # # A TURN server's password.
        # # string.
        # credential: ""

    # # The most WHIP and WHEP sessions at once; one more offer is answered 503. 256 when left out
    # # or 0.
    # # integer, 0 or more; default 256.
    # max_sessions: 256

    # # How long a session may take from its answer to a connected PeerConnection before it is
    # # ended; once connected, ICE consent bounds it. 15s when left out.
    # # duration, as "1.5s" or "2m"; default "15s".
    # connect_timeout: "15s"

    # # How long a WHEP offer may wait for a stream with no publisher yet, its request held, before
    # # it is answered 404. Answered 404 at once when left out.
    # # duration, as "1.5s" or "2m".
    # play_wait: "10s"

    # # The largest offer taken; a larger one is answered 400. At most 64 KiB. 32 KiB when left out
    # # or 0.
    # # integer, 0 to 65536; default 32768.
    # max_offer_bytes: 32768

  # # The client addresses the rtmp, rtsp, srt and webrtc listeners serve, deciding before the
  # # global access: a connection it refuses is closed as soon as it is accepted, and the
  # # datagrams of an srt caller or webrtc peer it refuses are dropped. A change applies to the
  # # next connection and peer, without starting a listener again; those connected are kept.
  # # object.
  # access:
    # # IP addresses and CIDR prefixes served, as "10.0.0.0/8" or "2001:db8::/32": with any entry
    # # here or in allow_files, every address neither holds is refused, unless deny refuses it
    # # first.
    # # list of string.
    # allow: ["*.example.com", "10.1.0.0/16"]

    # # IP addresses and CIDR prefixes refused, whatever allow holds.
    # # list of string.
    # deny: ["169.254.169.254"]

    # # Files of more allow entries: an address or prefix on each line, with blank lines and what
    # # follows # or ; left out, as the lists published for firewalls are written. Read when the
    # # config is applied, and applied again when one changes; each at most 64 MiB.
    # # list of string.
    # allow_files: []

    # # Files of more deny entries, written as allow_files.
    # # list of string.
    # deny_files: []

  # # Channels: items of a media_library played into the hub as live streams, in order, shuffled,
  # # looped or on a schedule, paced by their timestamps, which run on from one item to the next;
  # # every egress plays them under its auth. A reload changes a channel in place, from its next
  # # item. At most 256. None when left out.
  # # list of object.
  # channels:
    # -
      # # The stream the channel publishes into the hub, as tv/films: every egress of the streaming
      # # role plays it by that path, under its auth, as rtmp://host/tv/films or
      # # /hls/tv/films/index.m3u8. Parts of letters, digits, '.', '_', '~' and '-', split at '/'. A
      # # channel renamed is another channel: the old one ends.
      # # string; required.
      # name: ""

      # # The media_library the channel's items are of.
      # # string; required.
      # library: ""

      # # The IDs of the library's items the channel plays, in this order unless order is shuffle, and
      # # again from the first when loop is on; between the schedule's slots too. An item the library
      # # does not hold, or cannot serve, is skipped. At most 10000.
      # # list of string.
      # items: []

      # # The order items are played in: sequence, as listed, or shuffle, every item once in a random
      # # order each time round. sequence when left out.
      # # one of: sequence, shuffle; default "sequence".
      # order: "sequence"

      # # Play items again from the first once the last has played. With loop off, the channel goes
      # # quiet after the last, staying published, until its next slot, or until the Admin API stops
      # # and starts it, which plays the list again from the first. On when left out.
      # # boolean; default true.
      # loop: true

      # # Items started at set times, in time_zone, cutting what plays: daily, on days of the week, or
      # # once. A slot whose time has passed while its item would still be playing, when the channel
      # # starts, is joined where it would be. Between slots the channel plays items, or goes quiet
      # # without them. At most 1000.
      # # list of object.
      # schedule:
        # -
          # # When the slot starts, in the channel's time_zone: HH:MM or HH:MM:SS every day; days of the
          # # week before it, as mon,wed,fri 20:00 or sat-sun 09:30; or a date, as 2026-12-31 23:00, once.
          # # string; required.
          # at: ""

          # # The ID of the library's item the slot plays, from its start.
          # # string; required.
          # item: ""

      # # The IANA time zone the schedule's times are in, as Asia/Shanghai or Local for the host's.
      # # UTC when left out.
      # # string; default "UTC".
      # time_zone: "UTC"

      # # The rendition played of each item, by its name, as 720p; one an item lacks plays its best
      # # instead. The rendition with the most pixels, the highest bit rate among equals, when left
      # # out.
      # # string.
      # rendition: ""

      # # How much of the items is read ahead of what is sent, on the library's file pool, so that a
      # # slow disk does not stall the channel and the next item follows the last without a gap. 500ms
      # # to 1m. 3s when left out.
      # # duration, as "1.5s" or "2m"; default "3s".
      # read_ahead: "3s"

      # # The most bytes read ahead and not yet sent, whatever read_ahead says, at least 1 MiB; a
      # # sample larger than it ends its item. 16 MiB when left out or 0.
      # # integer, 0 or more; default 16777216.
      # max_buffer_bytes: 16777216

      # # Outside servers the channel is relayed to, as streaming's push names them, their stream
      # # being the channel's.
      # # list of object.
      # push:
        # -
          # # The target's name in the Admin API and the metrics, unique among the push targets. The
          # # stream's name and the target's place among the stream's when left out, as tv/films#1.
          # # string.
          # name: ""

          # # The stream of the hub relayed, as live/cam or a channel's name. Required in streaming's
          # # push; a channel's push targets relay the channel.
          # # string.
          # stream: ""

          # # Where the stream is sent: rtmp://host[:port]/app/stream, or rtmps://, publishing to an RTMP
          # # server as a CDN's ingest takes it; or
          # # srt://host:port?streamid=...&passphrase=...&latency=ms, calling an SRT listener with
          # # MPEG-TS. The URL is a secret, its stream key with it: the Admin API and the logs show its
          # # scheme, host and app alone.
          # # string; required.
          # url: ""

          # # How long the first retry waits, after a target refuses, drops or cannot be reached, or the
          # # stream is not published; each retry waits twice the last, up to retry_max, and a push that
          # # has stayed up retry_max starts again from retry_min. 1s when left out.
          # # duration, as "1.5s" or "2m"; default "1s".
          # retry_min: "1s"

          # # The longest a retry waits. 30s when left out.
          # # duration, as "1.5s" or "2m"; default "30s".
          # retry_max: "30s"

          # # How long connecting may take, the RTMP handshake and publish or the SRT handshake. 10s when
          # # left out.
          # # duration, as "1.5s" or "2m"; default "10s".
          # connect_timeout: "10s"

      # # Encrypts the channel's HLS segments with AES-128 (METHOD=AES-128), fMP4 and MPEG-TS alike,
      # # under a key derived from the library's secret, which the hls handler serves only to a
      # # request its auth lets play the channel; so that segments copied, as a CDN keeps them, do not
      # # play without it. Needs the library's secret or secret_file. Low-Latency HLS parts are
      # # encrypted too, each on its own. The other egresses play the channel as before, under their
      # # auth. Off when left out.
      # # boolean.
      # encrypt: true

      # # With encrypt, how many segments one key encrypts before the next takes over, so that a key
      # # handed out opens a few segments only. 10 when left out or 0.
      # # integer, 0 to 100000; default 10.
      # key_rotation: 10

  # # Outside RTMP or SRT servers, as a CDN's ingest, that streams of the hub are relayed to, each
  # # reconnected with backoff when it drops; a channel's own push lists its own. A reload keeps a
  # # target whose stream and url are unchanged connected. At most 256 in all. None when left out.
  # # list of object.
  # push:
    # -
      # # The target's name in the Admin API and the metrics, unique among the push targets. The
      # # stream's name and the target's place among the stream's when left out, as tv/films#1.
      # # string.
      # name: ""

      # # The stream of the hub relayed, as live/cam or a channel's name. Required in streaming's
      # # push; a channel's push targets relay the channel.
      # # string.
      # stream: ""

      # # Where the stream is sent: rtmp://host[:port]/app/stream, or rtmps://, publishing to an RTMP
      # # server as a CDN's ingest takes it; or
      # # srt://host:port?streamid=...&passphrase=...&latency=ms, calling an SRT listener with
      # # MPEG-TS. The URL is a secret, its stream key with it: the Admin API and the logs show its
      # # scheme, host and app alone.
      # # string; required.
      # url: ""

      # # How long the first retry waits, after a target refuses, drops or cannot be reached, or the
      # # stream is not published; each retry waits twice the last, up to retry_max, and a push that
      # # has stayed up retry_max starts again from retry_min. 1s when left out.
      # # duration, as "1.5s" or "2m"; default "1s".
      # retry_min: "1s"

      # # The longest a retry waits. 30s when left out.
      # # duration, as "1.5s" or "2m"; default "30s".
      # retry_max: "30s"

      # # How long connecting may take, the RTMP handshake and publish or the SRT handshake. 10s when
      # # left out.
      # # duration, as "1.5s" or "2m"; default "10s".
      # connect_timeout: "10s"

# Named libraries of media files: directories scanned into a catalog of items, each a title
# with its renditions, audio, subtitles and poster, probed off fib's workers on a bounded file
# pool of the library's own, and read by the Admin API's /media/library. None when left out:
# no files are scanned or served.
# list of object.
# media_library:
  # -
    # # The library's name, which handlers and the Admin API's /media/library/<name> refer to it by.
    # # Letters, digits, '_', '.' and '-'.
    # # string; required.
    # name: ""

    # # The directories whose files the library holds, scanned with their subdirectories; an item's
    # # id is its path under its root. A root may not lie inside another. A root missing when
    # # scanned is reported, and the others are scanned.
    # # list of string; required.
    # roots: []

    # # The files looked at, by pattern: a pattern without '/' matches a file's name, as *.mp4, and
    # # one with '/' its path under the root, as films/**/*.mp4, where * matches within a name and
    # # ** any run of directories. Every file when left out; names starting with '.' are never
    # # looked at.
    # # list of string.
    # files: []

    # # Files and directories left out, by pattern, as files writes them, as trailers or
    # # **/extras/**; a directory left out is not walked. None when left out.
    # # list of string.
    # exclude: []

    # # Follow symbolic links that lead out of the library's roots. A link that stays within its
    # # root is followed either way; one that leads out is refused, and reported, when left out or
    # # false.
    # # boolean.
    # follow_symlinks: true

    # # How often the roots are scanned again, at least 10s; a scan also runs when the library is
    # # made, when the config changes its roots, patterns or bounds, and on the Admin API's POST
    # # /media/library/<name>/rescan. A file whose size and time are unchanged is not probed again.
    # # 10m when left out.
    # # duration, as "1.5s" or "2m"; default "10m".
    # scan_interval: "10m"

    # # The most items the catalog holds; past it the rest are left out, and the scan says so. 20000
    # # when left out or 0.
    # # integer, 0 or more; default 20000.
    # max_items: 20000

    # # The most files and directories a scan looks at, across the roots; past it the scan stops
    # # there, and says so. 200000 when left out or 0.
    # # integer, 0 or more; default 200000.
    # max_files: 200000

    # # The most memory the catalog takes, as reckoned from its items' paths, titles, tracks and
    # # codec configurations; past it the rest of the items are left out, and the scan says so. 64
    # # MiB when left out or 0.
    # # integer, 0 or more; default 67108864.
    # max_catalog_bytes: 67108864

    # # The most files probed at once on the library's file pool, so that a scan leaves the pool's
    # # other workers to the files being served. 4 when left out or 0.
    # # integer, 0 or more; default 4.
    # max_probes: 4

    # # The largest sidecar, <name>.json, read; a larger one is reported and left out. At most 1
    # # MiB. 64 KiB when left out or 0.
    # # integer, 0 to 1048576; default 65536.
    # max_sidecar_bytes: 65536

    # # The largest subtitle file served, .vtt or .srt turned into WebVTT; a larger one is listed
    # # with its error and not served. 2 MiB when left out or 0.
    # # integer, 0 or more; default 2097152.
    # max_subtitle_bytes: 2097152

    # # The most memory the sample tables read from the files take, kept for the files being served;
    # # past it the least recently used are dropped, and a table larger than all of it is refused.
    # # 128 MiB when left out or 0.
    # # integer, 0 or more; default 134217728.
    # max_table_bytes: 134217728

    # # The goroutines of the library's file pool, which probe, read sample tables and read the
    # # files' bytes, so that no fib worker waits on the disk: all the disk is asked to do at once.
    # # 4 a CPU, and at least 16, when left out or 0.
    # # integer, 0 or more.
    # file_workers: 0

    # # The most jobs that wait for the file pool; one more is refused, as a request answered 503.
    # # 4096 when left out or 0.
    # # integer, 0 or more; default 4096.
    # file_queue: 4096

    # # How long a job may wait for the file pool before it is given up, as a request answered 503.
    # # 10s when left out.
    # # duration, as "1.5s" or "2m"; default "10s".
    # file_timeout: "10s"

    # # The secret, at least 16 bytes, the AES-128 keys of encrypted HLS are derived from: a key for
    # # each item of vod with encrypt, and for each channel with encrypt, rotated every key_rotation
    # # segments. Changing it changes every key, so that segments encrypted before, kept by a CDN,
    # # no longer play: purge them. Or secret_file, one of the two. None when left out: nothing of
    # # the library can be encrypted.
    # # string.
    # secret: ""

    # # A file holding the secret the AES-128 keys of encrypted HLS are derived from, read each time
    # # the config is applied. At least 16 bytes, its line breaks at the end aside. Or secret, one
    # # of the two. None when left out.
    # # string.
    # secret_file: ""

    # # A directory inside one of the roots, or a root itself, that files uploaded from the
    # # workbench, or the Admin API's /media/library/<name>/uploads, are written into: in pieces,
    # # resumable after a cut connection, to a temporary file named .fit-upload-*, renamed into
    # # place once whole and probed by the scan that follows. Made when missing. None when left out:
    # # no uploads; the files of the library are still renamed, moved and deleted from the
    # # workbench.
    # # string.
    # upload_dir: ""

    # # The largest file uploaded; a larger one is refused 413 before any of it is written. 32 GiB
    # # when left out or 0.
    # # integer, 0 or more; default 34359738368.
    # max_upload_bytes: 34359738368

    # # The most uploads under way at once, begun and not yet whole; one more is refused 429 until
    # # one ends, or is cancelled, or expires. 4 when left out or 0.
    # # integer, 0 to 1024; default 4.
    # max_uploads: 4

    # # The disk space left free beside the uploads under way: an upload whose bytes, with those of
    # # the others still to come, would leave less free on upload_dir's disk is refused 507 before
    # # any of it is written. 1 GiB when left out or 0.
    # # integer, 0 or more; default 1073741824.
    # min_free_bytes: 1073741824

    # # How long an upload not written to is kept before it is given up and its temporary file
    # # removed, at the next scan; at least 1m. An upload is kept across restarts until then. 24h
    # # when left out.
    # # duration, as "1.5s" or "2m"; default "24h".
    # upload_expiry: "24h"
