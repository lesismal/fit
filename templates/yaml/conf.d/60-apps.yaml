        # # How long a link's dial may take. 5s when left out.
        # # duration, as "1.5s" or "2m"; default "5s".
        # dial_timeout: "5s"

        # # How long the hub may take to answer a registration or a call. 10s when left out.
        # # duration, as "1.5s" or "2m"; default "10s".
