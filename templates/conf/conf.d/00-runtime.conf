# fit's config template as a directory: every field of the config and of every module's
# params, in files by kind. Generated by schema.TemplateDir; regenerate with:
# go test ./schema -update
#
# fit run -c <this directory> reads every file in it, its subdirectories too, in lexical
# order. listeners, routes, upstreams, services and providers are joined across the files;
# any other field is written in one file only. What is written out runs as it is: a
# listener on :8080, example.com answering "hello from fit", and api.example.com proxied
# to 127.0.0.1:9000. Every other field is commented out, with its default or an example:
# uncomment what you need. docs/reference/config.md describes them all.
#
# This file:
# How fit runs on this host: the limits that bound what clients can make it hold (the
# bytes waiting for slow clients, the backpressure across every connection, header and
# body sizes, connections, the write stall timeout), and fib's engine (event loops,
# workers, buffers, the backpressure of one connection). An upstream's own timeouts are
# in its site's file.

# The version of fit's config this one is written for, 1; fit refuses a config written for a
# version it does not read, rather than read it wrongly. Optional: a config that leaves it out
# is read as version 1.
# integer, 1.
schema_version 1

# Limits that apply to every listener.
# object.
# limits {
	# # How many bytes of responses may wait, across every connection, for clients to take them, the
	# # backpressure on them all; past it, every connection stops reading until some go. A number of
	# # bytes, or a share of the memory fit may use, such as "25%": the machine's, or the
	# # container's memory limit where that is lower. Takes effect at start, not on a reload. "50%"
	# # when left out or 0; 256 MiB where the memory cannot be read.
	# # bytes, an integer, or a share of memory, as "50%"; default "50%".
	# max_pending_bytes 50%

	# # The largest request header a listener takes; a larger one gets 431. 1 MiB when left out or
	# # 0.
	# # integer, 0 or more; default 1048576.
	# max_header_bytes 1048576

	# # The most client connections the listeners keep open at once, across all of them; one past it
	# # is closed as soon as it is accepted. Takes effect at start, not on a reload. 100000 when
	# # left out or 0.
	# # integer, 0 or more; default 100000.
	# max_conns 100000

	# # The largest request body a listener takes, whether it arrives whole or streams through; a
	# # larger one gets 413, or, once it has begun to stream, its connection or stream is ended. 16
	# # MiB when left out or 0.
	# # integer, 0 or more; default 16777216.
	# max_body_bytes 16777216

	# # The bytes one connection may have queued for its client before fit closes it, the bound on a
	# # peer that stops reading. 32 MiB when left out or 0. Takes effect at start, not on a reload.
	# # integer, 0 or more; default 33554432.
	# max_write_queue_bytes 33554432

	# # How long a response may wait for its client to take what it was sent, each time it waits,
	# # before the client loses it: its HTTP/1 connection closed, its HTTP/2 or HTTP/3 stream reset.
	# # A client that keeps reading, however slowly, is not cut off, and nor is a response that has
	# # nothing to send. 30s when left out.
	# # duration, as "1.5s" or "2m"; default "30s".
	# write_stall_timeout 30s
# }

# How fib, the network engine fit serves and dials on, is set up: its event loops, workers and
# buffers. fib's own defaults for what is left out, and for all of it when engine is. Read
# when fit starts: a change takes effect when fit restarts.
# object.
# engine {
	# # How many event loops each engine waits for its connections' events on, which spread the
	# # waits, accepts and wake-ups over cores; the connections' work runs on the workers either
	# # way. fib's default when left out or 0: 1 on up to 4 CPUs, 2 on up to 16, and the CPUs
	# # divided by 8 on more. Windows has one loop whatever this says.
	# # integer, 0 to 1024.
	# event_loops 0

	# # The most workers each engine's pool runs connections' reads and callbacks on at once. fib's
	# # default, which follows the CPUs, when left out or 0.
	# # integer, 0 or more.
	# workers 0

	# # How many workers an idle pool keeps, rather than retiring every one and starting them again
	# # when work arrives. None when left out or 0.
	# # integer, 0 or more.
	# min_workers 0

	# # How many tasks each engine's pool holds waiting for a worker. fib's default, which follows
	# # its workers, when left out or 0.
	# # integer, 0 or more.
	# task_queue 0

	# # The most events one wait of an event loop collects; the rest wait for the next. 1024 when
	# # left out or 0.
	# # integer, 0 or more.
	# poll_batch 0

	# # The bytes a connection reads its socket into at a time, which is also the most a proxied
	# # body is passed on in one write. 64 KiB when left out or 0.
	# # integer, 0 to 67108864.
	# read_buffer_size 0

	# # The bytes a connection may have waiting to be written before it stops reading until they
	# # drain, the backpressure on one connection; limits.max_pending_bytes bounds them all
	# # together. When left out or 0, fib sizes it from read_buffer_size and the machine: four read
	# # buffers, at least 64 KiB and at most 256 KiB, so 256 KiB at the default 64 KiB read buffer
	# # on a machine with enough memory.
	# # integer, 0 or more.
	# write_watermark 0

	# # The length of each listening socket's queue of connections not yet accepted. The system's
	# # when left out or 0.
	# # integer, 0 or more.
	# backlog 0
# }
