# fit's config template as a directory: every field of the config and of every module's
# params, in files by kind. Generated by schema.TemplateDir; regenerate with:
# go test ./schema -update
#
# fit run -c <this directory> reads every file in it, its subdirectories too, in lexical
# order. listeners, routes, upstreams, services and providers are joined across the files;
# any other field is written in one file only. What is written out runs as it is: a
# listener on :8080, example.com answering "hello from fit", and api.example.com proxied
# to 127.0.0.1:9000. Every other field is commented out, with its default or an example:
# uncomment what you need. docs/reference/config.md describes them all.
#
# This file:
# Routes, upstreams, services and listeners from Docker, Consul, etcd and Kubernetes.

# Sources of routes, upstreams, services and listeners other than this file and the Admin API,
# merged into the config: what this config writes wins over every provider, and a provider
# over those listed after it; a provider's element named as one before it is left out. The
# Admin API's /config/effective shows the result and where each part came from. Read when fit
# starts: a change takes effect when fit restarts.
# list of object.
# provider {
	# # The name the provider goes by in the Admin API's /config/effective and in logs: lower-case
	# # letters, digits, '_', '.' and '-', unique among the providers. Its kind, as docker, when
	# # left out.
	# # string.
	# name docker

	# # Routes, upstreams and services from the labels of running Docker containers.
	# # object.
	# docker {
		# # Where the Docker daemon's API is: unix:// and a socket's path, or tcp:// and a host and
		# # port, as of a socket proxy, in plain HTTP. unix:///var/run/docker.sock when left out.
		# # string; default "unix:///var/run/docker.sock".
		# endpoint unix:///var/run/docker.sock

		# # Take every running container with routes or services in its labels; only those labelled
		# # <label_prefix>.enable=true when left out or false. A container labelled
		# # <label_prefix>.enable=false is never taken.
		# # boolean.
		# expose_all true

		# # The Docker network whose address of a container's is used, when the container is on several
		# # and has no <label_prefix>.network label; the first by name when left out.
		# # string.
		# network web

		# # Send to the port a container's port is published on, on the host, rather than to the
		# # container's own address: for a fit outside Docker that cannot reach containers' addresses,
		# # as on Docker Desktop.
		# # boolean.
		# use_published_ports true

		# # What the labels read start with, as in fit.routes.web.host. fit when left out.
		# # string; default "fit".
		# label_prefix fit

		# # The most containers taken; past it, the rest, by name, are left out and reported. 1000 when
		# # left out or 0.
		# # integer, 0 or more; default 1000.
		# max_containers 1000

		# # How often the containers are listed again whether or not an event came, in case one was
		# # missed. 30s when left out.
		# # duration, as "1.5s" or "2m"; default "30s".
		# refresh_interval 30s

		# # How long listing the containers may take, connecting included. 10s when left out.
		# # duration, as "1.5s" or "2m"; default "10s".
		# request_timeout 10s

		# # The host names the routes labels write may match: exact, as admin.example.com, or "*." and a
		# # domain, for any name below it, as *.apps.example.com; "*" for any host, and routes that
		# # match every host. A route that matches another host, or none, is left out and reported. None
		# # when left out, so that no route labels write is served until the names they may claim are
		# # listed: whoever can start a container, or build its image, writes them, and would otherwise
		# # take any host, the operator's own among them.
		# # list of string.
		# allowed_hosts

		# # Handlers and middleware, by name, that the routes labels write may use besides those they
		# # may by default: the proxy handler, to their own upstream alone, and the middleware headers,
		# # rewrite, redirect, compress, rate_limit, concurrency_limit, body_limit, basic_auth and
		# # circuit_breaker. A module named here may be used with any params, the proxy to any upstream
		# # among them; a route using another module is left out and reported.
		# # list of string.
		# allowed_modules

		# # The highest priority a route labels write may have; one with a higher priority is left out
		# # and reported. 0 when left out, so that a route of the config's with a priority above 0
		# # always wins over them.
		# # integer.
		# max_priority 0

		# # Take containers whose address is a loopback, link-local or unspecified one, as that of every
		# # container on the host's network is (the host's loopback, at the port its labels name). They
		# # are left out and reported when left out or false, since fit's Admin API and the host's other
		# # local services listen there. A port published on the host, with use_published_ports, is
		# # taken either way: Docker publishes it for the container.
		# # boolean.
		# allow_local_addresses true
	# }

	# # Routes, upstreams and services from the tags of the services in a Consul catalog, sending to
	# # their instances whose health checks pass.
	# # object.
	# consul {
		# # Where Consul's HTTP API is, as of the local agent: http:// or https:// and a host and port.
		# # http://127.0.0.1:8500 when left out.
		# # string; default "http://127.0.0.1:8500".
		# endpoint http://127.0.0.1:8500

		# # The datacenter whose catalog is read; the agent's when left out.
		# # string.
		# datacenter dc1

		# # A file holding the ACL token to send, read each time a watch starts; none when left out. The
		# # token needs to read the services and nodes served.
		# # string.
		# token_file /etc/fit/token

		# # A PEM file with the CAs Consul's certificate is verified with, over https; the system's when
		# # left out.
		# # string.
		# ca_file /etc/fit/ca.pem

		# # A PEM file with the client certificate sent over https, as Consul's verify_incoming asks
		# # for; with key_file.
		# # string.
		# cert_file /etc/fit/example.com.pem

		# # A PEM file with cert_file's private key.
		# # string.
		# key_file /etc/fit/example.com.key

		# # Take every service in the catalog; only those tagged <tag_prefix>.enable=true when left out
		# # or false. An instance tagged <tag_prefix>.enable=false is never taken.
		# # boolean.
		# expose_all true

		# # What the tags read start with, as in fit.routes.web.host=example.com; tags without '=' are
		# # passed over. Besides the routes, services and upstream settings a Docker container's labels
		# # may set, <tag_prefix>.name names the upstream, the service's name when left out. fit when
		# # left out.
		# # string; default "fit".
		# tag_prefix fit

		# # The most services taken; past it, the rest, by name, are left out and reported. 1000 when
		# # left out or 0.
		# # integer, 0 or more; default 1000.
		# max_services 1000

		# # How often the catalog is read again whether or not it changed. 30s when left out.
		# # duration, as "1.5s" or "2m"; default "30s".
		# refresh_interval 30s

		# # How long each request to Consul may take, connecting included, beyond the five minutes a
		# # blocking query waits for a change. 10s when left out.
		# # duration, as "1.5s" or "2m"; default "10s".
		# request_timeout 10s

		# # The host names the routes tags write may match: exact, as admin.example.com, or "*." and a
		# # domain, for any name below it, as *.apps.example.com; "*" for any host, and routes that
		# # match every host. A route that matches another host, or none, is left out and reported. None
		# # when left out, so that no route tags write is served until the names they may claim are
		# # listed: whoever can register a service writes them, and would otherwise take any host, the
		# # operator's own among them.
		# # list of string.
		# allowed_hosts

		# # Handlers and middleware, by name, that the routes tags write may use besides those they may
		# # by default: the proxy handler, to their own upstream alone, and the middleware headers,
		# # rewrite, redirect, compress, rate_limit, concurrency_limit, body_limit, basic_auth and
		# # circuit_breaker. A module named here may be used with any params, the proxy to any upstream
		# # among them; a route using another module is left out and reported.
		# # list of string.
		# allowed_modules

		# # The highest priority a route tags write may have; one with a higher priority is left out and
		# # reported. 0 when left out, so that a route of the config's with a priority above 0 always
		# # wins over them.
		# # integer.
		# max_priority 0

		# # Take instances whose address (or, when they have none, their node's) is localhost, or a
		# # loopback, link-local or unspecified address. They are left out and reported when left out or
		# # false, since fit's Admin API and the host's other local services listen there, and cloud
		# # metadata services on link-local addresses. A host name is not resolved to be checked: one
		# # that resolves to such an address is not caught.
		# # boolean.
		# allow_local_addresses true
	# }

	# # Listeners, routes, upstreams and services from the keys under a prefix in Consul's KV store,
	# # each holding a JSON object of them.
	# # object.
	# consul_kv {
		# # Where Consul's HTTP API is, as of the local agent: http:// or https:// and a host and port.
		# # http://127.0.0.1:8500 when left out.
		# # string; default "http://127.0.0.1:8500".
		# endpoint http://127.0.0.1:8500

		# # The datacenter whose KV store is read; the agent's when left out.
		# # string.
		# datacenter dc1

		# # A file holding the ACL token to send, read each time a watch starts; none when left out. The
		# # token needs to read the keys under prefix.
		# # string.
		# token_file /etc/fit/token

		# # A PEM file with the CAs Consul's certificate is verified with, over https; the system's when
		# # left out.
		# # string.
		# ca_file /etc/fit/ca.pem

		# # A PEM file with the client certificate sent over https, as Consul's verify_incoming asks
		# # for; with key_file.
		# # string.
		# cert_file /etc/fit/example.com.pem

		# # A PEM file with cert_file's private key.
		# # string.
		# key_file /etc/fit/example.com.key

		# # The keys read are those starting with it. Each holds a JSON object of listeners, routes,
		# # upstreams and services, as a config holds them; keys ending in '/' and empty ones are passed
		# # over, and a key whose value is not such an object is left out and reported. fit/ when left
		# # out.
		# # string; default "fit/".
		# prefix fit/

		# # The most keys taken; past it, the rest, by key, are left out and reported. 1000 when left
		# # out or 0.
		# # integer, 0 or more; default 1000.
		# max_keys 1000

		# # How often what the keys provide is sent again whether or not it changed, so that a part
		# # refused because of the rest of the config is tried again. 30s when left out.
		# # duration, as "1.5s" or "2m"; default "30s".
		# refresh_interval 30s

		# # How long each request to Consul may take, connecting included, beyond the five minutes a
		# # blocking query waits for a change. 10s when left out.
		# # duration, as "1.5s" or "2m"; default "10s".
		# request_timeout 10s
	# }

	# # Listeners, routes, upstreams and services from the keys under a prefix in etcd, each holding
	# # a JSON object of them.
	# # object.
	# etcd {
		# # Where etcd's client API is: http:// or https:// and a host and port, for each member to try,
		# # in turn when one fails. http://127.0.0.1:2379 when left out.
		# # list of string; default ["http://127.0.0.1:2379"].
		# endpoints http://127.0.0.1:2379

		# # The user to authenticate as, with password_file, when etcd's authentication is on; none when
		# # left out.
		# # string.
		# username fit

		# # A file holding username's password, read each time a watch starts.
		# # string.
		# password_file /etc/fit/password

		# # A PEM file with the CAs etcd's certificate is verified with, over https; the system's when
		# # left out.
		# # string.
		# ca_file /etc/fit/ca.pem

		# # A PEM file with the client certificate sent over https, as etcd's client-cert-auth asks for;
		# # with key_file.
		# # string.
		# cert_file /etc/fit/example.com.pem

		# # A PEM file with cert_file's private key.
		# # string.
		# key_file /etc/fit/example.com.key

		# # The keys read are those starting with it. Each holds a JSON object of listeners, routes,
		# # upstreams and services, as a config holds them; keys ending in '/' and empty ones are passed
		# # over, and a key whose value is not such an object is left out and reported. fit/ when left
		# # out.
		# # string; default "fit/".
		# prefix fit/

		# # The most keys taken; past it, the rest, by key, are left out and reported. 1000 when left
		# # out or 0.
		# # integer, 0 or more; default 1000.
		# max_keys 1000

		# # How often the keys are read again whether or not a watch event came. 30s when left out.
		# # duration, as "1.5s" or "2m"; default "30s".
		# refresh_interval 30s

		# # How long each request to etcd may take, connecting included, and a watch to start; a watch
		# # then lasts until it fails. 10s when left out.
		# # duration, as "1.5s" or "2m"; default "10s".
		# request_timeout 10s
	# }

	# # Listeners, routes, services and upstreams from a Kubernetes cluster's Gateway API resources:
	# # the Gateways of the GatewayClasses whose controllerName is fit's, and their HTTPRoutes,
	# # GRPCRoutes, TLSRoutes, TCPRoutes and UDPRoutes, whose status fit writes back.
	# # object.
	# kubernetes {
		# # A kubeconfig file to reach the cluster with: its server, CA, client certificate, token or
		# # token file. When left out, the pod's service account, inside the cluster, or else
		# # $KUBECONFIG or ~/.kube/config. Exec and auth-provider plugins are not supported.
		# # string.
		# kubeconfig /etc/fit/kubeconfig

		# # The kubeconfig's context to use; its current-context when left out.
		# # string.
		# context prod

		# # The controllerName of the GatewayClasses whose Gateways fit serves. lesismal.github.io/fit
		# # when left out.
		# # string; default "lesismal.github.io/fit".
		# controller_name lesismal.github.io/fit

		# # The namespaces whose Gateways and routes are served; every namespace when left out.
		# # Resources are watched across the cluster either way, so fit's account needs to list and
		# # watch them cluster-wide, Secrets of type kubernetes.io/tls among them, and to patch the
		# # status of GatewayClasses, Gateways and routes.
		# # list of string.
		# namespaces default

		# # The IP address Gateway listeners are bound on, each on its port; every address when left
		# # out.
		# # string.
		# listen_host 0.0.0.0

		# # Where requests to a Service go: endpoints, to its ready endpoints from its EndpointSlices,
		# # balanced by fit; or cluster_ip, to its cluster IP, balanced by the cluster. endpoints when
		# # left out.
		# # one of: endpoints, cluster_ip; default "endpoints".
		# backends endpoints

		# # The most objects of each kind kept: past it, the rest are left out and reported. 10000 when
		# # left out or 0.
		# # integer, 0 or more; default 10000.
		# max_objects 10000

		# # How long each request to the API server may take, but watches, which last five minutes each.
		# # 10s when left out.
		# # duration, as "1.5s" or "2m"; default "10s".
		# request_timeout 10s

		# # The addresses where clients reach fit's Gateways, IP addresses or host names, written into
		# # each one's status.addresses, as clients of the Gateway API and its conformance tests read
		# # them. None are written when left out, and those there are kept.
		# # list of string.
		# addresses 203.0.113.10

		# # Serve Ingresses too: those whose ingressClassName, or kubernetes.io/ingress.class
		# # annotation, names an IngressClass whose controller is controller_name, and those naming none
		# # when such a class is the default. Their rules are served on http_port, and on https_port for
		# # the hosts of their tls, with the certificates of its Secrets. fit's account then needs to
		# # list and watch Ingresses and IngressClasses. No Ingresses when left out.
		# # object.
		# ingress {
			# # The port Ingresses' rules are served on over HTTP. 80 when left out or 0.
			# # integer; default 80.
			# http_port 80

			# # The port the hosts of Ingresses' tls are served on over HTTPS. 443 when left out or 0.
			# # integer; default 443.
			# https_port 443
		# }

		# # Send to the names of ExternalName Services that routes and Ingresses name as backends. Such
		# # a backend is refused when left out or false, and the route's status says so (ResolvedRefs
		# # false), since whoever can create a Service could otherwise send fit's requests to any host,
		# # fit's own Admin API on loopback among them. Even when true, names that are localhost, or
		# # loopback, link-local or unspecified addresses, are refused; a name is not resolved to be
		# # checked, so one that resolves to such an address is not caught.
		# # boolean.
		# external_name_services true

		# # The directory the certificates of HTTPS listeners are written to, from the Secrets they
		# # name, for fit's TLS to load: each Secret's chain and key in one file only fit's user may
		# # read, named for the Secret and a hash of its contents. Files of that form that are no longer
		# # named are removed. A directory of fit's own in the system's temporary directory, removed
		# # when fit stops, when left out.
		# # string.
		# certificates_dir /var/lib/fit/k8s-certs
	# }
# }
