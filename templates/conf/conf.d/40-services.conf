# fit's config template as a directory: every field of the config and of every module's
# params, in files by kind. Generated by schema.TemplateDir; regenerate with:
# go test ./schema -update
#
# fit run -c <this directory> reads every file in it, its subdirectories too, in lexical
# order. listeners, routes, upstreams, services and providers are joined across the files;
# any other field is written in one file only. What is written out runs as it is: a
# listener on :8080, example.com answering "hello from fit", and api.example.com proxied
# to 127.0.0.1:9000. Every other field is commented out, with its default or an example:
# uncomment what you need. docs/reference/config.md describes them all.
#
# This file:
# Layer 4 services: the connections of tcp listeners and the datagrams of udp ones,
# proxied to an upstream.

# Layer 4 services: the upstreams the connections of tcp listeners are proxied to, byte for
# byte, and the datagrams of udp listeners, one for one.
# list of object.
# service {
	# # A name unique among the services.
	# # string; required.
	# name postgres

	# # The names of the listeners whose connections the service takes: those that serve tcp, alone
	# # or beside other protocols, and udp listeners, each one service's. A udp listener's session
	# # is a client's address: the datagrams it sends go to one upstream address, from a socket of
	# # the session's own, and what comes back to that socket goes to the client.
	# # list of string; required.
	# listeners postgres

	# # The name of the upstream connections go to: one of its addresses, picked by its
	# # load_balancing (ip_hash by the client's address; header, cookie and URI hashes, which a
	# # connection has none of, in turn), out of rotation for its max_fails and health checks as for
	# # HTTP, dialed within its connect_timeout. A connect that fails is tried on the next address
	# # picked, up to three addresses. Its protocol and HTTP settings are not used.
	# # string; required.
	# upstream db

	# # How long a connection or a udp session may carry nothing either way before both sides are
	# # closed; 10m for a connection and 1m for a udp session when left out.
	# # duration, as "1.5s" or "2m".
	# idle_timeout 30m

	# # The most connections and udp sessions the service proxies at once; a connection past it is
	# # closed as soon as it is accepted, and the datagrams of a session past it are dropped. 10000
	# # when left out or 0.
	# # integer, 0 or more; default 10000.
	# max_conns 10000

	# # The server names (SNI) of the TLS connections the service takes from its tcp listeners,
	# # which it proxies as they are, without terminating their TLS; "*.example.com" takes the names
	# # one label below example.com. A tcp listener may then be listed by several services: a
	# # connection goes to the one whose names hold the name its ClientHello asks for, or else to
	# # the listener's service without server_names, if it has one, as one that is not TLS or asks
	# # for no name does; otherwise it is closed. The ClientHello must come within 10s.
	# # list of string.
	# server_names db.example.com

	# # The client addresses the service takes, deciding before its listener's access and the global
	# # one: a connection it refuses is closed, once its PROXY header and ClientHello are read when
	# # the listener needs them, and the datagrams of a udp session it refuses are dropped.
	# # object.
	# access {
		# # IP addresses and CIDR prefixes served, as "10.0.0.0/8" or "2001:db8::/32": with any entry
		# # here or in allow_files, every address neither holds is refused, unless deny refuses it
		# # first.
		# # list of string.
		# allow 10.0.0.0/8 192.168.0.0/16

		# # IP addresses and CIDR prefixes refused, whatever allow holds.
		# # list of string.
		# deny 203.0.113.0/24

		# # Files of more allow entries, one on each line, each line told apart by its content: an
		# # address or prefix, with what follows # or ; left out, as the lists published for firewalls
		# # are written; a range, first-last; an eMule ipfilter.dat line, first - last , level , name,
		# # where a level above 127 is not listed; or a PeerGuardian .p2p line, name:first-last. IPv4
		# # addresses of ranges may have leading zeros. Blank lines and lines that begin with #, ; or //
		# # are left out; any other line is an error. Read when the config is applied, and applied again
		# # when one changes; each at most 64 MiB.
		# # list of string.
		# allow_files

		# # Files of more deny entries, written as allow_files.
		# # list of string.
		# deny_files
	# }

	# # Send each upstream connection a PROXY protocol header of this version (v1, text, or v2,
	# # binary) first, naming the client's address and the one it connected to. For tcp listeners.
	# # one of: v1, v2.
	# proxy_protocol v1
# }
