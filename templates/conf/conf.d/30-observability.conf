# fit's config template as a directory: every field of the config and of every module's
# params, in files by kind. Generated by schema.TemplateDir; regenerate with:
# go test ./schema -update
#
# fit run -c <this directory> reads every file in it, its subdirectories too, in lexical
# order. listeners, routes, upstreams, services and providers are joined across the files;
# any other field is written in one file only. What is written out runs as it is: a
# listener on :8080, example.com answering "hello from fit", and api.example.com proxied
# to 127.0.0.1:9000. Every other field is commented out, with its default or an example:
# uncomment what you need. docs/reference/config.md describes them all.
#
# This file:
# What fit tells about itself: its own log, the access log, OpenTelemetry, request
# metrics, runtime profiles, and the Admin API.

# fit's own log: what it says about starting, reloading, certificates, providers and the
# engine, by logger, each with the least level written, and the format and output it writes
# in, as fib writes its own. Messages at info and debug to stdout and the rest to stderr, at
# info and above, as lines, when left out.
# object.
# log {
	# # The least level written, of every logger levels and loggers do not set one for: debug, info,
	# # warn or error. info when left out. A change takes effect on reload.
	# # one of: debug, info, warn, error; default "info".
	# level info

	# # The least level of some loggers, by name, over level: server (listeners, loading and
	# # reloading configs, shutting down), admin (the Admin API), tls (certificates: ACME, OCSP,
	# # certificate files), provider (providers), telemetry (exporting over OTLP), access_log (the
	# # access log's dropped lines), plugin (wasm plugins), fastcgi (what FastCGI applications write
	# # to their stderr), llm and tunnel (their roles), webrtc (the TURN server) and engine (fib,
	# # the network engine, and whatever else writes to Go's log and log/slog). The same as loggers'
	# # level, which a logger may not have both of. A change takes effect on reload.
	# # object of string.
	# levels {
	# 	engine warn
	# 	tls debug
	# }

	# # "stdout", "stderr", or the path of a file messages are appended to, of every logger loggers
	# # does not set one for. When left out, debug and info messages go to stdout and warn and error
	# # ones to stderr. A change takes a restart.
	# # string.
	# output /var/log/fit/fit.log

	# # How messages are written, those of every logger loggers does not set one for, as fib writes
	# # its own: line, the time, level and message, then the attributes as key=value; text, every
	# # part as key=value (logfmt); or json, a JSON object a line. Each carries the logger's name as
	# # logger. line when left out. A change takes a restart.
	# # one of: line, text, json; default "line".
	# format line

	# # The zone the time of every line is written in, and the zone a file's interval is rotated at:
	# # local (the default), utc, or an IANA zone name such as Asia/Shanghai. So 24h turns at local
	# # midnight by default, and at UTC midnight with utc. The zone database is embedded, so an IANA
	# # name works in a container without zoneinfo. A change takes effect on reload.
	# # string.
	# time_zone ""

	# # Rotate the file log.output names, and remove old rotated files: the size and interval a file
	# # is rotated at, and the age, count and total size past which rotated files are removed. None
	# # when left out: the file grows without bound, as before.
	# # object.
	# rotate {
		# # How large a file may grow before it is rotated: a write that would take it past this starts
		# # a new file. 1 GiB when left out; 0 does not rotate by size.
		# # integer, 0 or more; default 1073741824.
		# max_bytes 1073741824

		# # How long a file is written before it is rotated, at the next period boundary of the log's
		# # time_zone: 24h turns at midnight, 1h on the hour; a fraction of a second, or a period over
		# # 24h that is not a whole number of days, is refused. Off when left out.
		# # duration, as "1.5s" or "2m".
		# interval 10s

		# # How long a rotated file is kept after it was last written: 720h (30 days) when left out; 0
		# # keeps it until a count or size limit removes it.
		# # duration, as "1.5s" or "2m"; default "720h".
		# max_age 720h

		# # The most rotated files kept, newest first; 0 or left out has no count limit.
		# # integer, 0 or more.
		# max_files 0

		# # The most the rotated files may total, the oldest removed until they fit. 1 GiB when left
		# # out; 0 does not limit the total.
		# # integer, 0 or more; default 1073741824.
		# max_total_bytes 1073741824

		# # Gzip a file when it is rotated. On when left out.
		# # boolean; default true.
		# compress true
	# }

	# # Settings of some loggers of their own, by name (those levels lists), over level, output,
	# # format and rotate: engine's to a file of its own, say, or access_log's as json.
	# # object of object.
	# loggers {
	# 	engine {
	# 		format json
	# 		output /var/log/fit/engine.log
	# 	}
	# }
# }

# Where a line is written for each request, as JSON or, as its format says, text or line; no
# access log when left out.
# object.
# access_log {
	# # "stdout", "stderr", or the path of a file lines are appended to; "stdout" when left out.
	# # string; default "stdout".
	# output /var/log/fit/access.log

	# # How long a line may wait in the buffer before it is written; 1s when left out.
	# # duration, as "1.5s" or "2m"; default "1s".
	# flush_interval 1s

	# # How many bytes of lines may wait to be written; lines past it are dropped. 4 MiB when left
	# # out.
	# # integer, 0 or more; default 4194304.
	# buffer_bytes 4194304

	# # The least level of the requests written: a response with a status below 400 is info, a 4xx
	# # warn and a 5xx error, so warn writes the requests answered with 4xx and 5xx, and error those
	# # answered with 5xx. Every request when left out. A change takes effect on reload.
	# # one of: info, warn, error; default "info".
	# level info

	# # How a request's line is written, with the same fields whichever: json, a JSON object; text,
	# # time, level, msg and the fields as key=value (logfmt); or line, the time and level, then the
	# # fields as key=value, as fit's own log writes lines. A request's level is its status's, as
	# # level says. json when left out. A change takes a restart.
	# # one of: json, text, line; default "json".
	# format json

	# # The zone a line's time is written in, and the zone a file's interval is rotated at: local
	# # (the default), utc, or an IANA zone name such as Asia/Shanghai. json and text wrote UTC and
	# # line local before this setting; now every format writes this zone, local when left out, and
	# # 24h turns at local midnight. A change takes effect on reload.
	# # string.
	# time_zone ""

	# # Rotate the file output names, and remove old rotated files: the size and interval a file is
	# # rotated at, and the age, count and total size past which rotated files are removed. None
	# # when left out: the file grows without bound, as before.
	# # object.
	# rotate {
		# # How large a file may grow before it is rotated: a write that would take it past this starts
		# # a new file. 1 GiB when left out; 0 does not rotate by size.
		# # integer, 0 or more; default 1073741824.
		# max_bytes 1073741824

		# # How long a file is written before it is rotated, at the next period boundary of the log's
		# # time_zone: 24h turns at midnight, 1h on the hour; a fraction of a second, or a period over
		# # 24h that is not a whole number of days, is refused. Off when left out.
		# # duration, as "1.5s" or "2m".
		# interval 10s

		# # How long a rotated file is kept after it was last written: 720h (30 days) when left out; 0
		# # keeps it until a count or size limit removes it.
		# # duration, as "1.5s" or "2m"; default "720h".
		# max_age 720h

		# # The most rotated files kept, newest first; 0 or left out has no count limit.
		# # integer, 0 or more.
		# max_files 0

		# # The most the rotated files may total, the oldest removed until they fit. 1 GiB when left
		# # out; 0 does not limit the total.
		# # integer, 0 or more; default 1073741824.
		# max_total_bytes 1073741824

		# # Gzip a file when it is rotated. On when left out.
		# # boolean; default true.
		# compress true
	# }
# }

# OpenTelemetry: traces of requests, with W3C trace context sent on to upstreams, and metrics,
# exported over OTLP/HTTP to a collector. Neither when left out. Read when fit starts: a
# change takes effect when fit restarts.
# object.
# telemetry {
	# # The OTLP/HTTP receiver: http:// or https:// and a host and port, as of an OpenTelemetry
	# # Collector; traces go to its /v1/traces and metrics to /v1/metrics, as JSON.
	# # http://127.0.0.1:4318 when left out.
	# # string; default "http://127.0.0.1:4318".
	# endpoint http://127.0.0.1:4318

	# # A file of header fields sent with each export, one "Name: value" a line, as an API key a
	# # receiver asks for; read when fit starts. None when left out.
	# # string.
	# headers_file /etc/fit/otlp-headers

	# # A PEM file with the CAs the receiver's certificate is verified with, over https; the
	# # system's when left out.
	# # string.
	# ca_file /etc/fit/ca.pem

	# # A PEM file with the client certificate sent over https; with key_file.
	# # string.
	# cert_file /etc/fit/example.com.pem

	# # A PEM file with cert_file's private key.
	# # string.
	# key_file /etc/fit/example.com.key

	# # The service.name of the resource traces and metrics are about. fit when left out.
	# # string; default "fit".
	# service_name fit

	# # How long an export may take, connecting included; a batch not sent by then is dropped and
	# # counted. 10s when left out.
	# # duration, as "1.5s" or "2m"; default "10s".
	# timeout 10s

	# # Trace requests: a server span for each one sampled, and its context sent on to upstreams in
	# # traceparent. No traces when left out.
	# # object.
	# traces {
		# # The share of requests traced among those whose caller did not decide: from 0 to 1. A request
		# # whose traceparent says its caller sampled it is always traced, and one that says it did not
		# # is never. 0, only those a caller sampled, when left out.
		# # number, 0 to 1.
		# sample_ratio 0.1

		# # The most bytes of spans waiting to be exported, besides the batch being sent; spans past it
		# # are dropped and counted. 4 MiB when left out or 0.
		# # integer, 0 or more; default 4194304.
		# max_queue_bytes 4194304

		# # How often spans are exported, and sooner when 256 KiB of them wait. 5s when left out.
		# # duration, as "1.5s" or "2m"; default "5s".
		# interval 5s
	# }

	# # Export the metrics the Admin API's /metrics serves, requests counted included, every
	# # interval. No metrics over OTLP when left out.
	# # object.
	# metrics {
		# # How often the metrics are exported. 30s when left out.
		# # duration, as "1.5s" or "2m"; default "30s".
		# interval 30s
	# }
# }

# The Admin API, through which the running config is read and replaced, and which serves
# metrics in Prometheus's text format at /metrics; off when left out. Its settings are read
# when fit starts: a change to them takes effect when fit restarts.
# object.
# admin {
	# # Where the Admin API listens: a host and port, or "unix/" and the path of a Unix socket, as
	# # in "unix//run/fit/admin.sock". A host that is not a loopback address or localhost needs
	# # token_file, cert_file and key_file, so that only holders of the token reach the API and the
	# # token never crosses a network in the clear. 127.0.0.1:2019 when left out.
	# # string; default "127.0.0.1:2019".
	# address 127.0.0.1:2019

	# # Listen the Admin API with Multipath TCP where the kernel offers it (Linux 5.6+,
	# # net.mptcp.enabled), falling back to plain TCP where it does not. Off by default; a Unix
	# # socket has no paths.
	# # boolean.
	# mptcp true

	# # A file holding a token that every request must carry, as "Authorization: Bearer <token>"; no
	# # token is asked for when left out.
	# # string.
	# token_file /etc/fit/token

	# # A PEM file with the Admin API's certificate, followed by any intermediates; with key_file,
	# # the API is served over TLS, 1.2 or later. The files are read again when they change, so that
	# # a renewed certificate is served without a restart. Not for a Unix socket.
	# # string.
	# cert_file /etc/fit/example.com.pem

	# # A PEM file with the certificate's private key.
	# # string.
	# key_file /etc/fit/example.com.key

	# # A PEM file with the CAs that clients' certificates must chain to: with it, every client must
	# # present a valid certificate, besides the token, before it is heard. Needs cert_file and
	# # key_file; read again when it changes, as they are.
	# # string.
	# client_ca_file ""

	# # How many of the configs applied, the running one included, are kept to be read back. 10 when
	# # left out or 0.
	# # integer, 0 or more; default 10.
	# history 10

	# # The largest config the Admin API takes; a larger one gets 413. 4 MiB when left out or 0.
	# # integer, 0 or more; default 4194304.
	# max_config_bytes 4194304

	# # The most connections the Admin API keeps open at once, a quarter of them kept for those that
	# # have made a request with the token (any request, without token_file). When they are taken, a
	# # new connection closes the oldest of those that have not, of the client holding the most, and
	# # is closed as it is accepted only when every one has; one past a client's share, a quarter of
	# # them, is closed too, but for loopback clients. A connection that has not is closed 5s after
	# # it is accepted, whatever it is doing. 16 when left out or 0.
	# # integer, 0 or more; default 16.
	# max_conns 16

	# # This fit's node ID, which the Admin API's GET /node answers and a manager of many fits knows
	# # it by: 1 to 64 letters, digits, '.', '_' and '-', starting with a letter or digit. Left out,
	# # fit makes one, a random UUID, once, and keeps it in the store, or without one in a file
	# # beside the config, as fit.node-id beside fit.json; set it where neither lasts, as in a
	# # container whose config is read-only.
	# # string.
	# node_id ""

	# # Do not serve the dashboard, the read-only web pages at /dashboard/ that show the routes,
	# # services, upstreams and their health, certificates and config versions from the Admin API's
	# # GET endpoints; served when left out or false.
	# # boolean.
	# disable_dashboard true

	# # Keep the config encrypted in a file of its own, the store, which is the base config fit runs
	# # from then on: every config applied is written to it, and what this file sets beside admin is
	# # only the store's first content, used when the store does not exist yet. Left out, the config
	# # lives in this file.
	# # object.
	# store {
		# # The store's file, made 0600 when it is written. fit stops at start if it exists and does not
		# # open with the password.
		# # string; required.
		# path /var/lib/fit/fit.store

		# # The password the store is encrypted with. Written here, it protects a store copied away from
		# # this file, not one read beside it; password_file or password_env keep it out of the file.
		# # string.
		# password ""

		# # A file holding the password, its surrounding spaces trimmed.
		# # string.
		# password_file /etc/fit/store-password

		# # An environment variable holding the password.
		# # string.
		# password_env FIT_STORE_PASSWORD
	# }

	# # Serve the console, web pages behind a user name and password from which the whole config,
	# # admin aside, is read and changed; off when left out.
	# # object.
	# console {
		# # The host and port the console listens on. A host that is not a loopback address needs
		# # cert_file and key_file, so that passwords never cross a network in the clear. 127.0.0.1:2020
		# # when left out.
		# # string; default "127.0.0.1:2020".
		# address 127.0.0.1:2020

		# # Listen the console with Multipath TCP where the kernel offers it (Linux 5.6+,
		# # net.mptcp.enabled), falling back to plain TCP where it does not. Off by default.
		# # boolean.
		# mptcp true

		# # A PEM file with the console's certificate, followed by any intermediates; with key_file, the
		# # console is served over TLS.
		# # string.
		# cert_file /etc/fit/example.com.pem

		# # A PEM file with the certificate's private key.
		# # string.
		# key_file /etc/fit/example.com.key

		# # Who may log in: at least one user.
		# # list of object; required.
		# users {
			# # The user's name.
			# # string; required.
			# username admin

			# # The bcrypt hash of the user's password, as fit hash-password makes it.
			# # string; required.
			# password_hash $2a$14$Zkx19XLiW6VYouLHR5NmfOFU0z2GTNmpkT/5qqR7hx4IjWJPDhjvG
		# }

		# # How long a login lasts without a request. 30m when left out.
		# # duration, as "1.5s" or "2m"; default "30m".
		# session_timeout 30m

		# # How long a login lasts at most, however busy. 12h when left out.
		# # duration, as "1.5s" or "2m"; default "12h".
		# session_lifetime 12h

		# # The most logins kept at once; one more ends the oldest. 64 when left out or 0.
		# # integer, 0 or more; default 64.
		# max_sessions 64

		# # The most connections the console keeps open at once, a quarter of them kept for those with a
		# # login. When they are taken, a new connection closes the oldest of those without one, of the
		# # client holding the most, and is closed as it is accepted only when every one has a login;
		# # one past a client's share, a quarter of them, is closed too, but for loopback clients. 32
		# # when left out or 0.
		# # integer, 0 or more; default 32.
		# max_conns 32
	# }

	# # The workbench's assistant, a chat beside the console's pages that reads what fit does and
	# # drafts changes for a person to submit, calling the model APIs set here; off when left out,
	# # and then nothing is sent anywhere. Needs console. With a store, these settings are the first
	# # ones only: once the Settings page saves, the store's are used, keys included.
	# # object.
	# assistant {
		# # The model APIs the assistant may call, each by name. Their keys are not written here: the
		# # Settings page keeps them in admin.store, or api_key_env names a variable that holds one.
		# # list of object.
		# providers {
			# # The provider's name, which default_model and the Settings page name it by: letters, digits,
			# # '_', '.' and '-'.
			# # string; required.
			# name ""

			# # The API it speaks: anthropic (Messages), openai (Chat Completions), openai_responses
			# # (Responses), gemini (generateContent), azure_openai (Chat Completions of a deployment),
			# # ollama (/api/chat), openai_compatible (Chat Completions at any base_url, as vLLM, llama.cpp,
			# # DeepSeek or a gateway), or llm_proxy, this fit's own llm.proxy, reached on its api address,
			# # so that the assistant uses the mesh's models.
			# # one of: anthropic, openai, openai_responses, gemini, azure_openai, ollama, openai_compatible, llm_proxy; required.
			# kind anthropic

			# # The API's base URL, as https://api.openai.com/v1; the vendor's when left out, and needed for
			# # openai_compatible and azure_openai. Not for llm_proxy. A key is sent only over https, or to
			# # a loopback host.
			# # string.
			# base_url ""

			# # The api-version of an azure_openai provider's calls, as 2024-10-21; needed for it, and for
			# # no other kind.
			# # string.
			# api_version ""

			# # An environment variable holding the API key, read when a call is made; a key the Settings
			# # page keeps in the store comes first.
			# # string.
			# api_key_env ""

			# # Headers sent with every call, as an organization or a gateway's own; not the key's headers,
			# # Host or the body's framing.
			# # object of string.
			# headers {}

			# # The models offered from this provider; the Settings page reads the provider's own list to
			# # add them.
			# # list of object.
			# models {
				# # The model's ID, as the provider names it.
				# # string; required.
				# name ""

				# # The model's context window, in tokens; 0 or left out when not known.
				# # integer, 0 or more.
				# context prod

				# # Whether the model calls tools. On when left out.
				# # boolean; default true.
				# tools true
			# }

			# # How long a connect, TLS included, may take. 10s when left out.
			# # duration, as "1.5s" or "2m"; default "10s".
			# connect_timeout 10s

			# # How long a call may wait for its answer to begin. 2m when left out.
			# # duration, as "1.5s" or "2m"; default "2m".
			# first_byte_timeout 2m

			# # How long a streamed answer may go silent. 1m when left out.
			# # duration, as "1.5s" or "2m"; default "1m".
			# idle_timeout 1m

			# # The most one call may take, to the end of its answer. 10m when left out.
			# # duration, as "1.5s" or "2m"; default "10m".
			# timeout 10m

			# # How often a call is tried again when it failed before any of its answer was taken: the
			# # connect failed, or the API answered 408, 429, 500, 502, 503, 504 or 529. 2 when left out; 0
			# # tries once.
			# # integer, 0 to 5; default 2.
			# retries 2
		# }

		# # The provider and model the chat uses; the first model of the first provider when left out.
		# # object.
		# default_model {
			# # A provider's name.
			# # string; required.
			# provider ""

			# # The model's ID.
			# # string; required.
			# model ""
		# }

		# # What a model call asks for: its output, temperature and thinking.
		# # object.
		# params {
			# # The most tokens a model's answer may have. 4096 when left out or 0.
			# # integer, 0 or more; default 4096.
			# max_output_tokens 4096

			# # The sampling temperature; the model's own when left out.
			# # number, 0 to 2.
			# temperature 0

			# # How much a model that thinks before it answers may: off, low, medium or high, as its API
			# # takes it (an effort, or a budget of tokens). off when left out.
			# # one of: off, low, medium, high; default "off".
			# thinking off
		# }

		# # Bounds on the assistant's conversations, tool calls and model answers; the defaults when
		# # left out.
		# # object.
		# limits {
			# # The most turns a conversation keeps, a user's message and the answer to it each. 40 when
			# # left out or 0.
			# # integer, 0 or more; default 40.
			# max_turns 40

			# # The most tools an answer may call before the assistant stops it. 16 when left out or 0.
			# # integer, 0 or more; default 16.
			# max_tool_calls 16

			# # The most bytes of a tool's result handed to the model; a longer one is cut, and says so. 32
			# # KiB when left out or 0.
			# # integer, 0 or more; default 32768.
			# max_tool_result_bytes 32768

			# # The most conversations kept for each user; one more removes the oldest. 50 when left out or
			# # 0.
			# # integer, 0 or more; default 50.
			# max_conversations 50

			# # The most answers being made at once, across users; one more is refused until one ends. 4
			# # when left out or 0.
			# # integer, 0 or more; default 4.
			# max_concurrent_chats 4

			# # The most tokens, in and out, one user's calls may take in a day, as the APIs count them.
			# # 1000000 when left out or 0.
			# # integer, 0 or more; default 1000000.
			# max_tokens_per_day 1000000

			# # The most bytes of one model answer as it streams in; a larger one is cut and fails. 8 MiB
			# # when left out or 0.
			# # integer, 0 or more; default 8388608.
			# max_stream_bytes 8388608

			# # The most entries the assistant's audit log keeps; one more removes the oldest. 1000 when
			# # left out or 0.
			# # integer, 0 or more; default 1000.
			# max_audit_entries 1000
		# }

		# # What of fit's logs may be sent to a model, and more of what is redacted before anything is.
		# # object.
		# data {
			# # Let the tools hand lines of fit's own log to the model, redacted. Off by default.
			# # boolean.
			# send_logs true

			# # Let the tools hand lines of the access log to the model, redacted. Off by default.
			# # boolean.
			# send_access_log true

			# # Let the media tools hand playback sessions' subjects to the model as they are. Off by
			# # default: each subject is replaced by a hash of it, the same for one subject while fit runs,
			# # which the propose tools take back.
			# # boolean.
			# send_subjects true

			# # Regular expressions (Go's syntax) whose matches are replaced in everything the tools hand a
			# # model, beside the keys, hashes, tokens and private keys that always are.
			# # list of string.
			# redact
		# }

		# # What each console user may have the assistant do, by user name; a user not listed has
		# # default_level.
		# # list of object.
		# users {
			# # A console user's name.
			# # string; required.
			# username fit

			# # What the user may have the assistant do: off, read, edit, propose or apply, each including
			# # the ones before it.
			# # one of: off, read, edit, propose, apply; required.
			# level off
		# }

		# # The level of a console user that users does not list: off, read (the read tools only), edit
		# # (also drafts on the open page, never submitted), propose (also proposals) or apply (also
		# # applies them). read when left out.
		# # one of: off, read, edit, propose, apply; default "read".
		# default_level read

		# # An MCP server at /mcp on the console's address, for outside agents (Claude Code, Cursor, an
		# # SDK's client) to call the assistant's tools, read the config, the schema and the docs, and
		# # use the skills as prompts, with the MCP tokens users make on the workbench's MCP page. A
		# # token has its user's level, at most propose: what it proposes is applied only in the
		# # workbench. Off when left out.
		# # object.
		# mcp {
			# # The addresses (as 127.0.0.1) and prefixes (as 10.0.0.0/8) MCP clients may call from; a token
			# # may narrow them further. Loopback only when left out.
			# # list of string.
			# allow *.example.com 10.1.0.0/16

			# # The most MCP tokens a console user may hold. 10 when left out or 0.
			# # integer, 0 or more; default 10.
			# max_tokens_per_user 10

			# # The longest a token may last, in days, from when it is made. 90 when left out or 0.
			# # integer, 0 to 3650; default 90.
			# max_token_days 90

			# # The most sessions a token keeps for clients of the protocol's versions before 2026-07-28,
			# # which open one with initialize; one more ends the one used least recently. 4 when left out
			# # or 0.
			# # integer, 0 or more; default 4.
			# max_sessions 4

			# # How long such a session is kept without a request. 1h when left out.
			# # duration, as "1.5s" or "2m"; default "1h".
			# session_idle_timeout 1h

			# # The most bytes of a request's body, beside the console's own bound. 1 MiB when left out or
			# # 0.
			# # integer, 0 to 8388608; default 1048576.
			# max_request_bytes 1048576

			# # The most requests of one token served at once; one more is answered 429. 4 when left out or
			# # 0.
			# # integer, 0 to 64; default 4.
			# max_concurrent_calls 4

			# # The most requests of one token in a minute; past it they are answered 429 until the minute's
			# # share comes back. 120 when left out or 0.
			# # integer, 0 to 6000; default 120.
			# max_calls_per_minute 120
		# }
	# }

	# # Manage other fits from this one, the manager: their addresses and credentials, added on the
	# # workbench's Cluster pages, are kept in the store, and each one's state is read every
	# # poll_interval. Off when left out, and then nothing is called. Needs store and console. See
	# # decision 033.
	# # object.
	# cluster {
		# # How often each member's GET /node, /status and /config/check are read. 10s when left out; 1s
		# # at least.
		# # duration, as "1.5s" or "2m"; default "10s".
		# poll_interval 10s

		# # The longest one call to a member may take, from its connect to the last byte of its answer;
		# # the connect and the wait for the answer's header are bounded by it too. 10s when left out;
		# # 1s at least.
		# # duration, as "1.5s" or "2m"; default "10s".
		# timeout 10s

		# # The most members the manager keeps; one more is refused. 256 when left out or 0.
		# # integer, 0 to 10000; default 256.
		# max_nodes 256

		# # The most members polled at once; the others wait for their turn. Tests from the pages run
		# # beside them, 4 at most. Each operation on many members (reload, rollback, check, purge,
		# # test) calls at most this many of them at once too. 8 when left out or 0.
		# # integer, 0 to 256; default 8.
		# max_concurrency 8

		# # The largest answer read from a member; a larger one fails its call, and is reported as too
		# # large. 4 MiB when left out or 0; 16 KiB at least.
		# # integer, 0 to 67108864; default 4194304.
		# max_response_bytes 4194304

		# # Where members that link out to the manager reach it, as ":7444" or "0.0.0.0:7444": a
		# # WebSocket listener over TLS, with a self-signed certificate the manager makes once and keeps
		# # in the store, which each member pins when it enrolls. Members behind NAT, or with no port
		# # open, link here with the config line Add by enrollment gives, and are managed through their
		# # link as the others are over HTTP. Off when left out: no member can enroll.
		# # string.
		# link_address ""

		# # The URL members reach link_address at, as "wss://manager.example.com:7444/cluster/link",
		# # which the config line Add by enrollment gives names; when left out, the host the page was
		# # opened at and link_address's port. Only a wss URL.
		# # string.
		# link_url ""
	# }

	# # Link this fit out to a manager of many fits, which then manages it through the link as it
	# # manages others over HTTP: for a fit behind NAT, or with no port open to the manager. The
	# # manager's Add by enrollment gives the line to paste here. Off when left out, and then
	# # nothing is dialed. Read when fit starts. See decision 033.
	# # object.
	# cluster_member {
		# # The manager's link URL, as its Add by enrollment page gives it:
		# # wss://host:port/cluster/link.
		# # string; required.
		# manager ""

		# # The SHA-256 of the manager's link certificate, 64 hex digits, with or without colons, as the
		# # page gives it: the only certificate this fit links to.
		# # string; required.
		# fingerprint ""

		# # The enrollment token the manager made for this fit, fite1.<ID>.<secret>, used once: this fit
		# # proves it to the manager, which answers a credential of this fit's own, kept in the store,
		# # or without one in a file beside the config (fit.cluster-member beside fit.json); the token
		# # is not used again. Left out once this fit has a credential; a new token enrolls this fit
		# # again.
		# # string.
		# token ""

		# # A file holding the enrollment token, in place of token.
		# # string.
		# token_file /etc/fit/token
	# }
# }

# Count and time requests by listener and route, for the Admin API's /metrics, which serves
# the rest of fit's metrics without it; off when left out, since it costs every request a
# little. Needs admin.
# object.
# metrics {
# }

# Serve Go's runtime profiles, as net/http/pprof does, at the Admin API's /debug/pprof/: CPU,
# heap, allocations, goroutines, blocking, mutexes and execution traces, for go tool pprof and
# go tool trace. Off when left out: the endpoints answer 404, and blocking and mutexes are not
# sampled. Follows every config applied, with no restart. Needs admin; served on the Admin
# API's own address, behind its token, and not through the console.
# object.
# pprof {
	# # Sample goroutines blocking on channels, selects and locks for the block profile: one event
	# # per this many nanoseconds spent blocked, on average, 1 for every one. 0, none, when left
	# # out; set it only while looking, since it costs every blocking event.
	# # integer, 0 or more.
	# block_profile_rate 0

	# # Sample one in this many contended mutexes for the mutex profile, 1 for every one. 0, none,
	# # when left out.
	# # integer, 0 or more.
	# mutex_profile_fraction 0

	# # The longest a profile's seconds may ask for: a CPU profile or a trace samples for that long,
	# # and a delta profile waits that long, holding its connection to the Admin API all the while;
	# # a request for longer is refused with 400. 1m when left out.
	# # duration, as "1.5s" or "2m"; default "1m".
	# max_duration 1m
# }
