# The docs site: files from /srv/docs, a search service, staff pages behind
# a password, and a page counter in Lua.
http {
    server {
        listen 8080;
        server_name docs.example.org;
        root /srv/docs;
        index index.html;

        location = /nginx_status {
            stub_status;
        }

        location /assets/ {
            expires 30d;
        }

        location /search {
            proxy_pass http://127.0.0.1:7700;
        }

        location /private/ {
            auth_basic "Staff";
            auth_basic_user_file /etc/nginx/htpasswd;
        }

        location = /counter {
            content_by_lua_block {
                local redis = require "resty.redis"
                local r = redis:new()
                r:connect("127.0.0.1", 6379)
                ngx.say("{\"views\": ", r:incr("views"), "}") -- a } in a string
            }
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
