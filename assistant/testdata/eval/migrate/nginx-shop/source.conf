# The shop: HTTP sent to HTTPS, the API behind a balanced pool, an admin
# area for the office only, and the storefront.
http {
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;

    upstream shop_api {
        least_conn;
        server 10.0.1.10:8080;
        server 10.0.1.11:8080;
    }

    server {
        listen 80;
        server_name shop.example.com;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        server_name shop.example.com;
        ssl_certificate     /etc/nginx/tls/shop.crt;
        ssl_certificate_key /etc/nginx/tls/shop.key;
        client_max_body_size 20m;
        error_page 502 503 /maintenance.html;

        location /api/ {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://shop_api;
            proxy_connect_timeout 3s;
        }

        location /admin/ {
            allow 192.168.10.0/24;
            deny all;
            proxy_pass http://10.0.1.20:9000;
        }

        location / {
            proxy_pass http://10.0.1.30:3000;
            sub_filter 'http://shop.internal' 'https://shop.example.com';
            sub_filter_once off;
        }
    }
}
