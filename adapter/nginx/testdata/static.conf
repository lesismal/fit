# A single-page app with its assets, a health check and an old path.
http {
    server {
        listen 8080;
        server_name app.test *.app.test;
        root /srv/app;
        index index.html;

        add_header X-Frame-Options DENY;

        location = /health {
            return 200 "ok";
        }

        location ~* \.(css|js|png)$ {
            add_header Cache-Control "public, max-age=86400";
        }

        location ^~ /downloads/ {
            alias /srv/files/;
        }

        location /old/ {
            rewrite ^/old/(.*)$ /new/$1 permanent;
        }

        location /docs/ {
            rewrite ^/docs/(.*)$ /manual/$1 break;
            try_files $uri $uri/ =404;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
