<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>fit console</title>
<link rel="stylesheet" href="app.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%23176b5b'/%3E%3C/svg%3E">
</head>
<body>
<header>
  <div class="brand"><span class="mark"></span>fit console</div>
  <nav id="tabs" hidden>
    <a href="#config" data-tab="config">Config</a>
    <a href="#json" data-tab="json">JSON</a>
    <a href="#versions" data-tab="versions">Versions</a>
  </nav>
  <div class="state" id="who" hidden>
    <span id="user"></span>
    <button type="button" class="link" id="logout">Log out</button>
  </div>
</header>

<main>
  <div id="message" class="banner" hidden></div>

  <form id="login" class="card login" hidden>
    <h2>Log in</h2>
    <label>User name <input id="username" autocomplete="username" required></label>
    <label>Password <input type="password" id="password" autocomplete="current-password" required></label>
    <button type="submit">Log in</button>
  </form>

  <div id="app" hidden>
    <div class="bar">
      <span id="status" class="muted"></span>
      <span class="spacer"></span>
      <button type="button" id="discard" class="secondary">Discard changes</button>
      <button type="button" id="save">Save and apply</button>
    </div>
    <div id="problems" class="problems" hidden></div>

    <section id="config" class="tab">
      <div class="editor">
        <ul id="sections" class="sections"></ul>
        <div id="form" class="form"></div>
      </div>
    </section>

    <section id="json" class="tab" hidden>
      <p class="hint">The whole config as JSON, admin aside: it is set in the file fit was started with. Saving checks it and applies it as one.</p>
      <textarea id="raw" spellcheck="false" aria-label="config as JSON"></textarea>
    </section>

    <section id="versions" class="tab" hidden>
      <table id="versions-table"><thead><tr><th>Version</th><th>Applied</th><th>Source</th><th>Size</th><th></th></tr></thead><tbody></tbody></table>
      <div id="version-view" hidden>
        <h2 id="version-title"></h2>
        <pre id="version-body"></pre>
      </div>
    </section>
  </div>
</main>
<script src="app.js"></script>
</body>
</html>
